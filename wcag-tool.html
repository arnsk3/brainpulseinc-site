<script type="text/babel">
const { useState, useCallback, useMemo, useRef, useEffect } = React;

// ─── Constants ──────────────────────────────────────────────────────────────
const SEV = { CRITICAL:"critical", MAJOR:"major", MINOR:"minor", INFO:"info" };
const SEV_COLOR = { critical:"#ff4d6a", major:"#ffaa2c", minor:"#4ea8f6", info:"#7c8ba0" };
const SEV_BG = { critical:"rgba(255,77,106,0.08)", major:"rgba(255,170,44,0.08)", minor:"rgba(78,168,246,0.08)", info:"rgba(124,139,160,0.06)" };

// ─── Color Utilities ────────────────────────────────────────────────────────
function parseColor(s){if(!s)return null;s=s.trim().toLowerCase();const n={white:[255,255,255],black:[0,0,0],red:[255,0,0],green:[0,128,0],blue:[0,0,255],yellow:[255,255,0],gray:[128,128,128],grey:[128,128,128],orange:[255,165,0],purple:[128,0,128],pink:[255,192,203],navy:[0,0,128],teal:[0,128,128],maroon:[128,0,0],lime:[0,255,0],aqua:[0,255,255],silver:[192,192,192],transparent:[255,255,255]};if(n[s])return n[s];let m=s.match(/^#([0-9a-f]{3,8})$/);if(m){let h=m[1];if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}m=s.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);if(m)return[+m[1],+m[2],+m[3]];return null}
function relLum([r,g,b]){const[rs,gs,bs]=[r,g,b].map(c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)});return .2126*rs+.7152*gs+.0722*bs}
function contrastRatio(a,b){const l1=relLum(a),l2=relLum(b);return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)}

// ─── WCAG 2.2 AAA Rule Engine ───────────────────────────────────────────────
const RULES=[
{id:"1.1.1",name:"Non-text Content",level:"A",principle:"Perceivable",check(d){const r=[];d.querySelectorAll("img").forEach((e,i)=>{if(!e.getAttribute("alt")&&e.getAttribute("alt")!=="")r.push({severity:SEV.CRITICAL,el:e.outerHTML.substring(0,140),msg:`Image #${i+1} missing alt attribute`,fix:`Add alt="descriptive text" or alt="" for decorative images`})});d.querySelectorAll("svg").forEach((e,i)=>{if(!e.getAttribute("role")&&!e.querySelector("title"))r.push({severity:SEV.MAJOR,el:"<svg>",msg:`SVG #${i+1} missing accessible name`,fix:`Add role="img" with aria-label, or a <title> child`})});d.querySelectorAll("input[type='image']").forEach((e,i)=>{if(!e.getAttribute("alt"))r.push({severity:SEV.CRITICAL,el:e.outerHTML.substring(0,140),msg:`Image input #${i+1} missing alt`,fix:`Add alt="button description"`})});d.querySelectorAll("canvas,object,embed,video,audio").forEach((e,i)=>{if(!e.getAttribute("aria-label")&&!e.getAttribute("aria-labelledby")&&!e.textContent?.trim())r.push({severity:SEV.MAJOR,el:`<${e.tagName.toLowerCase()}>`,msg:`${e.tagName} #${i+1} missing text alternative`,fix:`Add aria-label or provide text alternative`})});return r}},
{id:"1.3.1",name:"Info and Relationships",level:"A",principle:"Perceivable",check(d){const r=[];d.querySelectorAll("table").forEach((t,i)=>{if(!t.querySelector("th")&&!t.querySelector("[role='columnheader']"))r.push({severity:SEV.MAJOR,el:"<table>",msg:`Table #${i+1} has no header cells`,fix:`Use <th> elements with scope attribute`});if(!t.querySelector("caption")&&!t.getAttribute("aria-label"))r.push({severity:SEV.MINOR,el:"<table>",msg:`Table #${i+1} missing caption`,fix:`Add <caption> or aria-label`})});d.querySelectorAll("fieldset").forEach((f,i)=>{if(!f.querySelector("legend"))r.push({severity:SEV.MAJOR,el:"<fieldset>",msg:`Fieldset #${i+1} missing <legend>`,fix:`Add <legend> as first child`})});return r}},
{id:"1.3.5",name:"Identify Input Purpose",level:"AA",principle:"Perceivable",check(d){const r=[];d.querySelectorAll("input[type='text'],input[type='email'],input[type='tel'],input[type='url'],input:not([type]),input[type='password']").forEach((e)=>{if(!e.getAttribute("autocomplete")&&!e.closest("[autocomplete]")){const n=e.getAttribute("name")||e.getAttribute("id")||"";if(/name|email|phone|tel|address|city|state|zip|postal|country|birth|cc|card|password|user/i.test(n))r.push({severity:SEV.MINOR,el:e.outerHTML.substring(0,140),msg:`Input "${n}" likely collects personal data but lacks autocomplete`,fix:`Add autocomplete="given-name|email|tel|..."`})}});return r}},
{id:"1.4.3",name:"Contrast (Minimum AA)",level:"AA",principle:"Perceivable",check(d){const r=[];let c=0;d.querySelectorAll("p,span,a,li,td,th,h1,h2,h3,h4,h5,h6,label,button,div").forEach(e=>{if(c>50)return;const s=e.getAttribute("style")||"";const cm=s.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);const bm=s.match(/background(?:-color)?\s*:\s*([^;]+)/i);if(cm&&bm){c++;const fg=parseColor(cm[1].trim()),bg=parseColor(bm[1].trim());if(fg&&bg){const ratio=contrastRatio(fg,bg);if(ratio<4.5)r.push({severity:SEV.CRITICAL,el:e.outerHTML.substring(0,120),msg:`Contrast ratio ${ratio.toFixed(2)}:1 — needs ≥4.5:1 (AA) / ≥7:1 (AAA)`,fix:`Darken text or lighten background to reach at least 7:1`});else if(ratio<7)r.push({severity:SEV.MINOR,el:e.outerHTML.substring(0,120),msg:`Contrast ${ratio.toFixed(2)}:1 passes AA but fails AAA (needs ≥7:1)`,fix:`Increase contrast to 7:1 for AAA`})}}});return r}},
{id:"1.4.6",name:"Contrast (Enhanced AAA)",level:"AAA",principle:"Perceivable",check(){return[{severity:SEV.INFO,el:"—",msg:`AAA requires 7:1 for normal text, 4.5:1 for large text. Verify all color pairs.`,fix:`Audit full stylesheet with a contrast checker`}]}},
{id:"1.4.8",name:"Visual Presentation (AAA)",level:"AAA",principle:"Perceivable",check(d){const r=[];d.querySelectorAll("p,div,span,li,td").forEach(e=>{const s=e.getAttribute("style")||"";if(/text-align\s*:\s*justify/i.test(s))r.push({severity:SEV.MAJOR,el:e.outerHTML.substring(0,100),msg:`Justified text — AAA prohibits full justification`,fix:`Use text-align: left`});const lh=s.match(/line-height\s*:\s*([0-9.]+)/i);if(lh&&parseFloat(lh[1])<1.5&&!lh[0].includes("px"))r.push({severity:SEV.MINOR,el:e.outerHTML.substring(0,100),msg:`Line height ${lh[1]} below AAA minimum of 1.5`,fix:`Set line-height: 1.5 or greater`})});return r}},
{id:"1.4.10",name:"Reflow",level:"AA",principle:"Perceivable",check(d){const r=[];const m=d.querySelector('meta[name="viewport"]');if(m){const c=m.getAttribute("content")||"";if(/maximum-scale\s*=\s*1/i.test(c)||/user-scalable\s*=\s*no/i.test(c))r.push({severity:SEV.CRITICAL,el:m.outerHTML,msg:`Viewport restricts user zoom`,fix:`Remove maximum-scale=1 and user-scalable=no`})}return r}},
{id:"2.1.1",name:"Keyboard",level:"A",principle:"Operable",check(d){const r=[];d.querySelectorAll("[onclick],[onmousedown],[onmouseup]").forEach((e,i)=>{if(!e.getAttribute("onkeydown")&&!e.getAttribute("onkeyup")&&!["A","BUTTON","INPUT","SELECT","TEXTAREA"].includes(e.tagName))r.push({severity:SEV.CRITICAL,el:e.outerHTML.substring(0,120),msg:`Element #${i+1} has mouse handler but no keyboard equivalent`,fix:`Add keyboard handlers or use <button>/<a>`})});d.querySelectorAll("div[onclick],span[onclick],div[role='button'],span[role='button']").forEach((e,i)=>{if(!e.getAttribute("tabindex"))r.push({severity:SEV.CRITICAL,el:e.outerHTML.substring(0,120),msg:`Clickable element #${i+1} not keyboard-focusable`,fix:`Add tabindex="0" and keyboard handlers, or use <button>`})});return r}},
{id:"2.1.3",name:"Keyboard (No Exception AAA)",level:"AAA",principle:"Operable",check(d){const r=[];d.querySelectorAll("[accesskey]").forEach(e=>{r.push({severity:SEV.MINOR,el:e.outerHTML.substring(0,120),msg:`accesskey may conflict with assistive tech`,fix:`Remove accesskey or document shortcut`})});return r}},
{id:"2.4.1",name:"Bypass Blocks",level:"A",principle:"Operable",check(d){const r=[];if(!d.querySelector('a[href^="#main"],a[href^="#content"],[class*="skip"],[id*="skip"]')&&!d.querySelector("main,[role='main']"))r.push({severity:SEV.MAJOR,el:"—",msg:`No skip link or <main> landmark`,fix:`Add skip link or <main> element`});if(!d.querySelector("nav,[role='navigation']")&&d.querySelectorAll("a").length>5)r.push({severity:SEV.MINOR,el:"—",msg:`Multiple links but no <nav> landmark`,fix:`Wrap navigation in <nav>`});return r}},
{id:"2.4.2",name:"Page Titled",level:"A",principle:"Operable",check(d){const r=[];const t=d.querySelector("title");if(!t||!t.textContent?.trim())r.push({severity:SEV.MAJOR,el:"<head>",msg:`Page missing <title>`,fix:`Add descriptive <title> in <head>`});return r}},
{id:"2.4.4",name:"Link Purpose (In Context)",level:"A",principle:"Operable",check(d){const r=[];const vague=["click here","here","read more","more","link","this"];d.querySelectorAll("a").forEach((a,i)=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();if(vague.includes(t))r.push({severity:SEV.MAJOR,el:a.outerHTML.substring(0,120),msg:`Link #${i+1} text "${t}" is ambiguous`,fix:`Use descriptive text`});if(!t&&!a.querySelector("img[alt]"))r.push({severity:SEV.CRITICAL,el:a.outerHTML.substring(0,120),msg:`Link #${i+1} has no accessible text`,fix:`Add text, aria-label, or img with alt`})});return r}},
{id:"2.4.6",name:"Headings and Labels",level:"AA",principle:"Operable",check(d){const r=[];const hs=d.querySelectorAll("h1,h2,h3,h4,h5,h6");let prev=0,h1c=0;hs.forEach(h=>{const l=+h.tagName[1];if(l===1)h1c++;if(prev>0&&l>prev+1)r.push({severity:SEV.MAJOR,el:h.outerHTML.substring(0,100),msg:`Heading skips h${prev} to h${l}`,fix:`Use sequential levels`});if(!h.textContent?.trim())r.push({severity:SEV.MAJOR,el:h.outerHTML.substring(0,100),msg:`Empty heading h${l}`,fix:`Add text or remove`});prev=l});if(h1c===0&&hs.length>0)r.push({severity:SEV.MAJOR,el:"—",msg:`No <h1> found`,fix:`Add <h1>`});if(h1c>1)r.push({severity:SEV.MINOR,el:"—",msg:`Multiple <h1> (${h1c})`,fix:`Use single <h1>`});return r}},
{id:"2.4.9",name:"Link Purpose (Link Only AAA)",level:"AAA",principle:"Operable",check(d){const r=[];const map={};d.querySelectorAll("a[href]").forEach(a=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();const h=a.getAttribute("href");if(t&&h){if(map[t]&&map[t]!==h)r.push({severity:SEV.MINOR,el:a.outerHTML.substring(0,120),msg:`"${t}" links to different URLs`,fix:`Same text = same destination`});map[t]=h}});return r}},
{id:"3.1.1",name:"Language of Page",level:"A",principle:"Understandable",check(d){const r=[];const h=d.querySelector("html");if(h&&!h.getAttribute("lang"))r.push({severity:SEV.CRITICAL,el:"<html>",msg:`Missing lang attribute`,fix:`Add lang="en" to <html>`});return r}},
{id:"3.2.2",name:"On Input",level:"A",principle:"Understandable",check(d){const r=[];d.querySelectorAll("select[onchange]").forEach((s,i)=>{const h=s.getAttribute("onchange")||"";if(/submit|location|navigate|href|window\.open/i.test(h))r.push({severity:SEV.MAJOR,el:s.outerHTML.substring(0,120),msg:`Select #${i+1} auto-navigates on change`,fix:`Use explicit submit button`})});return r}},
{id:"3.3.2",name:"Labels or Instructions",level:"A",principle:"Understandable",check(d){const r=[];d.querySelectorAll("input:not([type='hidden']):not([type='submit']):not([type='button']):not([type='reset']):not([type='image']),select,textarea").forEach((e,i)=>{const id=e.getAttribute("id");const has=id&&d.querySelector(`label[for="${id}"]`);if(!has&&!e.closest("label")&&!e.getAttribute("aria-label")&&!e.getAttribute("aria-labelledby")&&!e.getAttribute("title"))r.push({severity:SEV.CRITICAL,el:e.outerHTML.substring(0,120),msg:`Form control #${i+1} has no label`,fix:`Add <label for="id"> or aria-label`})});return r}},
{id:"4.1.1",name:"Parsing / Valid Markup",level:"A",principle:"Robust",check(d){const r=[];const ids={};d.querySelectorAll("[id]").forEach(e=>{const id=e.getAttribute("id");if(ids[id])r.push({severity:SEV.MAJOR,el:e.outerHTML.substring(0,100),msg:`Duplicate id="${id}"`,fix:`All IDs must be unique`});ids[id]=true});return r}},
{id:"4.1.2",name:"Name, Role, Value",level:"A",principle:"Robust",check(d){const r=[];const valid=new Set(["alert","alertdialog","application","article","banner","button","cell","checkbox","columnheader","combobox","complementary","contentinfo","definition","dialog","directory","document","feed","figure","form","grid","gridcell","group","heading","img","link","list","listbox","listitem","log","main","marquee","math","menu","menubar","menuitem","menuitemcheckbox","menuitemradio","navigation","none","note","option","presentation","progressbar","radio","radiogroup","region","row","rowgroup","rowheader","scrollbar","search","searchbox","separator","slider","spinbutton","status","switch","tab","table","tablist","tabpanel","term","textbox","timer","toolbar","tooltip","tree","treegrid","treeitem"]);d.querySelectorAll("[role]").forEach(e=>{const role=e.getAttribute("role");if(!valid.has(role))r.push({severity:SEV.MAJOR,el:e.outerHTML.substring(0,100),msg:`Invalid role="${role}"`,fix:`Use valid WAI-ARIA role`})});d.querySelectorAll("[aria-hidden='true']").forEach(e=>{if(e.querySelector("a[href],button,input,select,textarea,[tabindex]:not([tabindex='-1'])"))r.push({severity:SEV.CRITICAL,el:e.outerHTML.substring(0,120),msg:`Focusable content inside aria-hidden`,fix:`Remove aria-hidden or defocus inner content`})});return r}},
{id:"2.5.3",name:"Label in Name",level:"A",principle:"Operable",check(d){const r=[];d.querySelectorAll("button[aria-label],a[aria-label],input[aria-label]").forEach(e=>{const al=(e.getAttribute("aria-label")||"").toLowerCase();const vt=(e.textContent||"").trim().toLowerCase();if(vt&&al&&!al.includes(vt))r.push({severity:SEV.MAJOR,el:e.outerHTML.substring(0,120),msg:`aria-label "${al}" doesn't contain visible "${vt}"`,fix:`aria-label must include visible text`})});return r}},
];

function analyzeHTML(html){const p=new DOMParser();const d=p.parseFromString(html,"text/html");return RULES.map(r=>{const issues=r.check(d);return{...r,issues,passed:issues.filter(i=>i.severity!==SEV.INFO).length===0}})}
function autoRemediate(html){let f=html;if(/<html(?![^>]*\slang\s*=)/i.test(f))f=f.replace(/<html/i,'<html lang="en"');f=f.replace(/user-scalable\s*=\s*no/gi,"user-scalable=yes");f=f.replace(/maximum-scale\s*=\s*1(?:\.0)?/gi,"maximum-scale=5.0");f=f.replace(/text-align\s*:\s*justify/gi,"text-align: left");return f}

// ─── AI Engine ──────────────────────────────────────────────────────────────
async function getAIFix(issue,fullHTML){
  const snippet=fullHTML.length>3000?fullHTML.substring(0,3000)+"\n<!-- truncated -->":fullHTML;
  try{const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`You are a WCAG 2.2 AAA expert. Audit found:\n\nWCAG: ${issue.ruleId} — ${issue.ruleName}\nSeverity: ${issue.severity}\nIssue: ${issue.msg}\nElement: ${issue.el}\nFix: ${issue.fix}\n\nHTML:\n\`\`\`html\n${snippet}\n\`\`\`\n\nRespond ONLY valid JSON (no fences):\n{"explanation":"why this is a problem","designTip":"concrete UX suggestion","fixedCode":"corrected HTML snippet","beforeAfter":"what changed"}`}]})});const data=await resp.json();const text=data.content?.map(b=>b.text||"").join("")||"";return JSON.parse(text.replace(/```json|```/g,"").trim())}catch{return{explanation:"Could not generate recommendation.",designTip:"",fixedCode:"",beforeAfter:""}}
}
async function getAIFullRemediation(html,issues){
  const list=issues.slice(0,14).map(i=>`• [${i.severity}] ${i.ruleId} ${i.ruleName}: ${i.msg}`).join("\n");
  const snippet=html.length>4000?html.substring(0,4000)+"\n<!-- truncated -->":html;
  try{const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`Fix ALL accessibility issues:\n\nIssues:\n${list}\n\nHTML:\n\`\`\`html\n${snippet}\n\`\`\`\n\nReturn ONLY corrected HTML. No fences, no explanation.`}]})});const data=await resp.json();return(data.content?.map(b=>b.text||"").join("")||"").replace(/```html|```/g,"").trim()}catch{return html}
}

// ─── Components ─────────────────────────────────────────────────────────────
const Pill=({children,color,bg})=><span style={{fontSize:10,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase",padding:"3px 8px",borderRadius:5,color,background:bg,whiteSpace:"nowrap"}}>{children}</span>;
const Stat=({label,value,color})=><div style={{textAlign:"center",padding:"14px 10px",background:"var(--bg-card)",borderRadius:10,border:"1px solid var(--border)",flex:"1 1 80px",minWidth:72}}><div style={{fontSize:26,fontFamily:"var(--font-mono)",fontWeight:700,color,lineHeight:1}}>{value}</div><div style={{fontSize:9,textTransform:"uppercase",letterSpacing:".07em",color:"var(--text-muted)",marginTop:5}}>{label}</div></div>;

function AICard({rec,loading,onApply,applied}){
  if(loading)return<div style={{padding:"16px 20px",background:"linear-gradient(135deg,rgba(0,224,194,0.04),rgba(78,168,246,0.04))",borderRadius:10,border:"1px dashed rgba(0,224,194,0.25)",marginTop:10}}><div style={{display:"flex",alignItems:"center",gap:10}}><div className="ai-spin"/><span style={{fontSize:13,color:"var(--accent)"}}>Generating AI recommendation…</span></div></div>;
  if(!rec)return null;
  return<div style={{marginTop:10,borderRadius:10,border:"1px solid rgba(0,224,194,0.15)",overflow:"hidden"}}><div style={{background:"linear-gradient(135deg,rgba(0,224,194,0.06),rgba(78,168,246,0.03))",padding:"16px 20px"}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={{fontSize:14,color:"var(--accent)"}}>✦</span><span style={{fontSize:11,fontWeight:700,color:"var(--accent)",letterSpacing:".05em",textTransform:"uppercase"}}>AI Recommendation</span></div>{rec.explanation&&<p style={{fontSize:13,color:"var(--text-primary)",margin:"0 0 12px",lineHeight:1.65}}>{rec.explanation}</p>}{rec.designTip&&<div style={{background:"rgba(0,224,194,0.06)",borderRadius:8,padding:"10px 14px",marginBottom:12,borderLeft:"3px solid var(--accent)"}}><div style={{fontSize:10,textTransform:"uppercase",color:"var(--accent)",fontWeight:700,letterSpacing:".05em",marginBottom:4}}>Design Suggestion</div><p style={{fontSize:12.5,color:"var(--text-secondary)",margin:0,lineHeight:1.6}}>{rec.designTip}</p></div>}{rec.beforeAfter&&<p style={{fontSize:12,color:"var(--text-muted)",margin:"0 0 10px",fontStyle:"italic"}}>↳ {rec.beforeAfter}</p>}</div>{rec.fixedCode&&<div style={{borderTop:"1px solid rgba(0,224,194,0.1)"}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 20px 0",flexWrap:"wrap",gap:6}}><span style={{fontSize:10,textTransform:"uppercase",color:"var(--text-muted)",fontWeight:700,letterSpacing:".05em"}}>Corrected Code</span>{!applied?<button className="ai-btn" onClick={onApply} style={{padding:"5px 14px"}}>↳ Apply This Fix</button>:<span className="applied-badge">✓ Applied</span>}</div><pre style={{fontSize:11.5,color:"#b8f0e4",background:"rgba(0,0,0,0.35)",padding:"12px 20px",margin:"8px 0 0",whiteSpace:"pre-wrap",wordBreak:"break-all",fontFamily:"var(--font-mono)",lineHeight:1.65,maxHeight:200,overflow:"auto"}}>{rec.fixedCode}</pre></div>}</div>;
}

function LivePreview({html,label,accent}){const ref=useRef(null);useEffect(()=>{if(!ref.current||!html)return;const doc=ref.current.contentDocument;if(doc){doc.open();doc.write(html);doc.close()}},[html]);return<div style={{flex:1,minWidth:260}}><div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".07em",color:accent||"var(--text-muted)",fontWeight:700,marginBottom:7,display:"flex",alignItems:"center",gap:6}}><span style={{width:6,height:6,borderRadius:"50%",background:accent||"var(--text-muted)"}}/>{label}</div><iframe ref={ref} sandbox="allow-same-origin" style={{width:"100%",height:340,border:"1px solid var(--border)",borderRadius:10,background:"#fff"}} title={label}/></div>}

function ContrastChecker(){const[fg,setFg]=useState("#555555");const[bg,setBg]=useState("#FFFFFF");const fgRgb=parseColor(fg),bgRgb=parseColor(bg);const ratio=fgRgb&&bgRgb?contrastRatio(fgRgb,bgRgb):null;const tests=ratio?[["AA Normal",ratio>=4.5,"≥4.5"],["AA Large",ratio>=3,"≥3"],["AAA Normal",ratio>=7,"≥7"],["AAA Large",ratio>=4.5,"≥4.5"]]:[];return<div style={{background:"var(--bg-card)",borderRadius:12,border:"1px solid var(--border)",padding:24}}><h3 style={{margin:"0 0 18px",fontFamily:"var(--font-display)",fontSize:18}}>Contrast Checker</h3><div style={{display:"flex",gap:16,flexWrap:"wrap",marginBottom:20}}>{[["Foreground",fg,setFg],["Background",bg,setBg]].map(([l,v,s])=><label key={l} style={{display:"flex",flexDirection:"column",gap:6,flex:1,minWidth:150}}><span style={{fontSize:11,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</span><div style={{display:"flex",gap:8,alignItems:"center"}}><input type="color" value={v} onChange={e=>s(e.target.value)} style={{width:42,height:38,border:"none",cursor:"pointer",borderRadius:7}}/><input type="text" value={v} onChange={e=>s(e.target.value)} style={{flex:1,padding:"9px 12px",background:"var(--bg-input)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text-primary)",fontFamily:"var(--font-mono)",fontSize:13}}/></div></label>)}</div><div style={{background:bgRgb?bg:"#fff",color:fgRgb?fg:"#000",padding:"22px 26px",borderRadius:10,marginBottom:18,border:"1px solid var(--border)"}}><div style={{fontSize:20,marginBottom:6,fontWeight:500}}>The quick brown fox jumps over the lazy dog</div><div style={{fontSize:13}}>Small text — 13px regular weight</div></div>{ratio!==null&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8}}><div style={{textAlign:"center",padding:14,background:"var(--bg-surface)",borderRadius:8}}><div style={{fontSize:30,fontFamily:"var(--font-mono)",fontWeight:700,color:ratio>=7?"#00e0c2":ratio>=4.5?"#ffaa2c":"#ff4d6a"}}>{ratio.toFixed(2)}</div><div style={{fontSize:9,color:"var(--text-muted)",marginTop:3,textTransform:"uppercase",letterSpacing:".06em"}}>Ratio</div></div>{tests.map(([l,pass,req])=><div key={l} style={{textAlign:"center",padding:14,background:pass?"rgba(0,224,194,0.06)":"rgba(255,77,106,0.06)",borderRadius:8,border:`1px solid ${pass?"rgba(0,224,194,0.18)":"rgba(255,77,106,0.18)"}`}}><div style={{fontSize:16,fontWeight:700,color:pass?"#00e0c2":"#ff4d6a"}}>{pass?"PASS":"FAIL"}</div><div style={{fontSize:9,color:"var(--text-muted)",marginTop:2}}>{l} {req}</div></div>)}</div>}</div>}

function HeadingOutline({html}){const headings=useMemo(()=>{if(!html)return[];const d=new DOMParser().parseFromString(html,"text/html");const r=[];d.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(h=>r.push({level:+h.tagName[1],text:h.textContent?.trim()||"(empty)",tag:h.tagName}));return r},[html]);if(!headings.length)return<div style={{padding:36,color:"var(--text-muted)",fontSize:14,textAlign:"center"}}>No headings found.</div>;let prev=0;return<div style={{background:"var(--bg-card)",borderRadius:12,border:"1px solid var(--border)",padding:"20px 24px"}}><h3 style={{margin:"0 0 14px",fontFamily:"var(--font-display)",fontSize:18}}>Heading Outline</h3>{headings.map((h,i)=>{const skip=prev>0&&h.level>prev+1;prev=h.level;return<div key={i} style={{display:"flex",alignItems:"center",gap:8,paddingLeft:(h.level-1)*22,marginBottom:5}}><span style={{fontFamily:"var(--font-mono)",fontSize:10.5,padding:"2px 7px",borderRadius:4,background:skip?"rgba(255,77,106,0.12)":"rgba(0,224,194,0.08)",color:skip?"#ff4d6a":"var(--accent)",fontWeight:600}}>{h.tag}</span><span style={{fontSize:13,color:h.text==="(empty)"?"#ff4d6a":"var(--text-primary)"}}>{h.text}</span>{skip&&<span style={{fontSize:9,color:"#ff4d6a",fontWeight:700}}>⚠ SKIP</span>}</div>})}</div>}

const SAMPLE=`<!DOCTYPE html>\n<html>\n<head>\n  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">\n  <title></title>\n</head>\n<body>\n  <div onclick="navigate('/home')" style="cursor:pointer">Home</div>\n  <h1>Welcome to Our Site</h1>\n  <h3>Quick Start Guide</h3>\n  <p style="text-align: justify; line-height: 1.1; color: #999; background-color: #fff;">\n    This paragraph has poor contrast, justified text, and tight line-height.\n  </p>\n  <img src="hero.jpg">\n  <a href="/about">Click here</a>\n  <a href="/contact"></a>\n  <form>\n    <input type="text" name="email" placeholder="Email">\n    <input type="text" name="phone" placeholder="Phone">\n    <select onchange="window.location=this.value">\n      <option>Choose a page</option>\n    </select>\n    <fieldset><input type="checkbox" id="agree"> I agree</fieldset>\n  </form>\n  <div id="sidebar" aria-hidden="true">\n    <a href="/privacy">Privacy</a><button>Contact</button>\n  </div>\n  <div id="sidebar">Duplicate</div>\n  <table><tr><td>Product</td><td>Price</td></tr><tr><td>Widget</td><td>$9.99</td></tr></table>\n  <svg width="100" height="100"><circle cx="50" cy="50" r="40" fill="blue"/></svg>\n</body>\n</html>`;

const TABS=[{key:"audit",label:"Audit",icon:"◉"},{key:"preview",label:"Live Preview",icon:"◫"},{key:"contrast",label:"Contrast",icon:"◑"},{key:"outline",label:"Outline",icon:"≡"},{key:"remediate",label:"AI Remediate",icon:"✦"}];

function App(){
  const[html,setHtml]=useState("");const[results,setResults]=useState(null);const[tab,setTab]=useState("audit");
  const[fLevel,setFLevel]=useState("ALL");const[fSev,setFSev]=useState("ALL");const[fPrinc,setFPrinc]=useState("ALL");
  const[expanded,setExpanded]=useState(null);const[aiRecs,setAiRecs]=useState({});const[aiLoad,setAiLoad]=useState({});
  const[remediated,setRemediated]=useState("");const[aiRemediating,setAiRemediating]=useState(false);
  const[aiRemediated,setAiRemediated]=useState("");const[applied,setApplied]=useState(new Set());
  const allIssuesRef=useRef([]);

  const runAudit=useCallback(()=>{if(!html.trim())return;const r=analyzeHTML(html);setResults(r);setRemediated(autoRemediate(html));setAiRecs({});setAiLoad({});setAiRemediated("");setApplied(new Set());setTab("audit")},[html]);

  const allIssues=useMemo(()=>{if(!results)return[];const list=[];results.forEach(r=>r.issues.filter(i=>i.severity!==SEV.INFO).forEach(i=>list.push({...i,ruleId:r.id,ruleName:r.name})));allIssuesRef.current=list;return list},[results]);

  const requestAIFix=useCallback(async(issue,idx)=>{setAiLoad(p=>({...p,[idx]:true}));const rec=await getAIFix(issue,html);setAiRecs(p=>({...p,[idx]:rec}));setAiLoad(p=>({...p,[idx]:false}))},[html]);
  const applyFix=useCallback((idx,code)=>{const issue=allIssuesRef.current[idx];if(!issue||!code)return;setRemediated(prev=>{if(issue.el&&issue.el!=="—"&&prev.includes(issue.el))return prev.replace(issue.el,code);return prev});setApplied(p=>new Set([...p,idx]))},[]);
  const runFullAI=useCallback(async()=>{if(!results)return;setAiRemediating(true);const fixed=await getAIFullRemediation(html,allIssuesRef.current);setAiRemediated(fixed);setRemediated(fixed);setAiRemediating(false)},[html,results]);

  const filtered=useMemo(()=>{if(!results)return[];return results.filter(r=>{if(fLevel!=="ALL"&&r.level!==fLevel)return false;if(fPrinc!=="ALL"&&r.principle!==fPrinc)return false;if(fSev==="ISSUES"&&r.passed)return false;if(fSev==="PASSED"&&!r.passed)return false;return true})},[results,fLevel,fSev,fPrinc]);

  const stats=useMemo(()=>{if(!results)return null;const t=results.length,p=results.filter(r=>r.passed).length;const all=results.flatMap(r=>r.issues).filter(i=>i.severity!==SEV.INFO);return{total:t,passed:p,critical:all.filter(i=>i.severity===SEV.CRITICAL).length,major:all.filter(i=>i.severity===SEV.MAJOR).length,minor:all.filter(i=>i.severity===SEV.MINOR).length,score:t>0?Math.round((p/t)*100):0,issues:all.length}},[results]);
  const scoreColor=stats?(stats.score>=80?"#00e0c2":stats.score>=50?"#ffaa2c":"#ff4d6a"):"var(--text-muted)";
  let gIdx=-1;

  return <div style={{maxWidth:1100,margin:"0 auto",padding:"0 0 40px"}}>
    <header style={{borderBottom:"1px solid var(--border)",padding:"18px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:36,height:36,borderRadius:9,background:"linear-gradient(135deg,#00e0c2,#00a896)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:800,color:"#080b12",fontFamily:"var(--font-mono)"}}>A</div>
        <div><h1 style={{margin:0,fontFamily:"var(--font-display)",fontSize:24,fontWeight:700,letterSpacing:"-.01em",lineHeight:1.1}}>WCAG 2.2 Remediator</h1><p style={{margin:"2px 0 0",fontSize:11.5,color:"var(--text-muted)",letterSpacing:".03em"}}>ADA Compliance · AAA Level · AI-Powered Fixes</p></div>
      </div>
      {stats&&<div style={{display:"flex",alignItems:"baseline",gap:6}}><span style={{fontSize:44,fontFamily:"var(--font-mono)",fontWeight:700,color:scoreColor,lineHeight:1}}>{stats.score}</span><span style={{fontSize:13,color:"var(--text-muted)",fontWeight:500}}>/ 100</span></div>}
    </header>

    <section style={{padding:"18px 28px",borderBottom:"1px solid var(--border)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}>
        <span style={{fontSize:11,textTransform:"uppercase",letterSpacing:".07em",color:"var(--text-muted)",fontWeight:700}}>HTML Source</span>
        <div style={{display:"flex",gap:8}}><button className="ghost-btn" onClick={()=>{setHtml(SAMPLE);setResults(null)}}>Load Sample</button><button className="pri-btn" disabled={!html.trim()} onClick={runAudit}>▶ Run Audit</button></div>
      </div>
      <textarea value={html} onChange={e=>{setHtml(e.target.value);setResults(null)}} placeholder="Paste your HTML source here…" style={{width:"100%",minHeight:130,maxHeight:260,padding:"14px 16px",background:"var(--bg-input)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text-primary)",fontFamily:"var(--font-mono)",fontSize:12,lineHeight:1.65,resize:"vertical",boxSizing:"border-box"}}/>
    </section>

    {results&&<><nav style={{display:"flex",borderBottom:"1px solid var(--border)",padding:"0 20px",overflowX:"auto"}}>{TABS.map(t=><button key={t.key} className={`tab-btn${tab===t.key?" active":""}`} onClick={()=>setTab(t.key)}><span style={{fontSize:14}}>{t.icon}</span>{t.label}</button>)}</nav>
    <div style={{padding:"22px 28px",minHeight:300}}>

    {tab==="audit"&&<><div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}><Stat label="Rules" value={stats.total} color="var(--text-primary)"/><Stat label="Passed" value={stats.passed} color="#00e0c2"/><Stat label="Issues" value={stats.issues} color="#ff4d6a"/><Stat label="Critical" value={stats.critical} color="#ff4d6a"/><Stat label="Major" value={stats.major} color="#ffaa2c"/><Stat label="Minor" value={stats.minor} color="#4ea8f6"/></div>
    <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>{[["Level",fLevel,setFLevel,["ALL","A","AA","AAA"]],["Status",fSev,setFSev,["ALL","ISSUES","PASSED"]],["Principle",fPrinc,setFPrinc,["ALL","Perceivable","Operable","Understandable","Robust"]]].map(([l,v,s,o])=><div key={l} style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:10,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</span><select className="sel" value={v} onChange={e=>s(e.target.value)}>{o.map(x=><option key={x}>{x}</option>)}</select></div>)}</div>
    <div style={{display:"flex",flexDirection:"column",gap:5}}>{filtered.map(rule=>{const isOpen=expanded===rule.id;const ic=rule.issues.filter(i=>i.severity!==SEV.INFO).length;return<div key={rule.id} style={{background:"var(--bg-card)",border:"1px solid var(--border)",borderRadius:10,overflow:"hidden"}}><button className="issue-row" onClick={()=>setExpanded(isOpen?null:rule.id)}><span style={{width:8,height:8,borderRadius:"50%",background:rule.passed?"#00e0c2":"#ff4d6a",flexShrink:0}}/><span style={{fontFamily:"var(--font-mono)",fontSize:11.5,color:"var(--accent)",fontWeight:600,minWidth:44}}>{rule.id}</span><span style={{fontWeight:500,flex:1}}>{rule.name}</span><Pill color={rule.level==="AAA"?"#c084fc":rule.level==="AA"?"#4ea8f6":"#00e0c2"} bg={rule.level==="AAA"?"rgba(192,132,252,0.1)":rule.level==="AA"?"rgba(78,168,246,0.1)":"rgba(0,224,194,0.08)"}>{rule.level}</Pill><Pill color="var(--text-muted)" bg="rgba(148,163,184,0.06)">{rule.principle}</Pill>{ic>0&&<span style={{fontFamily:"var(--font-mono)",fontSize:11,color:"#ff4d6a",fontWeight:600}}>{ic}</span>}<span style={{fontSize:10,color:"var(--text-muted)",transform:isOpen?"rotate(90deg)":"none",transition:"transform .15s"}}>▶</span></button>
    {isOpen&&<div style={{borderTop:"1px solid var(--border)",padding:"14px 18px"}}>{rule.issues.length===0?<p style={{fontSize:13,color:"#00e0c2",margin:0}}>✓ No issues detected.</p>:<div style={{display:"flex",flexDirection:"column",gap:14}}>{rule.issues.map((issue,idx)=>{const isInfo=issue.severity===SEV.INFO;if(!isInfo)gIdx++;const gi=gIdx;return<div key={idx} style={{background:SEV_BG[issue.severity],borderRadius:9,padding:"14px 18px",borderLeft:`3px solid ${SEV_COLOR[issue.severity]}`}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:8,flexWrap:"wrap"}}><Pill color={SEV_COLOR[issue.severity]} bg="transparent">{issue.severity}</Pill>{!isInfo&&!aiRecs[gi]&&<button className="ai-btn" disabled={aiLoad[gi]} onClick={()=>requestAIFix({...issue,ruleId:rule.id,ruleName:rule.name},gi)}>{aiLoad[gi]?<><div className="ai-spin" style={{width:12,height:12}}/>Working…</>:<>✦ Get AI Fix</>}</button>}</div><p style={{fontSize:13,margin:"0 0 6px",lineHeight:1.6}}>{issue.msg}</p>{issue.el&&issue.el!=="—"&&<code style={{display:"block",fontSize:11,color:"var(--text-secondary)",background:"rgba(0,0,0,0.25)",padding:"8px 12px",borderRadius:6,marginBottom:6,wordBreak:"break-all",fontFamily:"var(--font-mono)",lineHeight:1.55}}>{issue.el}</code>}<div style={{fontSize:12,color:"#00e0c2",display:"flex",alignItems:"flex-start",gap:6}}><span>⮕</span><span style={{lineHeight:1.55}}>{issue.fix}</span></div>{!isInfo&&<AICard rec={aiRecs[gi]} loading={aiLoad[gi]} applied={applied.has(gi)} onApply={()=>applyFix(gi,aiRecs[gi]?.fixedCode)}/>}</div>})}</div>}</div>}</div>})}</div></>}

    {tab==="preview"&&<div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}><h3 style={{margin:0,fontFamily:"var(--font-display)",fontSize:19}}>Side-by-Side Live Preview</h3></div><div style={{display:"flex",gap:16,flexWrap:"wrap"}}><LivePreview html={html} label="Original" accent="#ff4d6a"/><LivePreview html={remediated} label="Remediated" accent="#00e0c2"/></div></div>}
    {tab==="contrast"&&<ContrastChecker/>}
    {tab==="outline"&&<HeadingOutline html={html}/>}

    {tab==="remediate"&&<div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{background:"linear-gradient(135deg,rgba(0,224,194,0.04),rgba(78,168,246,0.03))",borderRadius:12,border:"1px solid rgba(0,224,194,0.12)",padding:"24px 28px"}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:14,marginBottom:14}}><div><h3 style={{margin:"0 0 5px",fontFamily:"var(--font-display)",fontSize:20}}>✦ AI Full Remediation</h3><p style={{margin:0,fontSize:13,color:"var(--text-secondary)",lineHeight:1.55,maxWidth:580}}>Send your entire HTML to Claude for a comprehensive fix of all issues.</p></div><button className="ai-btn" style={{padding:"11px 24px",fontSize:13}} disabled={aiRemediating} onClick={runFullAI}>{aiRemediating?<><div className="ai-spin"/>Remediating…</>:<>✦ Generate Full AI Fix</>}</button></div>{aiRemediated&&<div style={{background:"rgba(0,224,194,0.04)",borderRadius:8,padding:"12px 16px",border:"1px solid rgba(0,224,194,0.1)"}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6}}><span style={{fontSize:10,textTransform:"uppercase",color:"var(--accent)",fontWeight:700,letterSpacing:".06em"}}>✓ AI Fix Applied</span><div style={{display:"flex",gap:6}}><button className="ghost-btn" style={{fontSize:11,padding:"5px 12px"}} onClick={()=>navigator.clipboard?.writeText(aiRemediated)}>Copy</button><button className="ghost-btn" style={{fontSize:11,padding:"5px 12px"}} onClick={()=>{setHtml(remediated);setResults(null)}}>Re-Audit</button></div></div></div>}</div>
      <div style={{background:"var(--bg-card)",borderRadius:12,border:"1px solid var(--border)",padding:"22px 26px"}}><h3 style={{margin:"0 0 5px",fontFamily:"var(--font-display)",fontSize:17}}>Auto-Fixes Applied</h3><p style={{margin:"0 0 14px",fontSize:13,color:"var(--text-secondary)",lineHeight:1.6}}>lang="en" added, viewport zoom unlocked, justified text fixed.{applied.size>0&&<> Plus <strong style={{color:"var(--accent)"}}>{applied.size}</strong> AI fix{applied.size>1?"es":""}.</>}</p><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><button className="pri-btn" style={{fontSize:11}} onClick={()=>navigator.clipboard?.writeText(remediated)}>Copy Remediated HTML</button><button className="ghost-btn" style={{fontSize:11}} onClick={()=>{setHtml(remediated);setResults(null)}}>Load & Re-Audit</button></div></div>
      <div style={{background:"var(--bg-card)",borderRadius:12,border:"1px solid var(--border)",padding:"22px 26px"}}><h3 style={{margin:"0 0 10px",fontFamily:"var(--font-display)",fontSize:17}}>Remediated Output</h3><textarea readOnly value={remediated} style={{width:"100%",minHeight:240,padding:"14px 16px",background:"var(--bg-input)",border:"1px solid var(--border)",borderRadius:10,color:"#b8f0e4",fontFamily:"var(--font-mono)",fontSize:12,lineHeight:1.65,resize:"vertical",boxSizing:"border-box"}}/></div>
      <div style={{background:"var(--bg-card)",borderRadius:12,border:"1px solid var(--border)",padding:"22px 26px"}}><h3 style={{margin:"0 0 12px",fontFamily:"var(--font-display)",fontSize:17}}>Manual Checklist</h3>{results.filter(r=>!r.passed).map(r=><div key={r.id} style={{marginBottom:14,paddingBottom:14,borderBottom:"1px solid var(--border)"}}><div style={{fontSize:13,fontWeight:600,color:"var(--accent)",marginBottom:5}}>{r.id} — {r.name} <span style={{fontSize:10,color:"var(--text-muted)"}}>({r.level})</span></div>{r.issues.filter(i=>i.severity!==SEV.INFO).map((issue,j)=><div key={j} style={{fontSize:12,color:"var(--text-secondary)",marginLeft:14,marginBottom:4,lineHeight:1.55}}>• {issue.fix}</div>)}</div>)}</div>
    </div>}

    </div></>}
