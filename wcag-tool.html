/* ═══ DONUT (clean, label OUTSIDE) ═══ */
function Donut({value,size=100,strokeW=8,sublabel}){
  const [v,setV]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setV(value),80);return()=>clearTimeout(t)},[value]);

  return<div style={{display:"inline-flex",flexDirection:"column",alignItems:"center"}}>
    <div style={{position:"relative",width:size,height:size,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)",position:"absolute"}}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.bg3} strokeWidth={strokeW}/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={clr} strokeWidth={strokeW} strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" style={{transition:"stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)",filter:`drop-shadow(0 0 6px ${clr}30)`}}/></svg>
      <span style={{fontSize:size*.24,fontFamily:T.mono,fontWeight:700,color:clr,position:"relative"}}>{v}</span>

    {sublabel&&<div style={{fontSize:9,color:T.dm,marginTop:6,textTransform:"uppercase",letterSpacing:".12em",fontWeight:700}}>{sublabel}</div>}

}

{id:"1.3.1",n:"Info & Relationships",l:"A",pr:"Perceivable",c(d){const r=[];d.querySelectorAll("table").forEach((t,i)=>{if(!t.querySelector("th,[role='columnheader']"))r.push({s:SV.M,el:"<table>",msg:`Table #${i+1} no headers`,fix:`<th scope>`})});d.querySelectorAll("fieldset").forEach(f=>{if(!f.querySelector("legend"))r.push({s:SV.M,el:"<fieldset>",msg:`No legend`,fix:`<legend>`})});return r}},
{id:"1.3.5",n:"Input Purpose",l:"AA",pr:"Perceivable",c(d){const r=[];d.querySelectorAll("input[type='text'],input[type='email'],input[type='tel'],input:not([type]),input[type='password']").forEach(e=>{if(!e.getAttribute("autocomplete")){const n=e.getAttribute("name")||"";if(/name|email|phone|tel|address|zip|password|user/i.test(n))r.push({s:SV.m,el:e.outerHTML.substring(0,140),msg:`"${n}" no autocomplete`,fix:`autocomplete`})}});return r}},
{id:"1.4.3",n:"Contrast",l:"AA",pr:"Perceivable",c(d){const r=[];let c=0;d.querySelectorAll("p,span,a,li,td,th,h1,h2,h3,h4,h5,h6,label,button,div").forEach(e=>{if(c>50)return;const st=e.getAttribute("style")||"";const cm=st.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);const bm=st.match(/background(?:-color)?\s*:\s*([^;]+)/i);if(cm&&bm){c++;const fg=pC(cm[1].trim()),bg=pC(bm[1].trim());if(fg&&bg){const ratio=CR(fg,bg);if(ratio<4.5)r.push({s:SV.C,el:e.outerHTML.substring(0,120),msg:`${ratio.toFixed(1)}:1 needs ≥7:1`,fix:`Increase contrast`});else if(ratio<7)r.push({s:SV.m,el:e.outerHTML.substring(0,120),msg:`${ratio.toFixed(1)}:1 AA ok, AAA needs 7:1`,fix:`To 7:1`})}}});return r}},
{id:"1.4.6",n:"Contrast Enhanced",l:"AAA",pr:"Perceivable",c(){return[{s:SV.I,el:"—",msg:`AAA: 7:1 normal, 4.5:1 large`,fix:`Audit colors`}]}},
{id:"1.4.8",n:"Visual Presentation",l:"AAA",pr:"Perceivable",c(d){const r=[];d.querySelectorAll("p,div,span,li,td,section").forEach(e=>{const st=e.getAttribute("style")||"";if(/text-align\s*:\s*justify/i.test(st))r.push({s:SV.M,el:e.outerHTML.substring(0,100),msg:`Justified`,fix:`left`});const lh=st.match(/line-height\s*:\s*([0-9.]+)/i);if(lh&&parseFloat(lh[1])<1.5&&!lh[0].includes("px"))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`line-height ${lh[1]}<1.5`,fix:`≥1.5`})});return r}},
{id:"1.4.10",n:"Reflow",l:"AA",pr:"Perceivable",c(d){const r=[];const m=d.querySelector('meta[name="viewport"]');if(m){const c=m.getAttribute("content")||"";if(/maximum-scale\s*=\s*1/i.test(c)||/user-scalable\s*=\s*no/i.test(c))r.push({s:SV.C,el:m.outerHTML,msg:`Zoom blocked`,fix:`Remove`})}return r}},
{id:"1.4.12",n:"Text Spacing",l:"AA",pr:"Perceivable",c(d){const r=[];d.querySelectorAll('[style*="overflow"]').forEach(e=>{const st=e.getAttribute("style")||"";if(/overflow\s*:\s*hidden/i.test(st)&&/height\s*:\s*\d+px/i.test(st))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`overflow:hidden clips`,fix:`min-height`})});return r}},
{id:"2.1.1",n:"Keyboard",l:"A",pr:"Operable",c(d){const r=[];d.querySelectorAll("[onclick],[onmousedown]").forEach((e,i)=>{if(!e.getAttribute("onkeydown")&&!["A","BUTTON","INPUT","SELECT","TEXTAREA","SUMMARY"].includes(e.tagName))r.push({s:SV.C,el:e.outerHTML.substring(0,120),msg:`Mouse-only #${i+1}`,fix:`<button>`})});d.querySelectorAll("div[onclick],span[onclick],div[role='button']").forEach(e=>{if(!e.getAttribute("tabindex"))r.push({s:SV.C,el:e.outerHTML.substring(0,120),msg:`Not focusable`,fix:`tabindex="0"`})});return r}},
{id:"2.4.1",n:"Bypass Blocks",l:"A",pr:"Operable",c(d){const r=[];if(!d.querySelector('a[href^="#main"],a[href^="#content"],[class*="skip"]')&&!d.querySelector("main,[role='main']"))r.push({s:SV.M,el:"—",msg:`No skip link/<main>`,fix:`Skip+landmarks`});if(!d.querySelectorAll("header,[role='banner'],nav,[role='navigation'],main,[role='main'],footer,[role='contentinfo']").length&&d.querySelectorAll("div").length>5)r.push({s:SV.M,el:"—",msg:`No landmarks`,fix:`Semantic HTML`});return r}},
{id:"2.4.2",n:"Page Titled",l:"A",pr:"Operable",c(d){const r=[];const t=d.querySelector("title");if(!t||!t.textContent?.trim())r.push({s:SV.M,el:"<head>",msg:`No <title>`,fix:`Add title`});return r}},
{id:"2.4.4",n:"Link Purpose",l:"A",pr:"Operable",c(d){const r=[];const v=["click here","here","read more","more","link","this","learn more"];d.querySelectorAll("a").forEach((a,i)=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();if(v.includes(t))r.push({s:SV.M,el:a.outerHTML.substring(0,120),msg:`"${t}" vague`,fix:`Descriptive`});if(!t&&!a.querySelector("img[alt]"))r.push({s:SV.C,el:a.outerHTML.substring(0,120),msg:`Link #${i+1} no text`,fix:`text/aria-label`})});return r}},
{id:"2.4.6",n:"Headings & Labels",l:"AA",pr:"Operable",c(d){const r=[];const hs=d.querySelectorAll("h1,h2,h3,h4,h5,h6");let prev=0,h1c=0;hs.forEach(h=>{const l=+h.tagName[1];if(l===1)h1c++;if(prev>0&&l>prev+1)r.push({s:SV.M,el:h.outerHTML.substring(0,100),msg:`Skip h${prev}→h${l}`,fix:`Sequential`});if(!h.textContent?.trim())r.push({s:SV.M,el:h.outerHTML.substring(0,100),msg:`Empty h${l}`,fix:`Text`});prev=l});if(h1c===0&&hs.length>0)r.push({s:SV.M,el:"—",msg:`No h1`,fix:`<h1>`});if(h1c>1)r.push({s:SV.m,el:"—",msg:`${h1c} h1s`,fix:`Single`});return r}},
{id:"2.4.7",n:"Focus Visible",l:"AA",pr:"Operable",c(d){const r=[];d.querySelectorAll("style").forEach(s=>{if(/outline\s*:\s*(none|0)/i.test(s.textContent||""))r.push({s:SV.M,el:"—",msg:`outline:none`,fix:`:focus-visible`})});return r}},
{id:"2.4.9",n:"Link Purpose (AAA)",l:"AAA",pr:"Operable",c(d){const r=[];const m={};d.querySelectorAll("a[href]").forEach(a=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();const h=a.getAttribute("href");if(t&&h){if(m[t]&&m[t]!==h)r.push({s:SV.m,el:a.outerHTML.substring(0,120),msg:`"${t}"→diff URLs`,fix:`Same text=URL`});m[t]=h}});return r}},
{id:"2.4.11",n:"Focus Not Obscured",l:"AA",pr:"Operable",c(d){const r=[];d.querySelectorAll('[style*="position"]').forEach(e=>{const st=e.getAttribute("style")||"";if(/position\s*:\s*(fixed|sticky)/i.test(st)&&/z-index/i.test(st))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`May obscure`,fix:`scroll-padding`})});return r}},
{id:"2.4.12",n:"Focus Obscured (AAA)",l:"AAA",pr:"Operable",c(d){const r=[];const ct=d.querySelectorAll('[style*="position: fixed"],[style*="position:fixed"],[style*="position: sticky"],[style*="position:sticky"]').length;if(ct)r.push({s:SV.m,el:`${ct} fixed/sticky`,msg:`Focus must be FULLY visible`,fix:`scroll-padding+margin`});return r}},

{id:"2.5.5",n:"Target Size (44×44)",l:"AAA",pr:"Operable",c(d){const r=[];d.querySelectorAll("a,button,[role='button'],input[type='checkbox'],input[type='radio']").forEach(e=>{const st=e.getAttribute("style")||"";const wm=st.match(/width\s*:\s*(\d+)px/i);const hm=st.match(/height\s*:\s*(\d+)px/i);const pm=st.match(/padding\s*:\s*(\d+)/i);if(wm&&hm){const W=+wm[1]+(pm?+pm[1]*2:0);const H=+hm[1]+(pm?+pm[1]*2:0);if(W<44||H<44)r.push({s:SV.M,el:e.outerHTML.substring(0,120),msg:`~${W}×${H}<44×44`,fix:`padding trick`})}});return r}},
{id:"2.5.8",n:"Target Size (24×24)",l:"AA",pr:"Operable",c(d){const r=[];d.querySelectorAll("a,button,[role='button']").forEach(e=>{const st=e.getAttribute("style")||"";const w=st.match(/width\s*:\s*(\d+)px/i);const h=st.match(/height\s*:\s*(\d+)px/i);if(w&&h&&(+w[1]<24||+h[1]<24))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`<24×24`,fix:`Min 24`})});return r}},
{id:"3.1.1",n:"Language",l:"A",pr:"Understandable",c(d){const r=[];if(!d.querySelector("html")?.getAttribute("lang"))r.push({s:SV.C,el:"<html>",msg:`No lang`,fix:`lang="en"`});return r}},
{id:"3.1.2",n:"Language Parts",l:"AA",pr:"Understandable",c(d){const r=[];d.querySelectorAll("[lang]").forEach(e=>{const l=e.getAttribute("lang");if(l&&!/^[a-z]{2,3}(-[A-Za-z]{2,4})?$/.test(l))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`Invalid lang`,fix:`BCP 47`})});return r}},
{id:"3.2.2",n:"On Input",l:"A",pr:"Understandable",c(d){const r=[];d.querySelectorAll("select[onchange]").forEach(e=>{if(/location|navigate|href|window/i.test(e.getAttribute("onchange")||""))r.push({s:SV.M,el:e.outerHTML.substring(0,120),msg:`Auto-nav`,fix:`Submit btn`})});return r}},
{id:"3.2.6",n:"Consistent Help",l:"AAA",pr:"Understandable",c(d){const r=[];if(!d.querySelectorAll('a[href*="help"],a[href*="support"],a[href*="contact"],[class*="help"]').length&&d.querySelectorAll("a").length>5)r.push({s:SV.M,el:"—",msg:`No help/contact`,fix:`Help in footer`});return r}},
{id:"3.3.2",n:"Labels",l:"A",pr:"Understandable",c(d){const r=[];d.querySelectorAll("input:not([type='hidden']):not([type='submit']):not([type='button']):not([type='reset']),select,textarea").forEach((e,i)=>{const id=e.getAttribute("id");if(!(id&&d.querySelector(`label[for="${id}"]`))&&!e.closest("label")&&!e.getAttribute("aria-label")&&!e.getAttribute("title"))r.push({s:SV.C,el:e.outerHTML.substring(0,120),msg:`#${i+1} unlabeled`,fix:`<label>`})});return r}},
{id:"3.3.9",n:"Accessible Auth",l:"AAA",pr:"Understandable",c(d){const r=[];d.querySelectorAll("input[type='password']").forEach(e=>{if(e.getAttribute("autocomplete")==="off"||e.getAttribute("onpaste"))r.push({s:SV.M,el:e.outerHTML.substring(0,120),msg:`Blocks paste`,fix:`autocomplete+passkey`})});d.querySelectorAll('[class*="captcha"]').forEach(e=>r.push({s:SV.M,el:e.outerHTML.substring(0,120),msg:`CAPTCHA`,fix:`Invisible`}));return r}},
{id:"4.1.1",n:"Duplicate IDs",l:"A",pr:"Robust",c(d){const r=[];const ids={};d.querySelectorAll("[id]").forEach(e=>{const id=e.getAttribute("id");if(ids[id])r.push({s:SV.M,el:e.outerHTML.substring(0,100),msg:`Dup "${id}"`,fix:`Unique`});ids[id]=true});return r}},

];
function analyze(h){const p=new DOMParser();const d=p.parseFromString(h,"text/html");return RULES.map(r=>{const issues=r.c(d);return{...r,issues,ok:issues.filter(i=>i.s!==SV.I).length===0}})}
function autoFix(h){let f=h;if(/<html(?![^>]*\slang\s*=)/i.test(f))f=f.replace(/<html/i,'<html lang="en"');f=f.replace(/user-scalable\s*=\s*no/gi,"user-scalable=yes");f=f.replace(/maximum-scale\s*=\s*1(?:\.0)?/gi,"maximum-scale=5.0");f=f.replace(/text-align\s*:\s*justify/gi,"text-align: left");return f}

/* ═══ EXPORTS ═══ */
function dl(c,f,t){const b=new Blob([c],{type:t});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href)}
function ts(){return new Date().toISOString().split('T')[0]}
function exportCSV(results){const rows=[['ID','Criterion','Level','Principle','Status','Severity','Issue','Fix']];results.forEach(r=>{if(r.ok)rows.push([r.id,r.n,r.l,r.pr,'PASS','','','']);r.issues.filter(i=>i.s!==SV.I).forEach(i=>{rows.push([r.id,r.n,r.l,r.pr,'FAIL',i.s,`"${i.msg}"`,`"${i.fix}"`])})});dl(rows.map(r=>r.join(',')).join('\n'),`wcag-${ts()}.csv`,'text/csv')}
function exportJSON(results,stats,u){dl(JSON.stringify({meta:{tool:"BrainPulse A11y",date:new Date().toISOString(),url:u||"manual"},summary:stats,results:results.map(r=>({id:r.id,name:r.n,level:r.l,principle:r.pr,status:r.ok?"PASS":"FAIL",issues:r.issues.filter(i=>i.s!==SV.I).map(i=>({severity:i.s,msg:i.msg,fix:i.fix}))}))},null,2),`wcag-${ts()}.json`,'application/json')}
function exportMD(results,stats,u,issues){let md=`# WCAG 2.2 AAA Audit\n\n**URL:** ${u||'Manual'} | **Score:** ${stats.score}/100 | **Date:** ${new Date().toLocaleDateString()}\n\n## Summary\n| Metric | Value |\n|---|---|\n| Rules | ${stats.total} |\n| Passed | ${stats.passed} |\n| Issues | ${stats.issues} |\n\n## Results\n| ID | Criterion | Level | Status |\n|---|---|---|---|\n`;results.forEach(r=>{md+=`| ${r.id} | ${r.n} | ${r.l} | ${r.ok?'✅':'❌'} |\n`});if(issues.length){md+=`\n## Issues\n`;issues.forEach(i=>{md+=`- **${i.ruleId}** [${i.s}] ${i.msg} → ${i.fix}\n`})}md+=`\n---\n*BrainPulse A11y*\n`;dl(md,`wcag-${ts()}.md`,'text/markdown')}
function emailReport(stats,u,issues){const s=encodeURIComponent(`WCAG Audit: ${u||'Page'} — ${stats.score}/100`);let b=`WCAG 2.2 AAA Report\nURL: ${u||'Manual'}\nScore: ${stats.score}/100\nPassed: ${stats.passed}/${stats.total}\nIssues: ${stats.issues}\n`;if(issues.length){b+='\nTop Issues:\n';issues.slice(0,6).forEach(i=>{b+=`• [${i.s}] ${i.ruleId}: ${i.msg}\n`})}b+='\nbrainpulseinc.com/wcag-tool.html';window.open(`mailto:?subject=${s}&body=${encodeURIComponent(b)}`)}
function copyReport(results,stats,u,issues){let t=`WCAG 2.2 AAA AUDIT\n${'═'.repeat(35)}\nURL: ${u||'Manual'}\nScore: ${stats.score}/100 | Passed: ${stats.passed}/${stats.total} | Issues: ${stats.issues}\n`;if(issues.length){t+='\nISSUES:\n';issues.forEach(i=>{t+=`[${i.s.toUpperCase()}] ${i.ruleId} ${i.ruleName}: ${i.msg}\n  Fix: ${i.fix}\n\n`})}navigator.clipboard?.writeText(t);return true}
function printReport(results,stats,u){const w=window.open('','_blank');if(!w)return;const clr=stats.score>=80?T.teal:T.rose;let h=`<!DOCTYPE html><html><head><title>WCAG Report</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;padding:32px;max-width:800px;margin:0 auto;color:#1C1917;font-size:12px;line-height:1.6}h1{font-size:22px;margin-bottom:4px}h2{font-size:16px;margin:24px 0 8px;border-bottom:1px solid #ddd;padding-bottom:6px}.meta{color:#57534E;font-size:11px;margin-bottom:16px}.score{display:inline-block;width:60px;height:60px;line-height:60px;border-radius:50%;border:4px solid ${clr};text-align:center;font-size:22px;font-weight:700;color:${clr};font-family:'JetBrains Mono',monospace;margin:12px 0}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #eee}th{background:#f5f5f5;font-weight:600;text-transform:uppercase;font-size:10px}.pass{color:#166534}.fail{color:#9F1239}@media print{@page{margin:1cm}}</style></head><body>`;h+=`<h1>WCAG 2.2 AAA Audit Report</h1><div class="meta">${u||'Manual'} · ${new Date().toLocaleDateString()} · ${results.length} criteria</div><div class="score">${stats.score}</div>`;h+=`<table><tr><th>ID</th><th>Criterion</th><th>Level</th><th>Status</th></tr>`;results.forEach(r=>{h+=`<tr><td style="font-family:monospace;color:#0D7377">${r.id}</td><td>${r.n}</td><td>${r.l}</td><td class="${r.ok?'pass':'fail'}">${r.ok?'✅':'❌'}</td></tr>`});h+=`</table><div style="margin-top:24px;text-align:center;color:#999;font-size:10px">BrainPulse A11y</div></body></html>`;w.document.write(h);w.document.close();setTimeout(()=>w.print(),500)}

/* ═══ REC CARD ═══ */
function RecCard({rec}){
  if(!rec)return null;
  return<div style={{marginTop:14,borderRadius:18,border:`1px solid ${T.b1}`,overflow:"hidden",boxShadow:"0 2px 12px rgba(28,25,23,.04)"}}>
    <div style={{background:T.ts,padding:"20px 24px",position:"relative",overflow:"hidden"}}>
      <DotBg w={180} h={90} opacity={.15}/>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:12,position:"relative"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><IllustratedIcon type="check" size={20}/><span style={{fontSize:12,fontWeight:700,color:T.teal,letterSpacing:".05em",textTransform:"uppercase"}}>Recommendation</span></div>
        <div style={{display:"flex",gap:6}}><span style={{fontSize:10,fontWeight:700,padding:"4px 12px",borderRadius:20,background:`${PC[rec.p]}08`,color:PC[rec.p],border:`1px solid ${PC[rec.p]}20`}}>{PLBL[rec.p]?.split("—")[0]}</span><span style={{fontSize:10,fontWeight:600,padding:"4px 12px",borderRadius:20,background:T.gs,color:T.green}}>{rec.e}</span></div>
      </div>
      <p style={{fontSize:14,color:T.ink,margin:"0 0 14px",lineHeight:1.7,position:"relative"}}>{rec.x}</p>
      <div style={{background:T.w,borderRadius:14,padding:"14px 18px",borderLeft:`4px solid ${T.teal}`,boxShadow:"0 1px 4px rgba(28,25,23,.03)",position:"relative"}}><div style={{fontSize:9,color:T.teal,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase",marginBottom:4}}>Design Tip</div><p style={{fontSize:13,color:T.mt,margin:0,lineHeight:1.65}}>{rec.dt}</p></div>
    </div>
    {rec.bH&&rec.aH&&<div style={{borderTop:`1px solid ${T.b1}`,padding:"20px 24px",background:T.bg2}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}><div style={{height:1,flex:1,background:`linear-gradient(90deg,transparent,${T.b2},transparent)`}}/><span style={{fontSize:9,fontWeight:700,color:T.dm,textTransform:"uppercase",letterSpacing:".12em"}}>Before → After</span><div style={{height:1,flex:1,background:`linear-gradient(90deg,transparent,${T.b2},transparent)`}}/></div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
        {[["Before",T.rose,rec.bH],["After",T.green,rec.aH]].map(([l,c,h])=><div key={l} style={{flex:1,minWidth:180}}>
          <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:".1em",fontWeight:700,color:c,marginBottom:6,display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:c,boxShadow:`0 0 0 3px ${c}18`}}/>{l}</div>
          <div style={{border:`1px solid ${T.b1}`,borderRadius:14,background:T.w,padding:14}} dangerouslySetInnerHTML={{__html:h}}/>
        </div>)}
      </div>
    </div>}
    {rec.before&&rec.after&&<div style={{borderTop:`1px solid ${T.b1}`,display:"flex",flexWrap:"wrap"}}>
      {[["before",T.rose,T.rs,rec.before],["after",T.green,T.gs,rec.after]].map(([k,c,bg,code])=><pre key={k} style={{flex:1,minWidth:180,fontSize:12,color:c,background:bg,padding:"14px 20px",margin:0,whiteSpace:"pre-wrap",wordBreak:"break-all",fontFamily:T.mono,lineHeight:1.65,maxHeight:150,overflow:"auto",borderRight:k==="before"?`1px solid ${T.b1}`:"none"}}>{code}</pre>)}
    </div>}
  </div>;

function matchIntent(text){
  const t=text.toLowerCase();
  let best=null,bestScore=0;
  HELP_KB.forEach(intent=>{
    if(!intent.kw.length)return;
    let score=0;
    intent.kw.forEach(k=>{if(t.includes(k))score+=k.split(" ").length});
    if(score>bestScore){bestScore=score;best=intent}
  });
  return best||{intent:"fallback",answer:"I'm not sure about that one, but I can help with scanning pages, understanding your score, fixing specific WCAG issues (contrast, alt text, keyboard, labels, headings, target size), exporting reports, or the Chrome extension. What would you like to know?",chips:["How do I scan a site?","What does my score mean?","How do I fix contrast?","What is WCAG AAA?"]};
}

function HelpBot(){
  const[open,setOpen]=useState(false);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"})},[msgs,typing]);
  useEffect(()=>{if(open)setTimeout(()=>inputRef.current?.focus(),300)},[open]);
  // Proactive nudge on first visit (once per session)
  useEffect(()=>{
    let seen=false;try{seen=!!sessionStorage.getItem("bpNudged")}catch(e){}
    if(seen)return;
    const t=setTimeout(()=>{if(!open){setNudge(true);try{sessionStorage.setItem("bpNudged","1")}catch(e){}}},3500);
    return()=>clearTimeout(t);
  },[]);

  const send=(text)=>{
    const q=(text||input).trim();if(!q)return;
    // Action bridge: certain requests drive the tool directly
    const ql=q.toLowerCase();
    const act=window.__bpGo;
    if(act){
      if(/open the contrast|contrast checker|contrast tab/.test(ql))act("contrast");
      else if(/priority fixes|show me priority|priority tab|fix first/.test(ql))act("priority");
      else if(/see all my issues|all my issues|audit tab/.test(ql))act("audit");
      else if(/paste html|paste my html|paste instead/.test(ql))act("paste");
      else if(/load (the )?sample|try the sample/.test(ql))act("sample");
    }
    setMsgs(m=>[...m,{from:"user",text:q}]);setInput("");setTyping(true);
    setTimeout(()=>{
      const m=matchIntent(q);
      setTyping(false);
      setMsgs(ms=>[...ms,{from:"bot",text:m.answer,chips:m.chips}]);
    },550+Math.random()*400);
  };

  // markdown-lite renderer: **bold**, `code`, ```blocks```, \n

    const parts=s.split(/(```[\s\S]*?```)/g);

      if(p.startsWith("```")){const code=p.replace(/```/g,"").trim();return<pre key={i} style={{background:T.bg2,border:`1px solid ${T.b1}`,borderRadius:10,padding:"10px 12px",margin:"8px 0",fontSize:11.5,fontFamily:T.mono,whiteSpace:"pre-wrap",lineHeight:1.55,color:T.mt,overflowX:"auto"}}>{code}</pre>}

    });

      <div style={{fontSize:13,color:T.ink,lineHeight:1.55,paddingRight:14}}>👋 Need a hand? I can help you <strong>scan a page</strong>, read your score, or fix issues.</div>
      <button onClick={()=>{setNudge(false);setOpen(true)}} style={{marginTop:10,padding:"7px 14px",fontSize:12,fontWeight:700,borderRadius:18,border:"none",background:T.teal,color:"#fff",cursor:"pointer"}}>Ask the assistant →</button>
    </div>}

    {/* Launcher */}
    <button onClick={()=>{setOpen(o=>!o);setNudge(false)}} aria-label={open?"Close help assistant":"Open help assistant"} style={{position:"fixed",bottom:24,right:24,width:60,height:60,borderRadius:"50%",border:"none",background:T.teal,cursor:"pointer",boxShadow:"0 6px 24px rgba(13,115,119,.4)",zIndex:1001,display:"flex",alignItems:"center",justifyContent:"center",transition:"transform .25s cubic-bezier(.22,1,.36,1)",transform:open?"scale(.9) rotate(90deg)":"scale(1)"}}>
      {open?<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      :<svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 3L24 8.5V19L14 24.5L4 19V8.5Z" stroke="white" strokeWidth="2" strokeLinejoin="round"/><circle cx="9.5" cy="13" r="1.6" fill="white"/><circle cx="14" cy="13" r="1.6" fill="white"/><circle cx="18.5" cy="13" r="1.6" fill="white"/></svg>}

      {/* ═══ AUDIT ═══ */}
      {tab==="audit"&&<div>
        <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>{[["Level",fL,setFL,["ALL","A","AA","AAA"]],["Status",fS,setFS,["ALL","ISSUES","PASSED"]],["Principle",fP,setFP,["ALL","Perceivable","Operable","Understandable","Robust"]]].map(([l,v,s,o])=><div key={l} style={{display:"flex",alignItems:"center",gap:5}}><label style={{fontSize:10,color:T.dm,textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</label><select value={v} onChange={e=>s(e.target.value)} style={{padding:"8px 12px",fontSize:12,borderRadius:10,border:`1px solid ${T.b1}`,background:T.w,color:T.ink,cursor:"pointer",minHeight:40}}>{o.map(x=><option key={x}>{x}</option>)}</select></div>)}</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {filtered.map(rule=>{const isO=exp===rule.id;const ic=rule.issues.filter(i=>i.s!==SV.I).length;return<div key={rule.id} style={{background:T.w,borderRadius:18,border:`1px solid ${T.b1}`,overflow:"hidden",boxShadow:"0 2px 8px rgba(28,25,23,.03)"}}>
          <button onClick={()=>setExp(isO?null:rule.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"16px 22px",border:"none",background:"transparent",cursor:"pointer",color:T.ink,textAlign:"left",fontSize:14,minHeight:52}}>
            <span style={{width:10,height:10,borderRadius:"50%",background:rule.ok?T.teal:T.rose,flexShrink:0,boxShadow:`0 0 0 3px ${rule.ok?T.ts:T.rs}`}}/>
            <span style={{fontFamily:T.mono,fontSize:12,color:T.teal,fontWeight:600,minWidth:44}}>{rule.id}</span>
            <span style={{fontWeight:500,flex:1}}>{rule.n}</span>
            <span style={{fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:20,color:rule.l==="AAA"?"#6d28d9":rule.l==="AA"?T.navy:T.teal,background:rule.l==="AAA"?"rgba(109,40,217,.06)":rule.l==="AA"?T.ns:T.ts}}>{rule.l}</span>
            {ic>0&&<span style={{fontFamily:T.mono,fontSize:11,color:T.w,fontWeight:700,background:T.rose,padding:"3px 10px",borderRadius:20}}>{ic}</span>}
            <svg width="12" height="12" viewBox="0 0 12 12" fill={T.dm} style={{transform:isO?"rotate(90deg)":"none",transition:"transform .2s"}}><path d="M4 2l4 4-4 4"/></svg>
          </button>
          {isO&&<div className="fade" style={{borderTop:`1px solid ${T.b1}`,padding:"20px 22px",background:T.bg}}>
            {rule.issues.length===0?<div style={{display:"flex",alignItems:"center",gap:8,fontSize:14,color:T.teal,fontWeight:600}}><IllustratedIcon type="check" size={22}/>No issues — passes</div>:
            <div style={{display:"flex",flexDirection:"column",gap:14}}>{rule.issues.map((issue,idx)=>{const isI=issue.s===SV.I;const rec=!isI?getRec(rule.id,issue):null;return<div key={idx} style={{background:SB[issue.s],borderRadius:16,padding:"18px 22px",borderLeft:`4px solid ${SC[issue.s]}`}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
                <span style={{fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:20,color:SC[issue.s],background:"transparent",border:`1px solid ${SC[issue.s]}30`,textTransform:"uppercase"}}>{issue.s}</span>
                {rec&&<span style={{fontSize:9,fontWeight:700,padding:"3px 10px",borderRadius:20,background:`${PC[rec.p]}08`,color:PC[rec.p]}}>{PLBL[rec.p]?.split("—")[0]}</span>}
                {rec&&<span style={{fontSize:9,fontWeight:600,padding:"3px 10px",borderRadius:20,background:T.gs,color:T.green}}>{rec.e}</span>}
              </div>
              <p style={{fontSize:15,margin:"0 0 6px",lineHeight:1.65}}>{issue.msg}</p>
              {issue.el&&issue.el!=="—"&&<code style={{display:"block",fontSize:12,color:T.mt,background:T.bg2,padding:"10px 16px",borderRadius:12,marginBottom:6,wordBreak:"break-all",fontFamily:T.mono,lineHeight:1.55}}>{issue.el}</code>}
              <div style={{fontSize:13,color:T.teal,display:"flex",alignItems:"flex-start",gap:6,fontWeight:600}}><span style={{fontSize:16}}>⮕</span><span style={{lineHeight:1.55}}>{issue.fix}</span></div>
              {rec&&<RecCard rec={rec}/>}
            </div>})}</div>}
          </div>}
        </div>})}</div>
      </div>}

      {/* ═══ PRIORITY ═══ */}
      {tab==="priority"&&<div>
        <h2 style={{fontFamily:T.serif,fontSize:24,marginBottom:20,display:"flex",alignItems:"center",gap:10}}><IllustratedIcon type="warn" size={28}/>Implementation Roadmap</h2>
        {allIssues.length===0?<div style={{background:T.w,borderRadius:20,border:`1px solid ${T.b1}`,padding:40,textAlign:"center",boxShadow:"0 4px 20px rgba(28,25,23,.04)"}}><IllustratedIcon type="check" size={56}/><p style={{fontSize:18,color:T.teal,fontWeight:600,marginTop:14}}>All criteria passed!</p></div>:
        <div style={{display:"flex",flexDirection:"column",gap:14}}>{[1,2,3,4].map(p=>{const items=allIssues.filter(i=>i.rec.p===p);if(!items.length)return null;return<div key={p} style={{background:T.w,borderRadius:20,border:`1px solid ${T.b1}`,overflow:"hidden",boxShadow:"0 2px 12px rgba(28,25,23,.04)"}}>
          <div style={{padding:"14px 22px",borderBottom:`1px solid ${T.b1}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:T.bg}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{width:10,height:10,borderRadius:"50%",background:PC[p],boxShadow:`0 0 0 3px ${PC[p]}15`}}/><span style={{fontSize:15,fontWeight:700,color:PC[p]}}>{PLBL[p]}</span></div>
            <span style={{fontSize:12,fontFamily:T.mono,fontWeight:600,color:T.dm,padding:"4px 12px",borderRadius:20,background:T.w}}>{items.length}</span>
          </div>
          <div style={{padding:"10px 22px"}}>{items.map((i,j)=><div key={j} style={{display:"flex",gap:10,padding:"12px 0",borderBottom:j<items.length-1?`1px solid ${T.b1}`:"none"}}>
            <span style={{fontFamily:T.mono,fontSize:11,color:T.teal,fontWeight:600,minWidth:44,paddingTop:3}}>{i.ruleId}</span>
            <div style={{flex:1}}><p style={{fontSize:14,margin:"0 0 5px",lineHeight:1.55}}>{i.msg}</p><div style={{display:"flex",gap:6}}><span style={{fontSize:9,fontWeight:600,padding:"3px 10px",borderRadius:20,background:SB[i.s],color:SC[i.s],border:`1px solid ${SC[i.s]}20`}}>{i.s}</span><span style={{fontSize:9,fontWeight:600,padding:"3px 10px",borderRadius:20,background:T.gs,color:T.green}}>{i.rec.e}</span></div></div>
          </div>)}</div>
        </div>})}</div>}
      </div>}

      {tab==="contrast"&&<ContrastChecker/>}

      {tab==="preview"&&<div>
        <h2 style={{fontFamily:T.serif,fontSize:24,marginBottom:18}}>Side-by-Side Preview</h2>
        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>{[["Original",T.rose,pRef],["Remediated",T.green,rRef]].map(([l,c,ref])=><div key={l} style={{flex:1,minWidth:250}}>
          <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".1em",fontWeight:700,color:c,marginBottom:8,display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:c,boxShadow:`0 0 0 3px ${c}20`}}/>{l}</div>
          <iframe ref={ref} sandbox="allow-same-origin" style={{width:"100%",height:340,border:`1px solid ${T.b1}`,borderRadius:18,background:T.w,boxShadow:"0 2px 12px rgba(28,25,23,.04)"}} title={l}/>
        </div>)}</div>
      </div>}

      </div>
    </>}

    {/* ════ EMPTY STATE ════ */}
    {!results&&fSt!=="loading"&&<div style={{padding:"80px 28px 60px",textAlign:"center",position:"relative",overflow:"hidden"}}>
      <HexBg w={700} h={400} opacity={.025}/>
      <FloatingHex size={60} x="10%" y="30px" delay={0}/>
      <FloatingHex size={45} x="82%" y="80px" delay={1}/>
      <FloatingHex size={35} x="25%" y="200px" delay={2}/>
      <FloatingHex size={50} x="70%" y="250px" delay={0.5}/>
      <div style={{position:"relative",zIndex:1}}>
        <div style={{marginBottom:28}}>
          <svg width="140" height="140" viewBox="0 0 140 140" fill="none" aria-hidden="true">
            <circle cx="70" cy="70" r="64" stroke={T.bg3} strokeWidth="2" strokeDasharray="8 5"/>
            <circle cx="70" cy="70" r="48" stroke={T.teal} strokeWidth="2" opacity=".15"/>
            <circle cx="70" cy="70" r="32" stroke={T.teal} strokeWidth="1.5" opacity=".08"/>
            <path d="M50 70l14 14 26-26" stroke={T.teal} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" opacity=".25"/>
            <path d="M70 10L82 17V31L70 38L58 31V17Z" fill="none" stroke={T.teal} strokeWidth="1.5" opacity=".12"/>
            <path d="M110 40L118 45V53L110 58L102 53V45Z" fill="none" stroke={T.teal} strokeWidth="1" opacity=".08"/>
            <path d="M30 95L38 100V108L30 113L22 108V100Z" fill="none" stroke={T.teal} strokeWidth="1" opacity=".08"/>
            <path d="M100 90L106 94V100L100 104L94 100V94Z" fill="none" stroke={T.teal} strokeWidth="1" opacity=".06"/>
          </svg>
        </div>
        <h2 style={{fontSize:30,color:T.ink2,marginBottom:10,fontFamily:T.serif,fontWeight:700}}>Enter a URL or paste HTML</h2>
        <p style={{fontSize:16,color:T.dm,lineHeight:1.7,maxWidth:500,margin:"0 auto 28px"}}>{RULES.length} WCAG 2.2 criteria across A, AA, and AAA with visual code fixes, before/after examples, and prioritized roadmap.</p>
        <GradientBar height={2}/>
        <div style={{display:"flex",justifyContent:"center",gap:12,flexWrap:"wrap",marginTop:24}}>
          {["Perceivable","Operable","Understandable","Robust"].map(p=><div key={p} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 18px",borderRadius:20,background:T.w,border:`1px solid ${T.b1}`,boxShadow:"0 2px 8px rgba(28,25,23,.03)"}}>
            <IllustratedIcon type={({Perceivable:"eye",Operable:"keyboard",Understandable:"brain",Robust:"shield"})[p]} size={22}/>
            <span style={{fontSize:13,fontWeight:600,color:T.teal}}>{p}</span>
          </div>)}
        </div>
      </div>
    </div>}

    {/* ════ FOOTER ════ */}
    <WaveSvg color={T.teal} h={40}/>
    <footer style={{padding:"20px 28px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:28,height:28,borderRadius:8,background:T.teal,display:"flex",alignItems:"center",justifyContent:"center"}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><path d="M12 2L20 7V17L12 22L4 17V7Z" strokeLinejoin="round"/></svg></div>
        <span style={{fontSize:12,color:T.dm}}>Built by <a href="https://www.brainpulseinc.com" style={{color:T.teal,textDecoration:"none",fontWeight:600}}>BrainPulse Inc</a></span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 14px",borderRadius:20,background:T.ts,border:`1px solid ${T.tm}`}}>
        <IllustratedIcon type="check" size={14}/>
        <span style={{fontSize:11,fontWeight:600,color:T.teal}}>WCAG 2.2 AAA Compliant</span>
      </div>
    </footer>
    <AssistantWidget/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
