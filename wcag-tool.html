<script type="text/babel">
const {useState,useCallback,useMemo,useRef,useEffect}=React;

/* ═══════════════════════════════════════════════════════════════════
   COLOR UTILITIES
   ═══════════════════════════════════════════════════════════════════ */
const NAMED={white:[255,255,255],black:[0,0,0],red:[255,0,0],green:[0,128,0],blue:[0,0,255],yellow:[255,255,0],gray:[128,128,128],grey:[128,128,128],orange:[255,165,0],purple:[128,0,128],pink:[255,192,203],navy:[0,0,128],teal:[0,128,128],maroon:[128,0,0],lime:[0,255,0],aqua:[0,255,255],silver:[192,192,192],transparent:[255,255,255]};
function parseColor(s){if(!s)return null;s=s.trim().toLowerCase();if(NAMED[s])return NAMED[s];let m=s.match(/^#([0-9a-f]{3,8})$/);if(m){let h=m[1];if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}m=s.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);if(m)return[+m[1],+m[2],+m[3]];return null}
function relLum([r,g,b]){const f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function contrast(a,b){const l1=relLum(a),l2=relLum(b);return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)}

/* ═══════════════════════════════════════════════════════════════════
   URL FETCHER — multiple CORS proxy strategies
   ═══════════════════════════════════════════════════════════════════ */
const PROXIES=[
  url=>`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url=>`https://corsproxy.io/?${encodeURIComponent(url)}`,
  url=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

async function fetchURL(url){
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  for(const proxy of PROXIES){
    try{
      const resp=await fetch(proxy(url),{signal:AbortSignal.timeout(15000)});
      if(resp.ok){const html=await resp.text();if(html.length>100)return{ok:true,html,url};}
    }catch{}
  }
  return{ok:false,html:'',url,error:'Could not fetch URL. The site may block CORS proxies. Try pasting the HTML source directly (View Source → Ctrl+A → Ctrl+C).'};
}

/* ═══════════════════════════════════════════════════════════════════
   WCAG 2.2 AAA — COMPLETE RULE ENGINE (20+ criteria)
   ═══════════════════════════════════════════════════════════════════ */
const S={C:"critical",M:"major",m:"minor",I:"info"};
const SC={critical:"#ff4570",major:"#ffaa30",minor:"#4cacff",info:"#4d5b73"};
const SB={critical:"rgba(255,69,112,.07)",major:"rgba(255,170,48,.07)",minor:"rgba(76,172,255,.07)",info:"rgba(77,91,115,.05)"};

const RULES=[
// ── Perceivable ──────────────────────────────────────────────
{id:"1.1.1",name:"Non-text Content",level:"A",p:"Perceivable",check(d){const r=[];d.querySelectorAll("img").forEach((e,i)=>{if(!e.getAttribute("alt")&&e.getAttribute("alt")!=="")r.push({s:S.C,el:e.outerHTML.substring(0,150),msg:`Image #${i+1} missing alt attribute`,fix:`Add alt="description" or alt="" for decorative`})});d.querySelectorAll("svg").forEach((e,i)=>{if(!e.getAttribute("role")&&!e.querySelector("title"))r.push({s:S.M,el:"<svg>",msg:`SVG #${i+1} missing accessible name`,fix:`Add role="img" aria-label or <title>`})});d.querySelectorAll("input[type='image']").forEach((e,i)=>{if(!e.getAttribute("alt"))r.push({s:S.C,el:e.outerHTML.substring(0,150),msg:`Image input #${i+1} missing alt`,fix:`Add alt="description"`})});d.querySelectorAll("canvas,object,embed,video,audio").forEach((e,i)=>{if(!e.getAttribute("aria-label")&&!e.getAttribute("aria-labelledby")&&!e.textContent?.trim())r.push({s:S.M,el:`<${e.tagName.toLowerCase()}>`,msg:`${e.tagName} #${i+1} missing text alternative`,fix:`Add aria-label or text alternative`})});return r}},
{id:"1.3.1",name:"Info and Relationships",level:"A",p:"Perceivable",check(d){const r=[];d.querySelectorAll("table").forEach((t,i)=>{if(!t.querySelector("th,[role='columnheader']"))r.push({s:S.M,el:"<table>",msg:`Table #${i+1} has no headers`,fix:`Use <th scope="col/row"> for headers`});if(!t.querySelector("caption")&&!t.getAttribute("aria-label")&&!t.getAttribute("aria-labelledby"))r.push({s:S.m,el:"<table>",msg:`Table #${i+1} missing caption`,fix:`Add <caption> or aria-label`})});d.querySelectorAll("fieldset").forEach((f,i)=>{if(!f.querySelector("legend"))r.push({s:S.M,el:"<fieldset>",msg:`Fieldset #${i+1} missing <legend>`,fix:`Add <legend> as first child`})});return r}},
{id:"1.3.5",name:"Identify Input Purpose",level:"AA",p:"Perceivable",check(d){const r=[];d.querySelectorAll("input[type='text'],input[type='email'],input[type='tel'],input[type='url'],input:not([type]),input[type='password']").forEach(e=>{if(!e.getAttribute("autocomplete")&&!e.closest("[autocomplete]")){const n=e.getAttribute("name")||e.getAttribute("id")||"";if(/name|email|phone|tel|address|city|state|zip|postal|country|birth|cc|card|password|user/i.test(n))r.push({s:S.m,el:e.outerHTML.substring(0,150),msg:`Input "${n}" likely personal data but lacks autocomplete`,fix:`Add autocomplete="given-name|email|tel|..."`})}});return r}},
{id:"1.4.3",name:"Contrast (Minimum)",level:"AA",p:"Perceivable",check(d){const r=[];let c=0;d.querySelectorAll("p,span,a,li,td,th,h1,h2,h3,h4,h5,h6,label,button,div").forEach(e=>{if(c>60)return;const st=e.getAttribute("style")||"";const cm=st.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);const bm=st.match(/background(?:-color)?\s*:\s*([^;]+)/i);if(cm&&bm){c++;const fg=parseColor(cm[1].trim()),bg=parseColor(bm[1].trim());if(fg&&bg){const r8=contrast(fg,bg);if(r8<4.5)r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Contrast ${r8.toFixed(2)}:1 — needs ≥4.5:1 (AA) / ≥7:1 (AAA)`,fix:`Darken text or lighten background to ≥7:1`});else if(r8<7)r.push({s:S.m,el:e.outerHTML.substring(0,120),msg:`Contrast ${r8.toFixed(2)}:1 passes AA, fails AAA (≥7:1)`,fix:`Increase to 7:1 for AAA`})}}});return r}},
{id:"1.4.6",name:"Contrast (Enhanced AAA)",level:"AAA",p:"Perceivable",check(){return[{s:S.I,el:"—",msg:`AAA: 7:1 normal text, 4.5:1 large text (18pt+/14pt bold+)`,fix:`Audit all color pairs with contrast checker`}]}},
{id:"1.4.8",name:"Visual Presentation (AAA)",level:"AAA",p:"Perceivable",check(d){const r=[];d.querySelectorAll("p,div,span,li,td,section,article").forEach(e=>{const st=e.getAttribute("style")||"";if(/text-align\s*:\s*justify/i.test(st))r.push({s:S.M,el:e.outerHTML.substring(0,100),msg:`Justified text — AAA prohibits full justification`,fix:`Use text-align: left`});const lh=st.match(/line-height\s*:\s*([0-9.]+)/i);if(lh&&parseFloat(lh[1])<1.5&&!lh[0].includes("px"))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Line-height ${lh[1]} below AAA min 1.5`,fix:`Set line-height ≥ 1.5`})});return r}},
{id:"1.4.10",name:"Reflow",level:"AA",p:"Perceivable",check(d){const r=[];const m=d.querySelector('meta[name="viewport"]');if(m){const c=m.getAttribute("content")||"";if(/maximum-scale\s*=\s*1/i.test(c)||/user-scalable\s*=\s*no/i.test(c))r.push({s:S.C,el:m.outerHTML,msg:`Viewport restricts zoom`,fix:`Remove maximum-scale=1 and user-scalable=no`})}return r}},
{id:"1.4.12",name:"Text Spacing (AA)",level:"AA",p:"Perceivable",check(d){const r=[];const hasOverflowHidden=d.querySelectorAll('[style*="overflow"]');let count=0;hasOverflowHidden.forEach(e=>{const st=e.getAttribute("style")||"";if(/overflow\s*:\s*hidden/i.test(st)&&/height\s*:\s*\d+px/i.test(st)){count++;if(count<=3)r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Fixed height + overflow:hidden may clip text when spacing increased`,fix:`Use min-height and overflow:visible or auto`})}});return r}},
// ── Operable ─────────────────────────────────────────────────
{id:"2.1.1",name:"Keyboard",level:"A",p:"Operable",check(d){const r=[];d.querySelectorAll("[onclick],[onmousedown],[onmouseup]").forEach((e,i)=>{if(!e.getAttribute("onkeydown")&&!e.getAttribute("onkeyup")&&!["A","BUTTON","INPUT","SELECT","TEXTAREA","SUMMARY"].includes(e.tagName))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Element #${i+1} has mouse handler but no keyboard`,fix:`Use <button>/<a> or add keyboard handlers + tabindex="0"`})});d.querySelectorAll("div[onclick],span[onclick],div[role='button'],span[role='button']").forEach((e,i)=>{if(!e.getAttribute("tabindex"))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Clickable element #${i+1} not keyboard-focusable`,fix:`Add tabindex="0" + keyboard handlers, or use <button>`})});return r}},
{id:"2.4.1",name:"Bypass Blocks",level:"A",p:"Operable",check(d){const r=[];if(!d.querySelector('a[href^="#main"],a[href^="#content"],[class*="skip"],[id*="skip"]')&&!d.querySelector("main,[role='main']"))r.push({s:S.M,el:"—",msg:`No skip link or <main> landmark`,fix:`Add <a href="#main" class="skip-link">Skip to content</a> + <main id="main">`});const landmarks=d.querySelectorAll("header,[role='banner'],nav,[role='navigation'],main,[role='main'],footer,[role='contentinfo']");if(landmarks.length===0&&d.querySelectorAll("div").length>5)r.push({s:S.M,el:"—",msg:`No ARIA landmarks found`,fix:`Use semantic HTML: <header>, <nav>, <main>, <footer>`});return r}},
{id:"2.4.2",name:"Page Titled",level:"A",p:"Operable",check(d){const r=[];const t=d.querySelector("title");if(!t||!t.textContent?.trim())r.push({s:S.M,el:"<head>",msg:`Page missing or empty <title>`,fix:`Add descriptive <title> in <head>`});return r}},
{id:"2.4.4",name:"Link Purpose (In Context)",level:"A",p:"Operable",check(d){const r=[];const vague=["click here","here","read more","more","link","this","learn more","download"];d.querySelectorAll("a").forEach((a,i)=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();if(vague.includes(t))r.push({s:S.M,el:a.outerHTML.substring(0,120),msg:`Link #${i+1} text "${t}" is ambiguous`,fix:`Use descriptive text, e.g. "Read our accessibility policy"`});if(!t&&!a.querySelector("img[alt]")&&!a.getAttribute("aria-labelledby"))r.push({s:S.C,el:a.outerHTML.substring(0,120),msg:`Link #${i+1} has no accessible text`,fix:`Add text, aria-label, or img with alt`})});return r}},
{id:"2.4.6",name:"Headings and Labels",level:"AA",p:"Operable",check(d){const r=[];const hs=d.querySelectorAll("h1,h2,h3,h4,h5,h6");let prev=0,h1c=0;hs.forEach(h=>{const l=+h.tagName[1];if(l===1)h1c++;if(prev>0&&l>prev+1)r.push({s:S.M,el:h.outerHTML.substring(0,100),msg:`Heading skips h${prev} → h${l}`,fix:`Use sequential levels`});if(!h.textContent?.trim())r.push({s:S.M,el:h.outerHTML.substring(0,100),msg:`Empty heading h${l}`,fix:`Add text or remove`});prev=l});if(h1c===0&&hs.length>0)r.push({s:S.M,el:"—",msg:`No <h1> found`,fix:`Add <h1> as primary heading`});if(h1c>1)r.push({s:S.m,el:"—",msg:`Multiple <h1> (${h1c})`,fix:`Use single <h1>`});return r}},
{id:"2.4.7",name:"Focus Visible",level:"AA",p:"Operable",check(d){const r=[];const styles=d.querySelectorAll("style");let hasOutlineNone=false;styles.forEach(s=>{if(/outline\s*:\s*(none|0)/i.test(s.textContent||""))hasOutlineNone=true});d.querySelectorAll("[style]").forEach(e=>{if(/outline\s*:\s*(none|0)/i.test(e.getAttribute("style")||""))hasOutlineNone=true});if(hasOutlineNone)r.push({s:S.M,el:"—",msg:`outline:none found — keyboard focus may be invisible`,fix:`Never remove focus outlines without a visible alternative`});return r}},
{id:"2.4.11",name:"Focus Not Obscured (Minimum)",level:"AA",p:"Operable",check(d){const r=[];d.querySelectorAll('[style*="position"]').forEach(e=>{const st=e.getAttribute("style")||"";if(/position\s*:\s*(fixed|sticky)/i.test(st)&&/z-index/i.test(st))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Fixed/sticky element may obscure focused content`,fix:`Ensure focused elements aren't hidden behind fixed headers/footers`})});return r}},
{id:"2.4.9",name:"Link Purpose (Link Only — AAA)",level:"AAA",p:"Operable",check(d){const r=[];const map={};d.querySelectorAll("a[href]").forEach(a=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();const h=a.getAttribute("href");if(t&&h){if(map[t]&&map[t]!==h)r.push({s:S.m,el:a.outerHTML.substring(0,120),msg:`"${t}" links to different URLs`,fix:`Same text → same destination (AAA)`});map[t]=h}});return r}},
{id:"2.5.3",name:"Label in Name",level:"A",p:"Operable",check(d){const r=[];d.querySelectorAll("button[aria-label],a[aria-label],input[aria-label]").forEach(e=>{const al=(e.getAttribute("aria-label")||"").toLowerCase();const vt=(e.textContent||"").trim().toLowerCase();if(vt&&al&&!al.includes(vt))r.push({s:S.M,el:e.outerHTML.substring(0,120),msg:`aria-label "${al}" doesn't contain visible "${vt}"`,fix:`aria-label must include visible text`})});return r}},
{id:"2.5.8",name:"Target Size (Minimum)",level:"AA",p:"Operable",check(d){const r=[];d.querySelectorAll("a,button,input[type='checkbox'],input[type='radio'],.btn,[role='button']").forEach((e,i)=>{const st=e.getAttribute("style")||"";const wm=st.match(/width\s*:\s*(\d+)px/i);const hm=st.match(/height\s*:\s*(\d+)px/i);if(wm&&hm&&(+wm[1]<24||+hm[1]<24))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Touch target may be < 24×24px CSS pixels`,fix:`Ensure interactive targets are at least 24×24px (44×44px for AAA)`})});return r}},
// ── Understandable ───────────────────────────────────────────
{id:"3.1.1",name:"Language of Page",level:"A",p:"Understandable",check(d){const r=[];const h=d.querySelector("html");if(h&&!h.getAttribute("lang"))r.push({s:S.C,el:"<html>",msg:`Missing lang attribute`,fix:`Add lang="en" (or correct code) to <html>`});return r}},
{id:"3.1.2",name:"Language of Parts",level:"AA",p:"Understandable",check(d){const r=[];d.querySelectorAll("[lang]").forEach(e=>{const l=e.getAttribute("lang");if(l&&!/^[a-z]{2,3}(-[A-Za-z]{2,4})?$/.test(l))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Invalid lang="${l}"`,fix:`Use valid BCP 47 code`})});return r}},
{id:"3.2.2",name:"On Input",level:"A",p:"Understandable",check(d){const r=[];d.querySelectorAll("select[onchange]").forEach((e,i)=>{if(/submit|location|navigate|href|window\.open/i.test(e.getAttribute("onchange")||""))r.push({s:S.M,el:e.outerHTML.substring(0,120),msg:`Select #${i+1} auto-navigates on change`,fix:`Use explicit submit button`})});return r}},
{id:"3.2.6",name:"Consistent Help (A)",level:"A",p:"Understandable",check(d){const r=[];const helpLinks=d.querySelectorAll('a[href*="help"],a[href*="support"],a[href*="contact"],a[href*="faq"]');if(helpLinks.length===0&&d.querySelectorAll("a").length>10)r.push({s:S.I,el:"—",msg:`No help/contact/support links detected`,fix:`Provide consistent help mechanism on every page`});return r}},
{id:"3.3.2",name:"Labels or Instructions",level:"A",p:"Understandable",check(d){const r=[];d.querySelectorAll("input:not([type='hidden']):not([type='submit']):not([type='button']):not([type='reset']):not([type='image']),select,textarea").forEach((e,i)=>{const id=e.getAttribute("id");const has=id&&d.querySelector(`label[for="${id}"]`);if(!has&&!e.closest("label")&&!e.getAttribute("aria-label")&&!e.getAttribute("aria-labelledby")&&!e.getAttribute("title"))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Form control #${i+1} has no label`,fix:`Add <label for="id"> or aria-label`})});return r}},
{id:"3.3.7",name:"Redundant Entry (A)",level:"A",p:"Understandable",check(d){const r=[];const names={};d.querySelectorAll("input[name],select[name],textarea[name]").forEach(e=>{const n=e.getAttribute("name");if(names[n])r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Duplicate input name "${n}" — may force redundant entry`,fix:`Auto-populate previously entered data or use autocomplete`});names[n]=true});return r}},
{id:"3.3.8",name:"Accessible Authentication (Minimum)",level:"AA",p:"Understandable",check(d){const r=[];const authInputs=d.querySelectorAll("input[type='password'],input[name*='captcha'],input[name*='otp'],.captcha,[class*='captcha']");if(authInputs.length>0)r.push({s:S.I,el:"—",msg:`Authentication inputs detected — ensure cognitive function test alternatives exist`,fix:`Allow paste in password fields, provide alternatives to CAPTCHAs, support password managers`});return r}},
// ── Robust ────────────────────────────────────────────────────
{id:"4.1.2",name:"Name, Role, Value",level:"A",p:"Robust",check(d){const r=[];const valid=new Set(["alert","alertdialog","application","article","banner","button","cell","checkbox","columnheader","combobox","complementary","contentinfo","definition","dialog","directory","document","feed","figure","form","grid","gridcell","group","heading","img","link","list","listbox","listitem","log","main","marquee","math","menu","menubar","menuitem","menuitemcheckbox","menuitemradio","navigation","none","note","option","presentation","progressbar","radio","radiogroup","region","row","rowgroup","rowheader","scrollbar","search","searchbox","separator","slider","spinbutton","status","switch","tab","table","tablist","tabpanel","term","textbox","timer","toolbar","tooltip","tree","treegrid","treeitem"]);d.querySelectorAll("[role]").forEach(e=>{const role=e.getAttribute("role");if(!valid.has(role))r.push({s:S.M,el:e.outerHTML.substring(0,100),msg:`Invalid role="${role}"`,fix:`Use valid WAI-ARIA role`})});d.querySelectorAll("[aria-hidden='true']").forEach(e=>{if(e.querySelector("a[href],button,input,select,textarea,[tabindex]:not([tabindex='-1'])"))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Focusable content inside aria-hidden`,fix:`Remove aria-hidden or defocus inner elements`})});return r}},
{id:"4.1.1",name:"Parsing / Duplicate IDs",level:"A",p:"Robust",check(d){const r=[];const ids={};d.querySelectorAll("[id]").forEach(e=>{const id=e.getAttribute("id");if(ids[id])r.push({s:S.M,el:e.outerHTML.substring(0,100),msg:`Duplicate id="${id}"`,fix:`All IDs must be unique`});ids[id]=true});return r}},
];

function analyze(html){const p=new DOMParser();const d=p.parseFromString(html,"text/html");return RULES.map(r=>{const issues=r.check(d);return{...r,issues,passed:issues.filter(i=>i.s!==S.I).length===0}})}
function autoFix(html){let f=html;if(/<html(?![^>]*\slang\s*=)/i.test(f))f=f.replace(/<html/i,'<html lang="en"');f=f.replace(/user-scalable\s*=\s*no/gi,"user-scalable=yes");f=f.replace(/maximum-scale\s*=\s*1(?:\.0)?/gi,"maximum-scale=5.0");f=f.replace(/text-align\s*:\s*justify/gi,"text-align: left");return f}

/* ═══════════════════════════════════════════════════════════════════
   AI ENGINE
   ═══════════════════════════════════════════════════════════════════ */
async function aiFix(issue,html){
  const snip=html.length>3000?html.substring(0,3000)+"\n<!-- truncated -->":html;
  try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`WCAG 2.2 AAA expert. Issue:\n\nWCAG: ${issue.ruleId} — ${issue.ruleName}\nSeverity: ${issue.s}\nIssue: ${issue.msg}\nElement: ${issue.el}\nFix: ${issue.fix}\n\nHTML:\n\`\`\`html\n${snip}\n\`\`\`\n\nRespond ONLY valid JSON:\n{"explanation":"why problem + who affected","designTip":"concrete UX suggestion","fixedCode":"corrected snippet","beforeAfter":"what changed"}`}]})});const d=await r.json();return JSON.parse((d.content?.map(b=>b.text||"").join("")||"").replace(/```json|```/g,"").trim())}catch{return{explanation:"Could not generate.",designTip:"",fixedCode:"",beforeAfter:""}}
}
async function aiFullFix(html,issues){
  const list=issues.slice(0,14).map(i=>`• [${i.s}] ${i.ruleId} ${i.ruleName}: ${i.msg}`).join("\n");
  const snip=html.length>4000?html.substring(0,4000)+"\n<!-- truncated -->":html;
  try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`Fix ALL accessibility issues:\n\n${list}\n\nHTML:\n\`\`\`html\n${snip}\n\`\`\`\n\nReturn ONLY corrected HTML.`}]})});const d=await r.json();return(d.content?.map(b=>b.text||"").join("")||"").replace(/```html|```/g,"").trim()}catch{return html}
}

t:1.6,maxHeight:180,overflow:"auto"}}>{rec.fixedCode}</pre></div>}</div>;

function ContrastChecker(){const[fg,setFg]=useState("#555");const[bg,setBg]=useState("#fff");const fr=parseColor(fg),br=parseColor(bg);const r=fr&&br?contrast(fr,br):null;const t=r?[["AA",r>=4.5,"≥4.5"],["AA Lg",r>=3,"≥3"],["AAA",r>=7,"≥7"],["AAA Lg",r>=4.5,"≥4.5"]]:[];return<div style={{background:"var(--bg2)",borderRadius:12,border:"1px solid var(--border)",padding:22}}><h3 style={{margin:"0 0 16px",fontFamily:"var(--f1)",fontSize:19}}>Contrast Checker</h3><div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:18}}>{[["Foreground",fg,setFg],["Background",bg,setBg]].map(([l,v,s])=><label key={l} style={{display:"flex",flexDirection:"column",gap:5,flex:1,minWidth:140}}><span style={{fontSize:10,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</span><div style={{display:"flex",gap:7,alignItems:"center"}}><input type="color" value={v} onChange={e=>s(e.target.value)} style={{width:40,height:36,border:"none",cursor:"pointer",borderRadius:6}}/><input type="text" value={v} onChange={e=>s(e.target.value)} style={{flex:1,padding:"8px 11px",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:7,color:"var(--text)",fontFamily:"var(--f3)",fontSize:12.5}}/></div></label>)}</div><div style={{background:br?bg:"#fff",color:fr?fg:"#000",padding:"20px 24px",borderRadius:9,marginBottom:16,border:"1px solid var(--border)"}}><div style={{fontSize:19,marginBottom:5,fontWeight:500}}>The quick brown fox jumps over the lazy dog</div><div style={{fontSize:13}}>Small text — 13px regular weight</div></div>{r!==null&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))",gap:7}}><div style={{textAlign:"center",padding:12,background:"var(--bg)",borderRadius:7}}><div style={{fontSize:28,fontFamily:"var(--f3)",fontWeight:700,color:r>=7?"var(--accent)":r>=4.5?"var(--orange)":"var(--red)"}}>{r.toFixed(2)}</div><div style={{fontSize:9,color:"var(--text3)",marginTop:2,textTransform:"uppercase"}}>Ratio</div></div>{t.map(([l,pass,req])=><div key={l} style={{textAlign:"center",padding:12,background:pass?"rgba(15,240,212,.05)":"rgba(255,69,112,.05)",borderRadius:7,border:`1px solid ${pass?"rgba(15,240,212,.15)":"rgba(255,69,112,.15)"}`}}><div style={{fontSize:15,fontWeight:700,color:pass?"var(--accent)":"var(--red)"}}>{pass?"PASS":"FAIL"}</div><div style={{fontSize:9,color:"var(--text3)",marginTop:2}}>{l} {req}</div></div>)}</div>}</div>}
function HeadingOutline({html}){const h=useMemo(()=>{if(!html)return[];const d=new DOMParser().parseFromString(html,"text/html");const r=[];d.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(h=>r.push({level:+h.tagName[1],text:h.textContent?.trim()||"(empty)",tag:h.tagName}));return r},[html]);if(!h.length)return<div style={{padding:32,color:"var(--text3)",textAlign:"center"}}>No headings found.</div>;let prev=0;return<div style={{background:"var(--bg2)",borderRadius:12,border:"1px solid var(--border)",padding:"18px 22px"}}><h3 style={{margin:"0 0 12px",fontFamily:"var(--f1)",fontSize:19}}>Heading Outline</h3>{h.map((h,i)=>{const skip=prev>0&&h.level>prev+1;prev=h.level;return<div key={i} style={{display:"flex",alignItems:"center",gap:7,paddingLeft:(h.level-1)*20,marginBottom:4}}><span style={{fontFamily:"var(--f3)",fontSize:10,padding:"2px 6px",borderRadius:4,background:skip?"rgba(255,69,112,.1)":"var(--accent2)",color:skip?"var(--red)":"var(--accent)",fontWeight:600}}>{h.tag}</span><span style={{fontSize:12.5,color:h.text==="(empty)"?"var(--red)":"var(--text)"}}>{h.text}</span>{skip&&<span style={{fontSize:9,color:"var(--red)",fontWeight:700}}>⚠ SKIP</span>}</div>})}</div>}

const TABS=[{k:"audit",l:"Audit",i:"◉"},{k:"preview",l:"Preview",i:"◫"},{k:"contrast",l:"Contrast",i:"◑"},{k:"outline",l:"Outline",i:"≡"},{k:"remediate",l:"AI Remediate",i:"✦"}];

function App(){
  const[mode,setMode]=useState("url"); // "url" or "html"
  const[url,setUrl]=useState("");
  const[html,setHtml]=useState("");
  const[fetchStatus,setFetchStatus]=useState(null); // null|"loading"|"done"|"error"
  const[fetchError,setFetchError]=useState("");
  const[scannedUrl,setScannedUrl]=useState("");
  const[results,setResults]=useState(null);
  const[tab,setTab]=useState("audit");
  const[fL,setFL]=useState("ALL");const[fS,setFS]=useState("ALL");const[fP,setFP]=useState("ALL");
  const[exp,setExp]=useState(null);
  const[aiR,setAiR]=useState({});const[aiL,setAiL]=useState({});
  const[rem,setRem]=useState("");const[aiRem,setAiRem]=useState(false);const[aiRemDone,setAiRemDone]=useState("");
  const[applied,setApplied]=useState(new Set());
  const allRef=useRef([]);

  const doAudit=useCallback((sourceHtml,sourceUrl)=>{
    if(!sourceHtml?.trim())return;
    const r=analyze(sourceHtml);
    setHtml(sourceHtml);
    setResults(r);setRem(autoFix(sourceHtml));
    setAiR({});setAiL({});setAiRemDone("");setApplied(new Set());
    setTab("audit");if(sourceUrl)setScannedUrl(sourceUrl);
  },[]);

  const scanUrl=useCallback(async()=>{
    if(!url.trim())return;
    setFetchStatus("loading");setFetchError("");setResults(null);
    const res=await fetchURL(url.trim());
    if(res.ok){setFetchStatus("done");doAudit(res.html,res.url);}
    else{setFetchStatus("error");setFetchError(res.error);}
  },[url,doAudit]);

  const runHtmlAudit=useCallback(()=>{doAudit(html,"")},[html,doAudit]);

  const allIssues=useMemo(()=>{if(!results)return[];const l=[];results.forEach(r=>r.issues.filter(i=>i.s!==S.I).forEach(i=>l.push({...i,ruleId:r.id,ruleName:r.name})));allRef.current=l;return l},[results]);
  const reqAI=useCallback(async(issue,idx)=>{setAiL(p=>({...p,[idx]:true}));const rec=await aiFix(issue,html);setAiR(p=>({...p,[idx]:rec}));setAiL(p=>({...p,[idx]:false}))},[html]);
  const applyF=useCallback((idx,code)=>{const issue=allRef.current[idx];if(!issue||!code)return;setRem(prev=>{if(issue.el&&issue.el!=="—"&&prev.includes(issue.el))return prev.replace(issue.el,code);return prev});setApplied(p=>new Set([...p,idx]))},[]);
  const runFullAI=useCallback(async()=>{if(!results)return;setAiRem(true);const f=await aiFullFix(html,allRef.current);setAiRemDone(f);setRem(f);setAiRem(false)},[html,results]);

  const filtered=useMemo(()=>{if(!results)return[];return results.filter(r=>{if(fL!=="ALL"&&r.level!==fL)return false;if(fP!=="ALL"&&r.p!==fP)return false;if(fS==="ISSUES"&&r.passed)return false;if(fS==="PASSED"&&!r.passed)return false;return true})},[results,fL,fS,fP]);
  const stats=useMemo(()=>{if(!results)return null;const t=results.length,p=results.filter(r=>r.passed).length;const all=results.flatMap(r=>r.issues).filter(i=>i.s!==S.I);return{total:t,passed:p,crit:all.filter(i=>i.s===S.C).length,maj:all.filter(i=>i.s===S.M).length,min:all.filter(i=>i.s===S.m).length,score:t>0?Math.round((p/t)*100):0,issues:all.length}},[results]);
  const sColor=stats?(stats.score>=80?"var(--accent)":stats.score>=50?"var(--orange)":"var(--red)"):"var(--text3)";
  let gIdx=-1;

  return<div style={{maxWidth:1120,margin:"0 auto",padding:"0 0 50px"}}>

    <header style={{borderBottom:"1px solid var(--border)",padding:"16px 26px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>

    </header>

        </div>

        {fetchStatus==="done"&&scannedUrl&&<p style={{fontSize:12,color:"var(--accent)",padding:"6px 0"}}>✓ Fetched {scannedUrl} — {html.length.toLocaleString()} chars</p>}
      </div>}

          <div style={{display:"flex",gap:7}}><button onClick={()=>{setHtml(SAMPLE);setResults(null)}} style={{padding:"6px 14px",fontSize:11.5,borderRadius:7,border:"1px solid var(--border)",background:"var(--bg2)",color:"var(--text2)",cursor:"pointer"}}>Load Sample</button><button onClick={runHtmlAudit} disabled={!html.trim()} style={{padding:"6px 18px",fontSize:11.5,borderRadius:7,border:"none",background:html.trim()?"var(--accent)":"rgba(15,240,212,.2)",color:"#06090f",cursor:html.trim()?"pointer":"default",fontWeight:700}}>▶ Audit</button></div>
        </div>

      </div>}

      <nav style={{display:"flex",borderBottom:"1px solid var(--border)",padding:"0 18px",overflowX:"auto"}}>{TABS.map(t=><button key={t.k} onClick={()=>setTab(t.k)} style={{position:"relative",padding:"12px 17px",fontSize:12,fontWeight:tab===t.k?600:400,cursor:"pointer",border:"none",background:"transparent",color:tab===t.k?"var(--accent)":"var(--text3)",display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap",borderBottom:tab===t.k?"2px solid var(--accent)":"2px solid transparent"}}><span style={{fontSize:13}}>{t.i}</span>{t.l}</button>)}</nav>
      <div style={{padding:"20px 26px",minHeight:280}}>

      {/* AUDIT */}
      {tab==="audit"&&<>
        <div style={{display:"flex",gap:7,marginBottom:16,flexWrap:"wrap"}}><Stat label="Rules" value={stats.total} color="var(--text)"/><Stat label="Passed" value={stats.passed} color="var(--accent)"/><Stat label="Issues" value={stats.issues} color="var(--red)"/><Stat label="Critical" value={stats.crit} color="var(--red)"/><Stat label="Major" value={stats.maj} color="var(--orange)"/><Stat label="Minor" value={stats.min} color="var(--blue)"/></div>
        <div style={{display:"flex",gap:9,marginBottom:14,flexWrap:"wrap"}}>{[["Level",fL,setFL,["ALL","A","AA","AAA"]],["Status",fS,setFS,["ALL","ISSUES","PASSED"]],["Principle",fP,setFP,["ALL","Perceivable","Operable","Understandable","Robust"]]].map(([l,v,s,o])=><div key={l} style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:9.5,color:"var(--text3)",textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</span><select value={v} onChange={e=>s(e.target.value)} style={{padding:"5px 9px",fontSize:11,borderRadius:6,border:"1px solid var(--border)",background:"var(--bg3)",color:"var(--text)",cursor:"pointer"}}>{o.map(x=><option key={x}>{x}</option>)}</select></div>)}</div>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
        {filtered.map(rule=>{const isO=exp===rule.id;const ic=rule.issues.filter(i=>i.s!==S.I).length;return<div key={rule.id} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:9,overflow:"hidden"}}><button onClick={()=>setExp(isO?null:rule.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"12px 16px",border:"none",background:"transparent",cursor:"pointer",color:"var(--text)",textAlign:"left",fontSize:12.5,transition:"background .1s"}}><span style={{width:7,height:7,borderRadius:"50%",background:rule.passed?"var(--accent)":"var(--red)",flexShrink:0}}/><span style={{fontFamily:"var(--f3)",fontSize:11,color:"var(--accent)",fontWeight:600,minWidth:40}}>{rule.id}</span><span style={{fontWeight:500,flex:1}}>{rule.name}</span><Pill color={rule.level==="AAA"?"var(--purple)":rule.level==="AA"?"var(--blue)":"var(--accent)"} bg={rule.level==="AAA"?"rgba(184,136,255,.08)":rule.level==="AA"?"rgba(76,172,255,.08)":"var(--accent2)"}>{rule.level}</Pill><Pill color="var(--text3)" bg="rgba(140,160,200,.05)">{rule.p}</Pill>{ic>0&&<span style={{fontFamily:"var(--f3)",fontSize:10.5,color:"var(--red)",fontWeight:600}}>{ic}</span>}<span style={{fontSize:9,color:"var(--text3)",transform:isO?"rotate(90deg)":"none",transition:"transform .15s"}}>▶</span></button>
        {isO&&<div style={{borderTop:"1px solid var(--border)",padding:"12px 16px"}}>{rule.issues.length===0?<p style={{fontSize:12.5,color:"var(--accent)",margin:0}}>✓ No issues.</p>:<div style={{display:"flex",flexDirection:"column",gap:12}}>{rule.issues.map((issue,idx)=>{const isI=issue.s===S.I;if(!isI)gIdx++;const gi=gIdx;return<div key={idx} style={{background:SB[issue.s],borderRadius:8,padding:"12px 16px",borderLeft:`3px solid ${SC[issue.s]}`}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:7,marginBottom:7,flexWrap:"wrap"}}><Pill color={SC[issue.s]} bg="transparent">{issue.s}</Pill>{!isI&&!aiR[gi]&&<button onClick={()=>reqAI({...issue,ruleId:rule.id,ruleName:rule.name},gi)} disabled={aiL[gi]} style={{padding:"4px 12px",fontSize:10,borderRadius:5,border:"1px solid rgba(15,240,212,.18)",background:"rgba(15,240,212,.05)",color:"var(--accent)",cursor:aiL[gi]?"default":"pointer",fontWeight:600,display:"inline-flex",alignItems:"center",gap:5}}>{aiL[gi]?<><span className="spinner" style={{width:11,height:11}}/>Working…</>:<>✦ AI Fix</>}</button>}</div><p style={{fontSize:12.5,margin:"0 0 5px",lineHeight:1.6}}>{issue.msg}</p>{issue.el&&issue.el!=="—"&&<code style={{display:"block",fontSize:10.5,color:"var(--text2)",background:"rgba(0,0,0,.25)",padding:"7px 11px",borderRadius:5,marginBottom:5,wordBreak:"break-all",fontFamily:"var(--f3)",lineHeight:1.5}}>{issue.el}</code>}<div style={{fontSize:11.5,color:"var(--accent)",display:"flex",alignItems:"flex-start",gap:5}}><span>⮕</span><span style={{lineHeight:1.55}}>{issue.fix}</span></div>{!isI&&<AICard rec={aiR[gi]} loading={aiL[gi]} applied={applied.has(gi)} onApply={()=>applyF(gi,aiR[gi]?.fixedCode)}/>}</div>})}</div>}</div>}</div>})}
        </div>
      </>}

      {tab==="preview"&&<div><h3 style={{margin:"0 0 14px",fontFamily:"var(--f1)",fontSize:19}}>Side-by-Side Preview</h3><div style={{display:"flex",gap:14,flexWrap:"wrap"}}><LivePreview html={html} label="Original" color="var(--red)"/><LivePreview html={rem} label="Remediated" color="var(--accent)"/></div></div>}
      {tab==="contrast"&&<ContrastChecker/>}
      {tab==="outline"&&<HeadingOutline html={html}/>}
      {tab==="remediate"&&<div style={{display:"flex",flexDirection:"column",gap:18}}>
        <div style={{background:"linear-gradient(135deg,rgba(15,240,212,.03),rgba(76,172,255,.02))",borderRadius:11,border:"1px solid rgba(15,240,212,.1)",padding:"22px 24px"}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:12}}><div><h3 style={{margin:"0 0 4px",fontFamily:"var(--f1)",fontSize:20}}>✦ AI Full Remediation</h3><p style={{margin:0,fontSize:12.5,color:"var(--text2)",lineHeight:1.5,maxWidth:560}}>Send HTML to Claude for comprehensive fix of all detected issues.</p></div><button onClick={runFullAI} disabled={aiRem} style={{padding:"10px 22px",fontSize:12.5,borderRadius:7,border:"1px solid rgba(15,240,212,.18)",background:"rgba(15,240,212,.05)",color:"var(--accent)",cursor:aiRem?"default":"pointer",fontWeight:600,display:"inline-flex",alignItems:"center",gap:6}}>{aiRem?<><span className="spinner"/>Remediating…</>:<>✦ Generate Full Fix</>}</button></div>{aiRemDone&&<div style={{background:"rgba(15,240,212,.03)",borderRadius:7,padding:"10px 14px",border:"1px solid rgba(15,240,212,.08)"}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:5}}><span style={{fontSize:10,textTransform:"uppercase",color:"var(--accent)",fontWeight:700}}>✓ Applied</span><div style={{display:"flex",gap:5}}><button onClick={()=>navigator.clipboard?.writeText(aiRemDone)} style={{padding:"4px 11px",fontSize:10.5,borderRadius:6,border:"1px solid var(--border)",background:"var(--bg2)",color:"var(--text2)",cursor:"pointer"}}>Copy</button><button onClick={()=>{setHtml(rem);setResults(null);setMode("html")}} style={{padding:"4px 11px",fontSize:10.5,borderRadius:6,border:"1px solid var(--border)",background:"var(--bg2)",color:"var(--text2)",cursor:"pointer"}}>Re-Audit</button></div></div></div>}</div>
        <div style={{background:"var(--bg2)",borderRadius:11,border:"1px solid var(--border)",padding:"20px 24px"}}><h3 style={{margin:"0 0 4px",fontFamily:"var(--f1)",fontSize:17}}>Auto-Fixes</h3><p style={{margin:"0 0 12px",fontSize:12.5,color:"var(--text2)",lineHeight:1.6}}>lang="en" added, zoom unlocked, justified text fixed.{applied.size>0&&<> + <strong style={{color:"var(--accent)"}}>{applied.size}</strong> AI fix{applied.size>1?"es":""}.</>}</p><div style={{display:"flex",gap:7,flexWrap:"wrap"}}><button onClick={()=>navigator.clipboard?.writeText(rem)} style={{padding:"7px 18px",fontSize:11.5,borderRadius:7,border:"none",background:"var(--accent)",color:"#06090f",cursor:"pointer",fontWeight:700}}>Copy HTML</button><button onClick={()=>{setHtml(rem);setResults(null);setMode("html")}} style={{padding:"7px 16px",fontSize:11.5,borderRadius:7,border:"1px solid var(--border)",background:"var(--bg2)",color:"var(--text2)",cursor:"pointer"}}>Load & Re-Audit</button></div></div>
        <div style={{background:"var(--bg2)",borderRadius:11,border:"1px solid var(--border)",padding:"20px 24px"}}><h3 style={{margin:"0 0 8px",fontFamily:"var(--f1)",fontSize:17}}>Output</h3><textarea readOnly value={rem} style={{width:"100%",minHeight:220,padding:"13px 15px",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:9,color:"#a8f0e0",fontFamily:"var(--f3)",fontSize:11.5,lineHeight:1.6,resize:"vertical",boxSizing:"border-box"}}/></div>
        <div style={{background:"var(--bg2)",borderRadius:11,border:"1px solid var(--border)",padding:"20px 24px"}}><h3 style={{margin:"0 0 10px",fontFamily:"var(--f1)",fontSize:17}}>Manual Checklist</h3>{results.filter(r=>!r.passed).map(r=><div key={r.id} style={{marginBottom:12,paddingBottom:12,borderBottom:"1px solid var(--border)"}}><div style={{fontSize:12.5,fontWeight:600,color:"var(--accent)",marginBottom:4}}>{r.id} — {r.name} <span style={{fontSize:10,color:"var(--text3)"}}>({r.level})</span></div>{r.issues.filter(i=>i.s!==S.I).map((i,j)=><div key={j} style={{fontSize:11.5,color:"var(--text2)",marginLeft:12,marginBottom:3,lineHeight:1.55}}>• {i.fix}</div>)}</div>)}</div>
      </div>}

      </div>
    </>}

    {/* Empty */}
    {!results&&fetchStatus!=="loading"&&<div style={{padding:"65px 26px",textAlign:"center"}}><div style={{fontSize:50,marginBottom:12,opacity:.1,fontFamily:"var(--f3)"}}>⬡</div><p style={{fontSize:17,color:"var(--text2)",margin:"0 0 5px",fontFamily:"var(--f1)"}}>Enter a URL or paste HTML to begin</p><p style={{fontSize:12.5,color:"var(--text3)"}}>{RULES.length} WCAG 2.2 criteria · A / AA / AAA · AI-powered remediation</p></div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
