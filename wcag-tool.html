"2.4.12":{x:"When fixed headers/footers/cookie banners cover the focused element, keyboard users lose track of their position entirely. It's like navigating a page with a blindfold over the center of the screen.",dt:"Use scroll-padding-top/bottom matching your fixed element heights. Test by tabbing through the page with sticky headers visible. Use CSS scroll-margin on focusable elements inside content areas.",e:"Medium",p:1,

"3.3.9":{x:"Requiring users to memorize or transcribe passwords, CAPTCHAs, or security codes discriminates against users with cognitive disabilities, memory impairments, and learning disabilities.",dt:"Support passkeys, biometric auth, and password managers. Never block paste in password fields. Provide alternatives to CAPTCHAs (honeypot, invisible reCAPTCHA). Allow OAuth/SSO sign-in.",e:"Significant",p:2,

    bH:`<div style="border:2px dashed #ff3d6b;padding:12px;border-radius:6px;background:#fff"><input type="password" placeholder="Password" style="padding:8px;border:1px solid #ddd;border-radius:4px;width:100%;margin-bottom:8px;font-size:13px;color:#333"><div style="background:#f0f0f0;padding:8px;border-radius:4px;font-size:12px;color:#666;text-align:center">Type: <span style="font-family:monospace;font-weight:700;letter-spacing:3px;color:#333">X7kQ9</span></div><div style="color:#ff3d6b;font-size:11px;margin-top:6px">⚠ paste disabled + visual CAPTCHA = cognitive barrier</div></div>`,

"3.2.6":{x:"AAA requires consistent help mechanisms (chat, phone, email) on every page in the same location. Users with cognitive disabilities rely on predictable placement — if help moves or disappears, they can't find it.",dt:"Add a persistent help block in the footer with Contact, Phone, and Live Chat. Use role=\"complementary\" and aria-label=\"Need Help?\". Verify it appears on every template/route.",e:"Medium",p:2,
  gen:()=>({before:`<footer>\n  <a href="/about">About</a>\n  <a href="/privacy">Privacy</a>\n  <!-- No help section -->\n</footer>`,after:`<footer class="site-footer">\n  <div class="footer-links">\n    <a href="/about">About</a>\n    <a href="/privacy">Privacy</a>\n  </div>\n  <div class="help-section"\n    role="complementary"\n    aria-label="Need Help?">\n    <ul>\n      <li><a href="/contact">Contact Support</a></li>\n      <li><a href="tel:18005550199">Call: 1-800-555-0199</a></li>\n      <li><button id="live-chat">Live Chat</button></li>\n    </ul>\n  </div>\n</footer>`,

"3.1.1":{x:"Without a lang attribute, screen readers guess the language — often wrong. A French engine reading English produces gibberish. This also breaks auto-translation and hyphenation.",dt:"Set lang on <html>. For multilingual content, use lang on specific elements: <span lang=\"fr\">Bonjour</span>.",e:"Quick fix",p:1,gen:()=>({before:`<html>`,after:`<html lang="en">`,bH:`<div style="border:2px dashed #ff3d6b;padding:10px;border-radius:6px;background:#fff;font-family:monospace;font-size:12px;color:#333"><code>&lt;html&gt;</code><div style="color:#ff3d6b;font-size:11px;margin-top:4px;font-family:sans-serif">⚠ Screen reader doesn't know which language to use</div></div>`,aH:`<div style="border:2px solid #4cdf9a;padding:10px;border-radius:6px;background:#fff;font-family:monospace;font-size:12px;color:#333"><code>&lt;html lang="en"&gt;</code><div style="color:#4cdf9a;font-size:11px;margin-top:4px;font-family:sans-serif">✓ English pronunciation engine activated</div></div>`})},
"3.3.2":{x:"Unlabeled form controls are completely opaque to screen reader users — they hear 'edit text, blank' with no idea what to enter. Placeholder text vanishes on focus and isn't reliably announced.",dt:"Every input needs a visible <label> with for/id connection. Place labels above inputs for mobile. For search fields, aria-label is acceptable when the icon/context is clear visually.",e:"Quick fix",p:1,
  gen:(el)=>{const n=el.match(/name="([^"]+)"/)?.[1]||'field';const N=n.charAt(0).toUpperCase()+n.slice(1);return{before:el,after:`<label for="${n}">${N}</label>\n<input type="text" name="${n}" id="${n}"\n  autocomplete="${n}">`,

    aH:`<div style="border:2px solid #4cdf9a;padding:10px;border-radius:6px;background:#fff"><label style="display:block;font-size:13px;font-weight:500;margin-bottom:3px;color:#333">${N}</label><input type="text" id="${n}" autocomplete="${n}" style="padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:13px;width:200px;color:#333"><div style="color:#4cdf9a;font-size:11px;margin-top:4px">✓ "${N}, edit text" — properly announced</div></div>`}}},
"4.1.2":{x:"Focusable content inside aria-hidden creates keyboard traps — users can Tab to invisible elements and lose their position. Invalid ARIA roles confuse assistive technology completely.",dt:"Never put focusable elements (links, buttons, inputs) inside aria-hidden. Either remove aria-hidden or add tabindex=\"-1\" to all interactive children. Validate ARIA roles against the WAI-ARIA spec.",e:"Medium",p:1,

    aH:`<div style="border:2px solid #4cdf9a;padding:10px;border-radius:6px;background:#fff"><div><a href="#" style="color:#2563eb;font-size:13px">Privacy</a> | <button style="font-size:13px;padding:3px 10px;border:1px solid #ccc;border-radius:3px;color:#333">Contact</button></div><div style="color:#4cdf9a;font-size:11px;margin-top:4px">✓ Visible and focusable to all users</div></div>`})},

{id:"1.1.1",n:"Non-text Content",l:"A",p:"Perceivable",c(d){const r=[];d.querySelectorAll("img").forEach((e,i)=>{if(!e.getAttribute("alt")&&e.getAttribute("alt")!=="")r.push({s:S.C,el:e.outerHTML.substring(0,150),msg:`Image #${i+1} missing alt`,fix:`Add alt="description" or alt=""`})});d.querySelectorAll("svg").forEach((e,i)=>{if(!e.getAttribute("role")&&!e.querySelector("title"))r.push({s:S.M,el:"<svg>",msg:`SVG #${i+1} missing accessible name`,fix:`Add role="img" + aria-label or <title>`})});d.querySelectorAll("canvas,video,audio,object,embed").forEach((e,i)=>{if(!e.getAttribute("aria-label")&&!e.getAttribute("aria-labelledby")&&!e.textContent?.trim())r.push({s:S.M,el:`<${e.tagName.toLowerCase()}>`,msg:`${e.tagName} #${i+1} missing alternative`,fix:`Add aria-label`})});return r}},
{id:"1.3.1",n:"Info and Relationships",l:"A",p:"Perceivable",c(d){const r=[];d.querySelectorAll("table").forEach((t,i)=>{if(!t.querySelector("th,[role='columnheader']"))r.push({s:S.M,el:"<table>",msg:`Table #${i+1} no headers`,fix:`Use <th scope="col/row">`});if(!t.querySelector("caption")&&!t.getAttribute("aria-label"))r.push({s:S.m,el:"<table>",msg:`Table #${i+1} no caption`,fix:`Add <caption>`})});d.querySelectorAll("fieldset").forEach((f,i)=>{if(!f.querySelector("legend"))r.push({s:S.M,el:"<fieldset>",msg:`Fieldset #${i+1} no <legend>`,fix:`Add <legend>`})});return r}},
{id:"1.3.5",n:"Identify Input Purpose",l:"AA",p:"Perceivable",c(d){const r=[];d.querySelectorAll("input[type='text'],input[type='email'],input[type='tel'],input:not([type]),input[type='password']").forEach(e=>{if(!e.getAttribute("autocomplete")){const n=e.getAttribute("name")||e.getAttribute("id")||"";if(/name|email|phone|tel|address|zip|password|user/i.test(n))r.push({s:S.m,el:e.outerHTML.substring(0,140),msg:`"${n}" lacks autocomplete`,fix:`Add autocomplete="..."`})}});return r}},
{id:"1.4.3",n:"Contrast (Minimum)",l:"AA",p:"Perceivable",c(d){const r=[];let c=0;d.querySelectorAll("p,span,a,li,td,th,h1,h2,h3,h4,h5,h6,label,button,div").forEach(e=>{if(c>60)return;const st=e.getAttribute("style")||"";const cm=st.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);const bm=st.match(/background(?:-color)?\s*:\s*([^;]+)/i);if(cm&&bm){c++;const fg=pC(cm[1].trim()),bg=pC(bm[1].trim());if(fg&&bg){const ratio=CR(fg,bg);if(ratio<4.5)r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Contrast ${ratio.toFixed(2)}:1 — needs ≥7:1 AAA`,fix:`Increase contrast`});else if(ratio<7)r.push({s:S.m,el:e.outerHTML.substring(0,120),msg:`${ratio.toFixed(2)}:1 — AA pass, AAA fail (≥7:1)`,fix:`Increase to ≥7:1`})}}});return r}},
{id:"1.4.6",n:"Contrast Enhanced (AAA)",l:"AAA",p:"Perceivable",c(){return[{s:S.I,el:"—",msg:`AAA: 7:1 normal, 4.5:1 large (18pt+/14pt bold+)`,fix:`Audit all color pairs`}]}},
{id:"1.4.8",n:"Visual Presentation (AAA)",l:"AAA",p:"Perceivable",c(d){const r=[];d.querySelectorAll("p,div,span,li,td,section,article").forEach(e=>{const st=e.getAttribute("style")||"";if(/text-align\s*:\s*justify/i.test(st))r.push({s:S.M,el:e.outerHTML.substring(0,100),msg:`Justified text — AAA prohibits`,fix:`text-align: left`});const lh=st.match(/line-height\s*:\s*([0-9.]+)/i);if(lh&&parseFloat(lh[1])<1.5&&!lh[0].includes("px"))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`line-height ${lh[1]} < 1.5 AAA min`,fix:`≥ 1.5`})});return r}},
{id:"1.4.10",n:"Reflow",l:"AA",p:"Perceivable",c(d){const r=[];const m=d.querySelector('meta[name="viewport"]');if(m){const c=m.getAttribute("content")||"";if(/maximum-scale\s*=\s*1/i.test(c)||/user-scalable\s*=\s*no/i.test(c))r.push({s:S.C,el:m.outerHTML,msg:`Viewport blocks zoom`,fix:`Remove restrictions`})}return r}},
{id:"1.4.12",n:"Text Spacing",l:"AA",p:"Perceivable",c(d){const r=[];d.querySelectorAll('[style*="overflow"]').forEach(e=>{const st=e.getAttribute("style")||"";if(/overflow\s*:\s*hidden/i.test(st)&&/height\s*:\s*\d+px/i.test(st))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`overflow:hidden + fixed height may clip`,fix:`Use min-height + overflow:auto`})});return r}},
{id:"2.1.1",n:"Keyboard",l:"A",p:"Operable",c(d){const r=[];d.querySelectorAll("[onclick],[onmousedown]").forEach((e,i)=>{if(!e.getAttribute("onkeydown")&&!["A","BUTTON","INPUT","SELECT","TEXTAREA","SUMMARY"].includes(e.tagName))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Element #${i+1} mouse-only`,fix:`Use <button> or add keyboard handlers`})});d.querySelectorAll("div[onclick],span[onclick],div[role='button']").forEach((e,i)=>{if(!e.getAttribute("tabindex"))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Clickable element not focusable`,fix:`tabindex="0" or <button>`})});return r}},
{id:"2.4.1",n:"Bypass Blocks",l:"A",p:"Operable",c(d){const r=[];if(!d.querySelector('a[href^="#main"],a[href^="#content"],[class*="skip"],[id*="skip"]')&&!d.querySelector("main,[role='main']"))r.push({s:S.M,el:"—",msg:`No skip link or <main> landmark`,fix:`Add skip link + <main>`});const lm=d.querySelectorAll("header,[role='banner'],nav,[role='navigation'],main,[role='main'],footer,[role='contentinfo']");if(lm.length===0&&d.querySelectorAll("div").length>5)r.push({s:S.M,el:"—",msg:`No ARIA landmarks`,fix:`Use <header>,<nav>,<main>,<footer>`});return r}},
{id:"2.4.2",n:"Page Titled",l:"A",p:"Operable",c(d){const r=[];const t=d.querySelector("title");if(!t||!t.textContent?.trim())r.push({s:S.M,el:"<head>",msg:`Missing <title>`,fix:`Add descriptive <title>`});return r}},
{id:"2.4.4",n:"Link Purpose (Context)",l:"A",p:"Operable",c(d){const r=[];const vague=["click here","here","read more","more","link","this","learn more"];d.querySelectorAll("a").forEach((a,i)=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();if(vague.includes(t))r.push({s:S.M,el:a.outerHTML.substring(0,120),msg:`"${t}" is ambiguous`,fix:`Descriptive text`});if(!t&&!a.querySelector("img[alt]"))r.push({s:S.C,el:a.outerHTML.substring(0,120),msg:`Link #${i+1} no text`,fix:`Add text or aria-label`})});return r}},
{id:"2.4.6",n:"Headings and Labels",l:"AA",p:"Operable",c(d){const r=[];const hs=d.querySelectorAll("h1,h2,h3,h4,h5,h6");let prev=0,h1c=0;hs.forEach(h=>{const l=+h.tagName[1];if(l===1)h1c++;if(prev>0&&l>prev+1)r.push({s:S.M,el:h.outerHTML.substring(0,100),msg:`Heading skip h${prev}→h${l}`,fix:`Sequential levels`});if(!h.textContent?.trim())r.push({s:S.M,el:h.outerHTML.substring(0,100),msg:`Empty h${l}`,fix:`Add text or remove`});prev=l});if(h1c===0&&hs.length>0)r.push({s:S.M,el:"—",msg:`No <h1>`,fix:`Add <h1>`});if(h1c>1)r.push({s:S.m,el:"—",msg:`Multiple <h1> (${h1c})`,fix:`Single <h1>`});return r}},
{id:"2.4.7",n:"Focus Visible",l:"AA",p:"Operable",c(d){const r=[];let has=false;d.querySelectorAll("style").forEach(s=>{if(/outline\s*:\s*(none|0)/i.test(s.textContent||""))has=true});d.querySelectorAll("[style]").forEach(e=>{if(/outline\s*:\s*(none|0)/i.test(e.getAttribute("style")||""))has=true});if(has)r.push({s:S.M,el:"—",msg:`outline:none removes focus visibility`,fix:`:focus-visible with custom styles`});return r}},
{id:"2.4.9",n:"Link Purpose (AAA)",l:"AAA",p:"Operable",c(d){const r=[];const map={};d.querySelectorAll("a[href]").forEach(a=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();const h=a.getAttribute("href");if(t&&h){if(map[t]&&map[t]!==h)r.push({s:S.m,el:a.outerHTML.substring(0,120),msg:`"${t}" → different URLs`,fix:`Same text = same destination`});map[t]=h}});return r}},
{id:"2.4.11",n:"Focus Not Obscured (Min)",l:"AA",p:"Operable",c(d){const r=[];d.querySelectorAll('[style*="position"]').forEach(e=>{const st=e.getAttribute("style")||"";if(/position\s*:\s*(fixed|sticky)/i.test(st)&&/z-index/i.test(st))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Fixed/sticky may obscure focus`,fix:`scroll-padding-top + scroll-margin`})});return r}},
{id:"2.4.12",n:"Focus Not Obscured (Enhanced AAA)",l:"AAA",p:"Operable",c(d){const r=[];const fixed=d.querySelectorAll('[style*="position: fixed"],[style*="position:fixed"]');const sticky=d.querySelectorAll('[style*="position: sticky"],[style*="position:sticky"]');if(fixed.length+sticky.length>0)r.push({s:S.m,el:`${fixed.length} fixed + ${sticky.length} sticky elements`,msg:`AAA: focused element must be FULLY visible (not partially hidden)`,fix:`Add scroll-padding matching fixed element heights`});return r}},
{id:"2.5.3",n:"Label in Name",l:"A",p:"Operable",c(d){const r=[];d.querySelectorAll("button[aria-label],a[aria-label]").forEach(e=>{const al=(e.getAttribute("aria-label")||"").toLowerCase();const vt=(e.textContent||"").trim().toLowerCase();if(vt&&al&&!al.includes(vt))r.push({s:S.M,el:e.outerHTML.substring(0,120),msg:`aria-label doesn't contain visible text`,fix:`Include visible text`})});return r}},
{id:"2.5.5",n:"Target Size (AAA 44×44px)",l:"AAA",p:"Operable",c(d){const r=[];d.querySelectorAll("a,button,[role='button'],input[type='checkbox'],input[type='radio'],.btn").forEach((e,i)=>{const st=e.getAttribute("style")||"";const wm=st.match(/width\s*:\s*(\d+)px/i);const hm=st.match(/height\s*:\s*(\d+)px/i);const pm=st.match(/padding\s*:\s*(\d+)/i);const w=wm?+wm[1]:null;const h=hm?+hm[1]:null;const pad=pm?+pm[1]:0;if(w!==null&&h!==null){const effW=w+pad*2;const effH=h+pad*2;if(effW<44||effH<44)r.push({s:S.M,el:e.outerHTML.substring(0,120),msg:`Target ~${effW}×${effH}px — AAA requires ≥44×44px`,fix:`Use padding trick: padding:${Math.ceil((44-w)/2)}px; margin:-${Math.ceil((44-w)/2)}px; box-sizing:content-box`})}});return r}},
{id:"2.5.8",n:"Target Size (Minimum 24×24)",l:"AA",p:"Operable",c(d){const r=[];d.querySelectorAll("a,button,[role='button']").forEach(e=>{const st=e.getAttribute("style")||"";const wm=st.match(/width\s*:\s*(\d+)px/i);const hm=st.match(/height\s*:\s*(\d+)px/i);if(wm&&hm&&(+wm[1]<24||+hm[1]<24))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Target < 24×24px AA minimum`,fix:`Min 24×24px`})});return r}},
{id:"3.1.1",n:"Language of Page",l:"A",p:"Understandable",c(d){const r=[];const h=d.querySelector("html");if(h&&!h.getAttribute("lang"))r.push({s:S.C,el:"<html>",msg:`Missing lang attribute`,fix:`Add lang="en"`});return r}},
{id:"3.2.2",n:"On Input",l:"A",p:"Understandable",c(d){const r=[];d.querySelectorAll("select[onchange]").forEach((e,i)=>{if(/location|navigate|href|window\.open/i.test(e.getAttribute("onchange")||""))r.push({s:S.M,el:e.outerHTML.substring(0,120),msg:`Auto-navigates on change`,fix:`Use submit button`})});return r}},
{id:"3.2.6",n:"Consistent Help (AAA)",l:"AAA",p:"Understandable",c(d){const r=[];const help=d.querySelectorAll('a[href*="help"],a[href*="support"],a[href*="contact"],a[href*="faq"],[class*="help"],[id*="help"]');const footer=d.querySelector("footer,[role='contentinfo']");const helpInFooter=footer&&(footer.querySelector('a[href*="contact"]')||footer.querySelector('a[href*="help"]')||footer.querySelector('a[href*="support"]'));

{id:"3.3.2",n:"Labels or Instructions",l:"A",p:"Understandable",c(d){const r=[];d.querySelectorAll("input:not([type='hidden']):not([type='submit']):not([type='button']):not([type='reset']):not([type='image']),select,textarea").forEach((e,i)=>{const id=e.getAttribute("id");const has=id&&d.querySelector(`label[for="${id}"]`);if(!has&&!e.closest("label")&&!e.getAttribute("aria-label")&&!e.getAttribute("aria-labelledby")&&!e.getAttribute("title"))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Form control #${i+1} unlabeled`,fix:`<label for="id"> or aria-label`})});return r}},
{id:"3.3.7",n:"Redundant Entry",l:"A",p:"Understandable",c(d){const r=[];const names={};d.querySelectorAll("input[name],select[name]").forEach(e=>{const n=e.getAttribute("name");if(names[n])r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Duplicate name "${n}"`,fix:`Auto-populate or autocomplete`});names[n]=true});return r}},
{id:"3.3.9",n:"Accessible Authentication (AAA)",l:"AAA",p:"Understandable",c(d){const r=[];const pwInputs=d.querySelectorAll("input[type='password']");const captchas=d.querySelectorAll('[class*="captcha"],[id*="captcha"],[class*="recaptcha"]');
  pwInputs.forEach(e=>{if(e.getAttribute("autocomplete")==="off"||e.getAttribute("onpaste"))r.push({s:S.M,el:e.outerHTML.substring(0,120),msg:`Password field blocks paste or autocomplete — cognitive barrier`,fix:`autocomplete="current-password", allow paste, offer passkey/OAuth`})});

{id:"4.1.1",n:"Parsing / Duplicate IDs",l:"A",p:"Robust",c(d){const r=[];const ids={};d.querySelectorAll("[id]").forEach(e=>{const id=e.getAttribute("id");if(ids[id])r.push({s:S.M,el:e.outerHTML.substring(0,100),msg:`Duplicate id="${id}"`,fix:`Unique IDs`});ids[id]=true});return r}},
{id:"4.1.2",n:"Name, Role, Value",l:"A",p:"Robust",c(d){const r=[];const valid=new Set(["alert","alertdialog","application","article","banner","button","cell","checkbox","columnheader","combobox","complementary","contentinfo","definition","dialog","directory","document","feed","figure","form","grid","gridcell","group","heading","img","link","list","listbox","listitem","log","main","marquee","math","menu","menubar","menuitem","menuitemcheckbox","menuitemradio","navigation","none","note","option","presentation","progressbar","radio","radiogroup","region","row","rowgroup","rowheader","scrollbar","search","searchbox","separator","slider","spinbutton","status","switch","tab","table","tablist","tabpanel","term","textbox","timer","toolbar","tooltip","tree","treegrid","treeitem"]);d.querySelectorAll("[role]").forEach(e=>{const role=e.getAttribute("role");if(!valid.has(role))r.push({s:S.M,el:e.outerHTML.substring(0,100),msg:`Invalid role="${role}"`,fix:`Valid WAI-ARIA role`})});d.querySelectorAll("[aria-hidden='true']").forEach(e=>{if(e.querySelector("a[href],button,input,select,textarea,[tabindex]:not([tabindex='-1'])"))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Focusable inside aria-hidden`,fix:`Remove aria-hidden or defocus children`})});return r}},

function analyze(h){const p=new DOMParser();const d=p.parseFromString(h,"text/html");return RULES.map(r=>{const issues=r.c(d);return{...r,issues,ok:issues.filter(i=>i.s!==S.I).length===0}})}
function autoFix(h){let f=h;if(/<html(?![^>]*\slang\s*=)/i.test(f))f=f.replace(/<html/i,'<html lang="en"');f=f.replace(/user-scalable\s*=\s*no/gi,"user-scalable=yes");f=f.replace(/maximum-scale\s*=\s*1(?:\.0)?/gi,"maximum-scale=5.0");f=f.replace(/text-align\s*:\s*justify/gi,"text-align: left");return f}

function ScoreRing({score,size=90}){
  const r=(size-10)/2;const circ=2*Math.PI*r;const offset=circ*(1-score/100);
  const color=score>=80?"var(--em)":score>=50?"var(--or)":"var(--rd)";
  return<div className="score-ring" style={{width:size,height:size}}>
    <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg3)" strokeWidth="5"/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="5" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{transition:"stroke-dashoffset .6s ease-out"}}/></svg>
    <div style={{position:"absolute",fontSize:size*.3,fontFamily:"var(--f3)",fontWeight:700,color}}>{score}</div>
  </div>;
}

function ContrastChecker(){const[fg,setFg]=useState("#555");const[bg,setBg]=useState("#fff");const fr=pC(fg),br=pC(bg);const r=fr&&br?CR(fr,br):null;const t=r?[["AA",r>=4.5,"≥4.5"],["AA Lg",r>=3,"≥3"],["AAA",r>=7,"≥7"],["AAA Lg",r>=4.5,"≥4.5"]]:[];return<div style={{background:"var(--bg2)",borderRadius:12,border:"1px solid var(--bdr)",padding:20}}><h3 style={{margin:"0 0 14px",fontFamily:"var(--f1)",fontSize:18}}>Contrast Checker</h3><div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:16}}>{[["Foreground",fg,setFg],["Background",bg,setBg]].map(([l,v,s])=><label key={l} style={{display:"flex",flexDirection:"column",gap:4,flex:1,minWidth:130}}><span style={{fontSize:9.5,color:"var(--tx3)",textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</span><div style={{display:"flex",gap:6,alignItems:"center"}}><input type="color" value={v} onChange={e=>s(e.target.value)} style={{width:36,height:32,border:"none",cursor:"pointer",borderRadius:5}}/><input type="text" value={v} onChange={e=>s(e.target.value)} style={{flex:1,padding:"7px 10px",background:"var(--bg3)",border:"1px solid var(--bdr)",borderRadius:6,color:"var(--tx)",fontFamily:"var(--f3)",fontSize:12}}/></div></label>)}</div><div style={{background:br?bg:"#fff",color:fr?fg:"#000",padding:"18px 22px",borderRadius:8,marginBottom:14,border:"1px solid var(--bdr2)"}}><div style={{fontSize:18,marginBottom:4,fontWeight:500}}>The quick brown fox jumps over the lazy dog</div><div style={{fontSize:13}}>Small text — 13px regular</div></div>{r!==null&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(90px,1fr))",gap:6}}><div style={{textAlign:"center",padding:10,background:"var(--bg)",borderRadius:6}}><div style={{fontSize:26,fontFamily:"var(--f3)",fontWeight:700,color:r>=7?"var(--em)":r>=4.5?"var(--or)":"var(--rd)"}}>{r.toFixed(2)}</div><div style={{fontSize:8.5,color:"var(--tx3)",marginTop:2,textTransform:"uppercase"}}>Ratio</div></div>{t.map(([l,pass,req])=><div key={l} style={{textAlign:"center",padding:10,background:pass?"rgba(0,245,208,.04)":"rgba(255,61,107,.04)",borderRadius:6,border:`1px solid ${pass?"rgba(0,245,208,.12)":"rgba(255,61,107,.12)"}`}}><div style={{fontSize:14,fontWeight:700,color:pass?"var(--em)":"var(--rd)"}}>{pass?"PASS":"FAIL"}</div><div style={{fontSize:8.5,color:"var(--tx3)",marginTop:2}}>{l} {req}</div></div>)}</div>}</div>}

        {[["url","🔗 Scan URL"],["html","</> Paste HTML"]].map(([m,l])=><button key={m} onClick={()=>{setMode(m);setResults(null);setFSt(null)}} style={{padding:"8px 18px",fontSize:12,fontWeight:mode===m?700:500,cursor:"pointer",border:"1px solid var(--bdr)",borderBottom:mode===m?"2px solid var(--em)":"1px solid var(--bdr)",background:mode===m?"var(--bg2)":"transparent",color:mode===m?"var(--em)":"var(--tx3)",borderRadius:m==="url"?"7px 0 0 0":"0 7px 0 0"}}>{l}</button>)}
      </div>
      {mode==="url"&&<div><div style={{display:"flex",gap:8,marginBottom:6}}><input type="url" value={url} onChange={e=>{setUrl(e.target.value);setFSt(null)}} onKeyDown={e=>{if(e.key==="Enter")scanUrl()}} placeholder="https://example.com" style={{flex:1,padding:"10px 14px",background:"var(--bg3)",border:"1px solid var(--bdr)",borderRadius:8,color:"var(--tx)",fontFamily:"var(--f3)",fontSize:12.5}}/><button className="prim" onClick={scanUrl} disabled={!url.trim()||fSt==="loading"}>{fSt==="loading"?<><span className="spinner" style={{width:13,height:13,marginRight:5}}/>Scanning…</>:"◉ Scan"}</button></div>{fSt==="error"&&<div style={{padding:"8px 12px",background:"rgba(255,61,107,.05)",borderRadius:7}}><p style={{fontSize:12,color:"var(--rd)",lineHeight:1.6,margin:"0 0 6px"}}>{fErr}</p><button className="ghost" onClick={scanUrl} style={{fontSize:11}}>↻ Retry Scan</button></div>}{fSt==="done"&&<p style={{fontSize:11.5,color:"var(--em)",padding:"4px 0"}}>✓ Fetched {scUrl} via {fErr} — {html.length.toLocaleString()} chars</p>}</div>}
      {mode==="html"&&<div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,flexWrap:"wrap",gap:5}}><span style={{fontSize:9.5,textTransform:"uppercase",letterSpacing:".07em",color:"var(--tx3)",fontWeight:700}}>HTML Source</span><div style={{display:"flex",gap:6}}><button className="ghost" onClick={()=>{setHtml(SAMPLE);setResults(null)}}>Load Sample</button><button className="prim" onClick={()=>doAudit(html,"")} disabled={!html.trim()}>▶ Audit</button></div></div><textarea value={html} onChange={e=>{setHtml(e.target.value);setResults(null)}} placeholder="Paste HTML…" style={{width:"100%",minHeight:110,maxHeight:230,padding:"12px 14px",background:"var(--bg3)",border:"1px solid var(--bdr)",borderRadius:8,color:"var(--tx)",fontFamily:"var(--f3)",fontSize:11,lineHeight:1.6,resize:"vertical",boxSizing:"border-box"}}/></div>}
    </section>

    {results&&<><nav style={{display:"flex",borderBottom:"1px solid var(--bdr)",padding:"0 16px",overflowX:"auto"}}>{TABS.map(t=><button key={t.k} className={`tab-b${tab===t.k?" on":""}`} onClick={()=>setTab(t.k)}><span style={{fontSize:12}}>{t.i}</span>{t.l}</button>)}</nav>
    <div style={{padding:"18px 24px",minHeight:250}}>

    {tab==="audit"&&<><div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}><Stat label="Rules" value={stats.total} color="var(--tx)"/><Stat label="Passed" value={stats.passed} color="var(--em)"/><Stat label="Issues" value={stats.issues} color="var(--rd)"/><Stat label="Critical" value={stats.crit} color="var(--rd)"/><Stat label="Major" value={stats.maj} color="var(--or)"/><Stat label="Minor" value={stats.min} color="var(--bl)"/></div>
    <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>{[["Level",fL,setFL,["ALL","A","AA","AAA"]],["Status",fS,setFS,["ALL","ISSUES","PASSED"]],["Principle",fP,setFP,["ALL","Perceivable","Operable","Understandable","Robust"]]].map(([l,v,s,o])=><div key={l} style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:9,color:"var(--tx3)",textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</span><select className="sel" value={v} onChange={e=>s(e.target.value)}>{o.map(x=><option key={x}>{x}</option>)}</select></div>)}</div>
    <div style={{display:"flex",flexDirection:"column",gap:3}}>{filtered.map(rule=>{const isO=exp===rule.id;const ic=rule.issues.filter(i=>i.s!==S.I).length;return<div key={rule.id} style={{background:"var(--bg2)",border:"1px solid var(--bdr)",borderRadius:8,overflow:"hidden"}}><button className="row-b" onClick={()=>setExp(isO?null:rule.id)}><span style={{width:7,height:7,borderRadius:"50%",background:rule.ok?"var(--em)":"var(--rd)",flexShrink:0}}/><span style={{fontFamily:"var(--f3)",fontSize:10.5,color:"var(--em)",fontWeight:600,minWidth:38}}>{rule.id}</span><span style={{fontWeight:500,flex:1}}>{rule.n}</span><Pill color={rule.l==="AAA"?"var(--pu)":rule.l==="AA"?"var(--bl)":"var(--em)"} bg={rule.l==="AAA"?"rgba(179,136,255,.07)":rule.l==="AA"?"rgba(66,165,245,.07)":"var(--em2)"}>{rule.l}</Pill><Pill color="var(--tx3)" bg="rgba(120,150,200,.04)">{rule.p.substring(0,4)}</Pill>{ic>0&&<span style={{fontFamily:"var(--f3)",fontSize:10,color:"var(--rd)",fontWeight:600}}>{ic}</span>}<span style={{fontSize:9,color:"var(--tx3)",transform:isO?"rotate(90deg)":"none",transition:"transform .15s"}}>▶</span></button>
    {isO&&<div className="fade-in" style={{borderTop:"1px solid var(--bdr)",padding:"12px 14px"}}>{rule.issues.length===0?<p style={{fontSize:12,color:"var(--em)",margin:0}}>✓ No issues.</p>:<div style={{display:"flex",flexDirection:"column",gap:12}}>{rule.issues.map((issue,idx)=>{const isI=issue.s===S.I;const rec=!isI?getRec(rule.id,issue):null;return<div key={idx} style={{background:SB[issue.s],borderRadius:7,padding:"12px 14px",borderLeft:`3px solid ${SC[issue.s]}`}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,flexWrap:"wrap"}}><Pill color={SC[issue.s]} bg="transparent">{issue.s}</Pill>{rec&&<PBadge p={rec.p}/>}{rec&&<span style={{fontSize:8.5,padding:"3px 7px",borderRadius:4,background:"rgba(76,223,154,.07)",color:"var(--gn)",fontWeight:600}}>{rec.e}</span>}</div>
      <p style={{fontSize:12,margin:"0 0 4px",lineHeight:1.6}}>{issue.msg}</p>
      {issue.el&&issue.el!=="—"&&<code style={{display:"block",fontSize:10,color:"var(--tx2)",background:"rgba(0,0,0,.25)",padding:"6px 10px",borderRadius:5,marginBottom:4,wordBreak:"break-all",fontFamily:"var(--f3)",lineHeight:1.5}}>{issue.el}</code>}
      <div style={{fontSize:11,color:"var(--em)",display:"flex",alignItems:"flex-start",gap:4}}><span>⮕</span><span style={{lineHeight:1.55}}>{issue.fix}</span></div>
      {rec&&<RecCard rec={rec}/>}
    </div>})}</div>}</div>}</div>})}</div></>}

    {tab==="priority"&&<div><h3 style={{margin:"0 0 14px",fontFamily:"var(--f1)",fontSize:18}}>Implementation Priority Roadmap</h3>{allIssues.length===0?<p style={{color:"var(--em)"}}>✓ All checks passed!</p>:
    <div style={{display:"flex",flexDirection:"column",gap:10}}>{[1,2,3,4].map(p=>{const items=allIssues.filter(i=>i.rec.p===p);if(!items.length)return null;return<div key={p} style={{background:"var(--bg2)",borderRadius:9,border:"1px solid var(--bdr)",overflow:"hidden"}}><div style={{padding:"10px 16px",borderBottom:"1px solid var(--bdr)",display:"flex",alignItems:"center",justifyContent:"space-between"}}><div style={{display:"flex",alignItems:"center",gap:7}}><span style={{width:7,height:7,borderRadius:"50%",background:PCOLOR[p]}}/><span style={{fontSize:12.5,fontWeight:600,color:PCOLOR[p]}}>{PLABEL[p]}</span></div><span style={{fontSize:10.5,color:"var(--tx3)"}}>{items.length} issue{items.length>1?"s":""}</span></div><div style={{padding:"8px 16px"}}>{items.map((i,j)=><div key={j} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"7px 0",borderBottom:j<items.length-1?"1px solid var(--bdr)":"none"}}><span style={{fontFamily:"var(--f3)",fontSize:10,color:"var(--em)",fontWeight:600,minWidth:34,paddingTop:2}}>{i.ruleId}</span><div style={{flex:1}}><p style={{fontSize:12,margin:"0 0 3px",lineHeight:1.5}}>{i.msg}</p><div style={{display:"flex",gap:5}}><Pill color={SC[i.s]} bg={SB[i.s]}>{i.s}</Pill><span style={{fontSize:8.5,color:"var(--gn)",fontWeight:600,padding:"3px 7px",borderRadius:4,background:"rgba(76,223,154,.07)"}}>{i.rec.e}</span></div></div></div>)}</div></div>})}</div>}</div>}

    {tab==="score"&&<div><h3 style={{margin:"0 0 16px",fontFamily:"var(--f1)",fontSize:18}}>WCAG 2.2 AAA Compliance Scorecard</h3>
      <div style={{display:"flex",justifyContent:"center",marginBottom:20}}><ScoreRing score={stats.score} size={100}/></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:10}}>
        {["Perceivable","Operable","Understandable","Robust"].map(p=>{const d=princScore[p]||{};const c=d.score>=80?"var(--em)":d.score>=50?"var(--or)":"var(--rd)";return<div key={p} style={{background:"var(--bg2)",borderRadius:10,border:"1px solid var(--bdr)",padding:"16px 18px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}><h4 style={{margin:0,fontSize:14,fontWeight:600}}>{p}</h4><span style={{fontFamily:"var(--f3)",fontSize:18,fontWeight:700,color:c}}>{d.score}%</span></div>
          <div style={{height:6,background:"var(--bg4)",borderRadius:3,overflow:"hidden",marginBottom:8}}><div style={{height:"100%",background:c,borderRadius:3,width:`${d.score}%`,transition:"width .4s ease-out"}}/></div>
          <div style={{fontSize:11.5,color:"var(--tx2)"}}>{d.passed}/{d.total} criteria passed</div>
        </div>})}
      </div>
      <div style={{marginTop:16,background:"var(--bg2)",borderRadius:10,border:"1px solid var(--bdr)",padding:"16px 18px"}}>
        <h4 style={{margin:"0 0 10px",fontSize:14}}>Level Breakdown</h4>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          {["A","AA","AAA"].map(lv=>{const rules=results.filter(r=>r.l===lv);const passed=rules.filter(r=>r.ok).length;const pct=rules.length>0?Math.round(passed/rules.length*100):100;const c=pct>=80?"var(--em)":pct>=50?"var(--or)":"var(--rd)";return<div key={lv} style={{flex:1,minWidth:120,textAlign:"center",padding:"12px",background:"var(--bg3)",borderRadius:8}}>
            <div style={{fontFamily:"var(--f3)",fontSize:22,fontWeight:700,color:c}}>{pct}%</div>
            <div style={{fontSize:10,color:"var(--tx3)",marginTop:2}}>Level {lv} ({passed}/{rules.length})</div>
          </div>})}
        </div>
      </div>
    </div>}

    {tab==="preview"&&<div><h3 style={{margin:"0 0 12px",fontFamily:"var(--f1)",fontSize:18}}>Side-by-Side Preview</h3><div style={{display:"flex",gap:12,flexWrap:"wrap"}}><LivePreview html={html} label="Original" color="var(--rd)"/><LivePreview html={rem} label="Remediated" color="var(--em)"/></div></div>}
    {tab==="contrast"&&<ContrastChecker/>}
    {tab==="outline"&&<HeadingOutline html={html}/>}
    </div></>}

    {!results&&fSt!=="loading"&&<div style={{padding:"60px 24px",textAlign:"center"}}><div style={{fontSize:46,marginBottom:10,opacity:.08,fontFamily:"var(--f3)"}}>⬡</div><p style={{fontSize:16,color:"var(--tx2)",margin:"0 0 4px",fontFamily:"var(--f1)"}}>Enter a URL or paste HTML to begin</p><p style={{fontSize:12,color:"var(--tx3)"}}>{RULES.length} WCAG 2.2 criteria · A/AA/AAA · Hybrid rules engine · Actionable code fixes</p></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
