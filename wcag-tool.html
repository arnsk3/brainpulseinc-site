// ── Color / Contrast Utils ──

function pC(s){if(!s)return null;s=s.trim().toLowerCase();if(NC[s])return NC[s];let m=s.match(/^#([0-9a-f]{3,8})$/);if(m){let h=m[1];if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}m=s.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);if(m)return[+m[1],+m[2],+m[3]];return null}
function rL([r,g,b]){const f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function CR(a,b){const l1=rL(a),l2=rL(b);return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)}

function fTO(u,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))}
async function fetchURL(url){
  if(!/^https?:\/\//i.test(url))url='https://'+url;const e=encodeURIComponent(url);
  const S=[{n:'codetabs',u:`https://api.codetabs.com/v1/proxy?quest=${e}`,m:'t'},{n:'allorigins',u:`https://api.allorigins.win/raw?url=${e}`,m:'t'},{n:'allorigins-json',u:`https://api.allorigins.win/get?url=${e}`,m:'j'},{n:'corsproxy',u:`https://corsproxy.io/?${e}`,m:'t'},{n:'direct',u:url,m:'t'}];
  const tried=[];

  return{ok:false,html:'',url,error:`Tried ${tried.length} proxies: ${tried.join(', ')}. Click Retry or use the HTML tab (View Source → Ctrl+A → Ctrl+C).`}
}

// ── Severity / Priority Constants ──
const SV={C:"critical",M:"major",m:"minor",I:"info"};
const SCLR={critical:"#ff3d6b",major:"#ffb020",minor:"#3d9eff",info:"#505e75"};

// ── Recommendation Database ──
const RDB={
"1.1.1":{x:"Screen readers can't interpret images without alt text — 8.7% of US adults have vision disabilities. This affects blind users, low-bandwidth scenarios, and SEO.",dt:"Describe the image's PURPOSE, not appearance. 'Submit order' not 'green button'. Use alt=\"\" for decorative images.",e:"Quick",p:1,
  gen:(el)=>{const src=el.match(/src="([^"]+)"/)?.[1]||"img.jpg";const nm=src.split('/').pop().replace(/\.\w+$/,'').replace(/[-_]/g,' ');return{before:`<img src="${src}">`,after:`<img src="${src}"\n  alt="${nm||'Description'}" />`,bH:`<div style="border:2px dashed #ff3d6b;padding:10px;border-radius:8px"><div style="width:100px;height:60px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#aaa;font-size:11px">🖼</div><div style="color:#ff3d6b;font-size:11px;margin-top:6px">⚠ No alt — invisible to screen readers</div></div>`,aH:`<div style="border:2px solid #4cdf9a;padding:10px;border-radius:8px"><div style="width:100px;height:60px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#aaa;font-size:11px">🖼</div><div style="color:#4cdf9a;font-size:11px;margin-top:6px">✓ alt="${nm}" — properly announced</div></div>`}}},
"1.3.1":{x:"Tables without headers read as flat data lists. Users can't tell which column a value belongs to. Fieldsets without legends leave form groups unlabeled.",dt:"Use <th scope='col'> for column headers. Add <caption> for table purpose. Wrap related inputs in <fieldset> with <legend>.",e:"Medium",p:2,gen:()=>({before:`<table>\n  <tr><td>Name</td><td>Price</td></tr>\n</table>`,after:`<table>\n  <caption>Products</caption>\n  <thead><tr>\n    <th scope="col">Name</th>\n    <th scope="col">Price</th>\n  </tr></thead>\n</table>`,bH:`<table style="border-collapse:collapse;width:100%"><tr><td style="border:1px solid #ddd;padding:5px;color:#ff3d6b;font-size:12px">Name</td><td style="border:1px solid #ddd;padding:5px;color:#ff3d6b;font-size:12px">Price</td></tr></table><div style="color:#ff3d6b;font-size:10px;margin-top:3px">⚠ No headers</div>`,aH:`<table style="border-collapse:collapse;width:100%"><caption style="text-align:left;font-weight:600;font-size:12px;margin-bottom:2px">Products</caption><tr><th style="border:1px solid #4cdf9a;padding:5px;background:#f0fdf4;text-align:left;font-size:12px">Name</th><th style="border:1px solid #4cdf9a;padding:5px;background:#f0fdf4;text-align:left;font-size:12px">Price</th></tr></table><div style="color:#4cdf9a;font-size:10px;margin-top:3px">✓ Semantic headers</div>`})},
"1.4.3":{x:"Low contrast affects 12M+ Americans with vision impairments, 8% of men with color blindness, and everyone over 40. It also fails outdoors.",dt:"AAA requires ≥7:1. Use #111 on white (18.6:1). Never #999 on white (2.85:1). Offer high-contrast toggle.",e:"Quick",p:1,gen:()=>({before:`color: #999;\nbackground: #fff;`,after:`color: #1a1a1a;\nbackground: #fff;`,bH:`<p style="color:#999;background:#fff;padding:8px;border:2px dashed #ff3d6b;border-radius:6px;font-size:13px">2.85:1 contrast</p>`,aH:`<p style="color:#1a1a1a;background:#fff;padding:8px;border:2px solid #4cdf9a;border-radius:6px;font-size:13px">16.6:1 contrast ✓</p>`})},
"1.4.8":{x:"Justified text creates 'rivers of white space' disrupting reading for 15-20% of people with dyslexia. Tight line-height reduces readability for everyone.",dt:"text-align:left, line-height≥1.5, max-width~80ch, letter-spacing≥0.12em.",e:"Quick",p:2,gen:()=>({before:`text-align: justify;\nline-height: 1.1;`,after:`text-align: left;\nline-height: 1.6;\nmax-width: 80ch;`,bH:`<p style="text-align:justify;line-height:1.1;max-width:220px;border:2px dashed #ff3d6b;padding:8px;border-radius:6px;font-size:12px;color:#333;background:#fff">Justified text creates rivers of white space making reading very difficult.</p>`,aH:`<p style="text-align:left;line-height:1.6;max-width:220px;border:2px solid #4cdf9a;padding:8px;border-radius:6px;font-size:12px;color:#333;background:#fff">Left-aligned text with generous spacing is much easier to read and track.</p>`})},
"1.4.10":{x:"Blocking zoom locks out users who need 400%+ magnification. One of the most impactful mobile accessibility barriers.",dt:"Remove maximum-scale and user-scalable=no. Use responsive units (rem, %, vw).",e:"Quick",p:1,gen:()=>({before:`maximum-scale=1,\nuser-scalable=no`,after:`width=device-width,\ninitial-scale=1`,bH:`<code style="display:block;font-size:11px;border:2px dashed #ff3d6b;padding:8px;border-radius:6px;background:#fff;color:#333">user-scalable=<b style="color:#ff3d6b">no</b></code>`,aH:`<code style="display:block;font-size:11px;border:2px solid #4cdf9a;padding:8px;border-radius:6px;background:#fff;color:#333">initial-scale=1 <b style="color:#4cdf9a">✓ zoom enabled</b></code>`})},
"2.1.1":{x:"Motor-impaired and screen reader users navigate via keyboard. Click-only elements are invisible walls they cannot reach or activate.",dt:"Replace <div onclick> with <button>. Native elements have focus, activation, and ARIA built-in.",e:"Medium",p:1,gen:(el)=>{const t=el.match(/>([^<]+)</)?.[1]||'Action';return{before:`<div onclick="fn()">${t}</div>`,after:`<button onclick="fn()">\n  ${t}\n</button>`,bH:`<div style="border:2px dashed #ff3d6b;padding:8px;border-radius:6px;background:#fff"><div style="padding:6px 14px;background:#eee;border-radius:4px;display:inline-block;font-size:12px;color:#333">${t}</div><div style="color:#ff3d6b;font-size:10px;margin-top:4px">⚠ div — Tab skips this</div></div>`,aH:`<div style="border:2px solid #4cdf9a;padding:8px;border-radius:6px;background:#fff"><button style="padding:6px 14px;background:#eee;border:1px solid #ccc;border-radius:4px;font-size:12px;color:#333">${t}</button><div style="color:#4cdf9a;font-size:10px;margin-top:4px">✓ button — keyboard accessible</div></div>`}}},
"2.4.1":{x:"Without skip links, keyboard users Tab through 30+ nav links on every page to reach content. Skip links and landmarks solve this instantly.",dt:"First focusable element = skip link. Use <header>, <nav aria-label>, <main id='main'>, <footer> landmarks.",e:"Quick",p:1,gen:()=>({before:`<body>\n  <nav>...links...</nav>\n  <div>content</div>\n</body>`,after:`<body>\n  <a href="#main" class="skip">Skip to content</a>\n  <header><nav aria-label="Main">...</nav></header>\n  <main id="main">...</main>\n  <footer>...</footer>\n</body>`,bH:`<div style="border:2px dashed #ff3d6b;padding:8px;border-radius:6px;background:#fff"><div style="background:#f3f4f6;padding:4px 8px;border-radius:3px;font-size:10px;color:#888;margin-bottom:4px">🔗→🔗→🔗→...→🔗 (30 tabs)</div><div style="font-size:12px;color:#333">Content buried</div><div style="color:#ff3d6b;font-size:10px;margin-top:3px">⚠ No skip link</div></div>`,aH:`<div style="border:2px solid #4cdf9a;padding:8px;border-radius:6px;background:#fff"><a href="#" style="display:inline-block;padding:4px 10px;background:#00f5d0;color:#000;border-radius:3px;font-size:10px;font-weight:700;text-decoration:none;margin-bottom:4px">Skip to content</a><div style="border:1px solid #4cdf9a;padding:4px;border-radius:3px;font-size:12px;color:#333;margin-top:2px">&lt;main&gt; — 1 keypress away ✓</div></div>`})},
"2.4.6":{x:"Heading hierarchy is the navigation skeleton. Skipping h1→h3 breaks the document outline — screen readers can't build a usable TOC.",dt:"Sequential levels only: h1→h2→h3. Never use headings for visual sizing. Use CSS font-size instead.",e:"Medium",p:2,gen:()=>({before:`<h1>Welcome</h1>\n<h3>Guide</h3>`,after:`<h1>Welcome</h1>\n<h2>Guide</h2>`,bH:`<div style="border:2px dashed #ff3d6b;padding:8px;border-radius:6px;background:#fff"><div style="font-size:18px;font-weight:700;color:#333">h1: Welcome</div><div style="font-size:14px;font-weight:600;color:#ff3d6b">h3: Guide ⚠ skipped h2</div></div>`,aH:`<div style="border:2px solid #4cdf9a;padding:8px;border-radius:6px;background:#fff"><div style="font-size:18px;font-weight:700;color:#333">h1: Welcome</div><div style="font-size:16px;font-weight:600;color:#333">h2: Guide ✓</div></div>`})},
"2.5.5":{x:"Touch targets <44×44px cause mis-taps for motor impairments, tremors, large fingers. Most common AAA failure across the industry.",dt:"Don't resize the icon — expand the CLICKABLE AREA with CSS padding + negative margin. Preserves design, meets 44×44px.",e:"Quick",p:1,gen:()=>({before:`.close-btn {\n  width: 20px;\n  height: 20px;\n}`,after:`.close-btn {\n  width: 20px;\n  height: 20px;\n  /* Expand clickable area */\n  padding: 12px;\n  margin: -12px;\n  box-sizing: content-box;\n}`,bH:`<div style="border:2px dashed #ff3d6b;padding:16px;border-radius:6px;background:#fff;text-align:center"><div style="position:relative;display:inline-block"><button style="width:20px;height:20px;font-size:13px;border:1px solid #ccc;border-radius:3px;background:#f5f5f5;padding:0;line-height:20px">×</button><div style="position:absolute;top:-12px;left:-12px;width:44px;height:44px;border:1px dashed #ff3d6b;border-radius:3px;pointer-events:none"></div></div><div style="color:#ff3d6b;font-size:10px;margin-top:8px">⚠ 20×20px &lt; 44×44px</div></div>`,aH:`<div style="border:2px solid #4cdf9a;padding:16px;border-radius:6px;background:#fff;text-align:center"><button style="width:20px;height:20px;font-size:13px;border:1px solid #ccc;border-radius:3px;background:#f5f5f5;padding:12px;margin:-12px;box-sizing:content-box;line-height:20px">×</button><div style="color:#4cdf9a;font-size:10px;margin-top:8px">✓ Visual 20px, touch 44px</div></div>`})},
"2.4.12":{x:"Fixed headers covering the focused element makes keyboard users lose their place entirely. Like navigating with a blindfold over the center.",dt:"scroll-padding-top/bottom matching fixed element heights. CSS scroll-margin on focusable elements.",e:"Medium",p:1,gen:()=>({before:`header { position: fixed;\n  top: 0; height: 60px; }`,after:`header { position: fixed;\n  top: 0; height: 60px; }\nhtml { scroll-padding-top: 70px; }\n:focus { scroll-margin-top: 70px; }`,bH:`<div style="border:2px dashed #ff3d6b;padding:0;border-radius:6px;background:#fff;overflow:hidden;position:relative;height:90px"><div style="background:#222;color:white;padding:6px 10px;font-size:10px;position:absolute;top:0;left:0;right:0;z-index:2">Fixed Header</div><div style="margin-top:32px;padding:6px 8px"><div style="border:2px solid #3d9eff;border-radius:3px;padding:3px 6px;font-size:11px;color:#333">Focus ← <span style="color:#ff3d6b">hidden!</span></div></div></div>`,aH:`<div style="border:2px solid #4cdf9a;padding:0;border-radius:6px;background:#fff;overflow:hidden;position:relative;height:90px"><div style="background:#222;color:white;padding:6px 10px;font-size:10px;position:absolute;top:0;left:0;right:0;z-index:2">Fixed Header</div><div style="margin-top:42px;padding:6px 8px"><div style="border:2px solid #3d9eff;border-radius:3px;padding:3px 6px;font-size:11px;color:#333">Focus ← <span style="color:#4cdf9a">visible ✓</span></div></div></div>`})},
"3.3.9":{x:"Forcing password memorization/CAPTCHAs discriminates against cognitive disabilities, memory impairments, and learning disabilities.",dt:"Support passkeys, biometric auth, password managers. Never block paste. Provide OAuth/SSO. Use invisible CAPTCHA.",e:"Significant",p:2,gen:()=>({before:`<input type="password"\n  autocomplete="off"\n  onpaste="return false">`,after:`<input type="password"\n  autocomplete="current-password">\n<button>🔑 Sign in with Passkey</button>`,bH:`<div style="border:2px dashed #ff3d6b;padding:8px;border-radius:6px;background:#fff"><input type="password" placeholder="Password" disabled style="padding:6px;border:1px solid #ddd;border-radius:3px;width:100%;font-size:12px;margin-bottom:4px"><div style="background:#f0f0f0;padding:5px;border-radius:3px;font-size:11px;color:#666;text-align:center;font-family:monospace">X7kQ9</div><div style="color:#ff3d6b;font-size:10px;margin-top:3px">⚠ paste blocked + CAPTCHA</div></div>`,aH:`<div style="border:2px solid #4cdf9a;padding:8px;border-radius:6px;background:#fff"><input type="password" placeholder="Password" disabled style="padding:6px;border:1px solid #ddd;border-radius:3px;width:100%;font-size:12px;margin-bottom:4px"><div style="display:flex;gap:4px"><button disabled style="flex:1;padding:5px;background:#222;color:white;border:none;border-radius:3px;font-size:10px">🔑 Passkey</button><button disabled style="flex:1;padding:5px;background:#4285f4;color:white;border:none;border-radius:3px;font-size:10px">G Google</button></div><div style="color:#4cdf9a;font-size:10px;margin-top:3px">✓ Alternatives provided</div></div>`})},
"3.2.6":{x:"AAA requires consistent help (chat, phone, email) on every page in the same position. Cognitive disabilities rely on predictable placement.",dt:"Persistent footer help block with role='complementary' aria-label='Need Help?'. Verify on all templates.",e:"Medium",p:2,gen:()=>({before:`<footer>\n  <a href="/about">About</a>\n</footer>`,after:`<footer>\n  <div role="complementary"\n    aria-label="Need Help?">\n    <a href="/contact">Contact</a>\n    <a href="tel:18005550199">Call</a>\n    <button>Live Chat</button>\n  </div>\n</footer>`,bH:`<div style="border:2px dashed #ff3d6b;padding:8px;border-radius:6px;background:#fff;font-size:11px"><a href="#" style="color:#666">About</a> | <a href="#" style="color:#666">Privacy</a><div style="color:#ff3d6b;font-size:10px;margin-top:4px">⚠ No help mechanism</div></div>`,aH:`<div style="border:2px solid #4cdf9a;padding:8px;border-radius:6px;background:#fff;font-size:11px"><div style="margin-bottom:6px"><a href="#" style="color:#666">About</a> | <a href="#" style="color:#666">Privacy</a></div><div style="background:#f0fdf4;padding:6px 8px;border-radius:4px;border:1px solid #c6f6d5"><span style="font-size:9px;font-weight:700;color:#4cdf9a">NEED HELP?</span><div style="display:flex;gap:4px;margin-top:3px;font-size:10px"><a href="#" style="color:#2563eb">📧 Contact</a><a href="#" style="color:#2563eb">📞 Call</a><button style="background:#222;color:white;border:none;border-radius:2px;padding:1px 6px;font-size:10px">💬 Chat</button></div></div></div>`})},
"3.1.1":{x:"Without lang, screen readers guess the language — French engine reading English = gibberish. Breaks auto-translation and hyphenation.",dt:"Always set lang on <html>. Use lang on foreign-language spans.",e:"Quick",p:1,gen:()=>({before:`<html>`,after:`<html lang="en">`,bH:`<code style="display:block;font-size:11px;border:2px dashed #ff3d6b;padding:6px;border-radius:4px;background:#fff;color:#333">&lt;html&gt; — <span style="color:#ff3d6b">no lang</span></code>`,aH:`<code style="display:block;font-size:11px;border:2px solid #4cdf9a;padding:6px;border-radius:4px;background:#fff;color:#333">&lt;html lang="en"&gt; <span style="color:#4cdf9a">✓</span></code>`})},

{id:"1.1.1",n:"Non-text Content",l:"A",pr:"Perceivable",c(d){const r=[];d.querySelectorAll("img").forEach((e,i)=>{if(!e.getAttribute("alt")&&e.getAttribute("alt")!=="")r.push({s:SV.C,el:e.outerHTML.substring(0,150),msg:`Image #${i+1} missing alt`,fix:`Add alt="..." or alt=""`})});d.querySelectorAll("svg").forEach((e,i)=>{if(!e.getAttribute("role")&&!e.querySelector("title"))r.push({s:SV.M,el:"<svg>",msg:`SVG #${i+1} no accessible name`,fix:`role="img" + aria-label`})});d.querySelectorAll("canvas,video,audio,object").forEach((e,i)=>{if(!e.getAttribute("aria-label")&&!e.getAttribute("aria-labelledby")&&!e.textContent?.trim())r.push({s:SV.M,el:`<${e.tagName.toLowerCase()}>`,msg:`${e.tagName} #${i+1} no alt`,fix:`aria-label`})});return r}},
{id:"1.3.1",n:"Info & Relationships",l:"A",pr:"Perceivable",c(d){const r=[];d.querySelectorAll("table").forEach((t,i)=>{if(!t.querySelector("th,[role='columnheader']"))r.push({s:SV.M,el:"<table>",msg:`Table #${i+1} no headers`,fix:`<th scope="col">`});if(!t.querySelector("caption")&&!t.getAttribute("aria-label"))r.push({s:SV.m,el:"<table>",msg:`Table #${i+1} no caption`,fix:`<caption>`})});d.querySelectorAll("fieldset").forEach((f,i)=>{if(!f.querySelector("legend"))r.push({s:SV.M,el:"<fieldset>",msg:`Fieldset #${i+1} no legend`,fix:`<legend>`})});return r}},
{id:"1.3.5",n:"Input Purpose",l:"AA",pr:"Perceivable",c(d){const r=[];d.querySelectorAll("input[type='text'],input[type='email'],input[type='tel'],input:not([type]),input[type='password']").forEach(e=>{if(!e.getAttribute("autocomplete")){const n=e.getAttribute("name")||"";if(/name|email|phone|tel|address|zip|password|user/i.test(n))r.push({s:SV.m,el:e.outerHTML.substring(0,140),msg:`"${n}" no autocomplete`,fix:`autocomplete="..."`})}});return r}},
{id:"1.4.3",n:"Contrast (Minimum)",l:"AA",pr:"Perceivable",c(d){const r=[];let c=0;d.querySelectorAll("p,span,a,li,td,th,h1,h2,h3,h4,h5,h6,label,button,div").forEach(e=>{if(c>60)return;const st=e.getAttribute("style")||"";const cm=st.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);const bm=st.match(/background(?:-color)?\s*:\s*([^;]+)/i);if(cm&&bm){c++;const fg=pC(cm[1].trim()),bg=pC(bm[1].trim());if(fg&&bg){const ratio=CR(fg,bg);if(ratio<4.5)r.push({s:SV.C,el:e.outerHTML.substring(0,120),msg:`${ratio.toFixed(2)}:1 — needs ≥7:1`,fix:`Increase contrast`});else if(ratio<7)r.push({s:SV.m,el:e.outerHTML.substring(0,120),msg:`${ratio.toFixed(2)}:1 — AA ok, AAA needs ≥7:1`,fix:`Increase to 7:1`})}}});return r}},
{id:"1.4.6",n:"Contrast Enhanced",l:"AAA",pr:"Perceivable",c(){return[{s:SV.I,el:"—",msg:`AAA: 7:1 normal, 4.5:1 large`,fix:`Audit all color pairs`}]}},
{id:"1.4.8",n:"Visual Presentation",l:"AAA",pr:"Perceivable",c(d){const r=[];d.querySelectorAll("p,div,span,li,td,section").forEach(e=>{const st=e.getAttribute("style")||"";if(/text-align\s*:\s*justify/i.test(st))r.push({s:SV.M,el:e.outerHTML.substring(0,100),msg:`Justified text`,fix:`text-align:left`});const lh=st.match(/line-height\s*:\s*([0-9.]+)/i);if(lh&&parseFloat(lh[1])<1.5&&!lh[0].includes("px"))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`line-height ${lh[1]}<1.5`,fix:`≥1.5`})});return r}},
{id:"1.4.10",n:"Reflow",l:"AA",pr:"Perceivable",c(d){const r=[];const m=d.querySelector('meta[name="viewport"]');if(m){const c=m.getAttribute("content")||"";if(/maximum-scale\s*=\s*1/i.test(c)||/user-scalable\s*=\s*no/i.test(c))r.push({s:SV.C,el:m.outerHTML,msg:`Zoom blocked`,fix:`Remove restrictions`})}return r}},
{id:"1.4.12",n:"Text Spacing",l:"AA",pr:"Perceivable",c(d){const r=[];d.querySelectorAll('[style*="overflow"]').forEach(e=>{const st=e.getAttribute("style")||"";if(/overflow\s*:\s*hidden/i.test(st)&&/height\s*:\s*\d+px/i.test(st))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`overflow:hidden + fixed height`,fix:`min-height + overflow:auto`})});return r}},
{id:"2.1.1",n:"Keyboard",l:"A",pr:"Operable",c(d){const r=[];d.querySelectorAll("[onclick],[onmousedown]").forEach((e,i)=>{if(!e.getAttribute("onkeydown")&&!["A","BUTTON","INPUT","SELECT","TEXTAREA","SUMMARY"].includes(e.tagName))r.push({s:SV.C,el:e.outerHTML.substring(0,120),msg:`Mouse-only element #${i+1}`,fix:`Use <button>`})});d.querySelectorAll("div[onclick],span[onclick],div[role='button']").forEach(e=>{if(!e.getAttribute("tabindex"))r.push({s:SV.C,el:e.outerHTML.substring(0,120),msg:`Not focusable`,fix:`tabindex="0"`})});return r}},
{id:"2.4.1",n:"Bypass Blocks",l:"A",pr:"Operable",c(d){const r=[];if(!d.querySelector('a[href^="#main"],a[href^="#content"],[class*="skip"]')&&!d.querySelector("main,[role='main']"))r.push({s:SV.M,el:"—",msg:`No skip link / <main>`,fix:`Skip link + landmarks`});if(!d.querySelectorAll("header,[role='banner'],nav,[role='navigation'],main,[role='main'],footer,[role='contentinfo']").length&&d.querySelectorAll("div").length>5)r.push({s:SV.M,el:"—",msg:`No landmarks`,fix:`<header>,<nav>,<main>,<footer>`});return r}},
{id:"2.4.2",n:"Page Titled",l:"A",pr:"Operable",c(d){const r=[];const t=d.querySelector("title");if(!t||!t.textContent?.trim())r.push({s:SV.M,el:"<head>",msg:`Missing <title>`,fix:`Descriptive <title>`});return r}},
{id:"2.4.4",n:"Link Purpose",l:"A",pr:"Operable",c(d){const r=[];const v=["click here","here","read more","more","link","this","learn more"];d.querySelectorAll("a").forEach((a,i)=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();if(v.includes(t))r.push({s:SV.M,el:a.outerHTML.substring(0,120),msg:`"${t}" is vague`,fix:`Descriptive text`});if(!t&&!a.querySelector("img[alt]"))r.push({s:SV.C,el:a.outerHTML.substring(0,120),msg:`Link #${i+1} no text`,fix:`Add text/aria-label`})});return r}},
{id:"2.4.6",n:"Headings & Labels",l:"AA",pr:"Operable",c(d){const r=[];const hs=d.querySelectorAll("h1,h2,h3,h4,h5,h6");let prev=0,h1c=0;hs.forEach(h=>{const l=+h.tagName[1];if(l===1)h1c++;if(prev>0&&l>prev+1)r.push({s:SV.M,el:h.outerHTML.substring(0,100),msg:`Skip h${prev}→h${l}`,fix:`Sequential`});if(!h.textContent?.trim())r.push({s:SV.M,el:h.outerHTML.substring(0,100),msg:`Empty h${l}`,fix:`Add text`});prev=l});if(h1c===0&&hs.length>0)r.push({s:SV.M,el:"—",msg:`No h1`,fix:`Add <h1>`});if(h1c>1)r.push({s:SV.m,el:"—",msg:`${h1c} <h1>s`,fix:`Single h1`});return r}},
{id:"2.4.7",n:"Focus Visible",l:"AA",pr:"Operable",c(d){const r=[];let has=false;d.querySelectorAll("style").forEach(s=>{if(/outline\s*:\s*(none|0)/i.test(s.textContent||""))has=true});if(has)r.push({s:SV.M,el:"—",msg:`outline:none found`,fix:`:focus-visible custom styles`});return r}},
{id:"2.4.9",n:"Link Purpose (AAA)",l:"AAA",pr:"Operable",c(d){const r=[];const m={};d.querySelectorAll("a[href]").forEach(a=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();const h=a.getAttribute("href");if(t&&h){if(m[t]&&m[t]!==h)r.push({s:SV.m,el:a.outerHTML.substring(0,120),msg:`"${t}" → different URLs`,fix:`Same text = same URL`});m[t]=h}});return r}},
{id:"2.4.11",n:"Focus Not Obscured",l:"AA",pr:"Operable",c(d){const r=[];d.querySelectorAll('[style*="position"]').forEach(e=>{const st=e.getAttribute("style")||"";if(/position\s*:\s*(fixed|sticky)/i.test(st)&&/z-index/i.test(st))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`Fixed element may obscure focus`,fix:`scroll-padding-top`})});return r}},
{id:"2.4.12",n:"Focus Not Obscured (AAA)",l:"AAA",pr:"Operable",c(d){const r=[];const ct=d.querySelectorAll('[style*="position: fixed"],[style*="position:fixed"],[style*="position: sticky"],[style*="position:sticky"]').length;if(ct)r.push({s:SV.m,el:`${ct} fixed/sticky elements`,msg:`AAA: focus must be FULLY visible`,fix:`scroll-padding + scroll-margin`});return r}},
{id:"2.5.3",n:"Label in Name",l:"A",pr:"Operable",c(d){const r=[];d.querySelectorAll("button[aria-label],a[aria-label]").forEach(e=>{const al=(e.getAttribute("aria-label")||"").toLowerCase();const vt=(e.textContent||"").trim().toLowerCase();if(vt&&al&&!al.includes(vt))r.push({s:SV.M,el:e.outerHTML.substring(0,120),msg:`aria-label missing visible text`,fix:`Include visible text`})});return r}},
{id:"2.5.5",n:"Target Size (44×44 AAA)",l:"AAA",pr:"Operable",c(d){const r=[];d.querySelectorAll("a,button,[role='button'],input[type='checkbox'],input[type='radio']").forEach(e=>{const st=e.getAttribute("style")||"";const wm=st.match(/width\s*:\s*(\d+)px/i);const hm=st.match(/height\s*:\s*(\d+)px/i);const pm=st.match(/padding\s*:\s*(\d+)/i);if(wm&&hm){const W=+wm[1]+(pm?+pm[1]*2:0);const H=+hm[1]+(pm?+pm[1]*2:0);if(W<44||H<44)r.push({s:SV.M,el:e.outerHTML.substring(0,120),msg:`~${W}×${H}px < 44×44 AAA`,fix:`padding:${Math.ceil((44-(+wm[1]))/2)}px; margin:-${Math.ceil((44-(+wm[1]))/2)}px; box-sizing:content-box`})}});return r}},
{id:"2.5.8",n:"Target Size (24×24)",l:"AA",pr:"Operable",c(d){const r=[];d.querySelectorAll("a,button,[role='button']").forEach(e=>{const st=e.getAttribute("style")||"";const wm=st.match(/width\s*:\s*(\d+)px/i);const hm=st.match(/height\s*:\s*(\d+)px/i);if(wm&&hm&&(+wm[1]<24||+hm[1]<24))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`<24×24px`,fix:`Min 24×24`})});return r}},
{id:"3.1.1",n:"Language of Page",l:"A",pr:"Understandable",c(d){const r=[];if(!d.querySelector("html")?.getAttribute("lang"))r.push({s:SV.C,el:"<html>",msg:`Missing lang`,fix:`lang="en"`});return r}},
{id:"3.1.2",n:"Language of Parts",l:"AA",pr:"Understandable",c(d){const r=[];d.querySelectorAll("[lang]").forEach(e=>{const l=e.getAttribute("lang");if(l&&!/^[a-z]{2,3}(-[A-Za-z]{2,4})?$/.test(l))r.push({s:SV.m,el:e.outerHTML.substring(0,100),msg:`Invalid lang="${l}"`,fix:`BCP 47`})});return r}},
{id:"3.2.2",n:"On Input",l:"A",pr:"Understandable",c(d){const r=[];d.querySelectorAll("select[onchange]").forEach((e,i)=>{if(/location|navigate|href|window/i.test(e.getAttribute("onchange")||""))r.push({s:SV.M,el:e.outerHTML.substring(0,120),msg:`Auto-nav on change`,fix:`Submit button`})});return r}},
{id:"3.2.6",n:"Consistent Help (AAA)",l:"AAA",pr:"Understandable",c(d){const r=[];const h=d.querySelectorAll('a[href*="help"],a[href*="support"],a[href*="contact"],a[href*="faq"],[class*="help"]');if(h.length===0&&d.querySelectorAll("a").length>5)r.push({s:SV.M,el:"—",msg:`No help/contact found`,fix:`Persistent help in footer`});return r}},
{id:"3.3.2",n:"Labels",l:"A",pr:"Understandable",c(d){const r=[];d.querySelectorAll("input:not([type='hidden']):not([type='submit']):not([type='button']):not([type='reset']),select,textarea").forEach((e,i)=>{const id=e.getAttribute("id");if(!(id&&d.querySelector(`label[for="${id}"]`))&&!e.closest("label")&&!e.getAttribute("aria-label")&&!e.getAttribute("title"))r.push({s:SV.C,el:e.outerHTML.substring(0,120),msg:`Control #${i+1} unlabeled`,fix:`<label> or aria-label`})});return r}},

{id:"4.1.1",n:"Duplicate IDs",l:"A",pr:"Robust",c(d){const r=[];const ids={};d.querySelectorAll("[id]").forEach(e=>{const id=e.getAttribute("id");if(ids[id])r.push({s:SV.M,el:e.outerHTML.substring(0,100),msg:`Dup id="${id}"`,fix:`Unique IDs`});ids[id]=true});return r}},
{id:"4.1.2",n:"Name, Role, Value",l:"A",pr:"Robust",c(d){const r=[];const V=new Set(["alert","alertdialog","application","article","banner","button","cell","checkbox","columnheader","combobox","complementary","contentinfo","definition","dialog","directory","document","feed","figure","form","grid","gridcell","group","heading","img","link","list","listbox","listitem","log","main","marquee","math","menu","menubar","menuitem","menuitemcheckbox","menuitemradio","navigation","none","note","option","presentation","progressbar","radio","radiogroup","region","row","rowgroup","rowheader","scrollbar","search","searchbox","separator","slider","spinbutton","status","switch","tab","table","tablist","tabpanel","term","textbox","timer","toolbar","tooltip","tree","treegrid","treeitem"]);d.querySelectorAll("[role]").forEach(e=>{if(!V.has(e.getAttribute("role")))r.push({s:SV.M,el:e.outerHTML.substring(0,100),msg:`Invalid role`,fix:`Valid ARIA role`})});d.querySelectorAll("[aria-hidden='true']").forEach(e=>{if(e.querySelector("a[href],button,input,select,textarea,[tabindex]:not([tabindex='-1'])"))r.push({s:SV.C,el:e.outerHTML.substring(0,120),msg:`Focusable in aria-hidden`,fix:`Remove aria-hidden`})});return r}},

function analyze(h){const p=new DOMParser();const d=p.parseFromString(h,"text/html");return RULES.map(r=>{const issues=r.c(d);return{...r,issues,ok:issues.filter(i=>i.s!==SV.I).length===0}})}
function autoFix(h){let f=h;if(/<html(?![^>]*\slang\s*=)/i.test(f))f=f.replace(/<html/i,'<html lang="en"');f=f.replace(/user-scalable\s*=\s*no/gi,"user-scalable=yes");f=f.replace(/maximum-scale\s*=\s*1(?:\.0)?/gi,"maximum-scale=5.0");f=f.replace(/text-align\s*:\s*justify/gi,"text-align: left");return f}

const css = {
  bg: "#04070d", bg2: "#0b0f1a", bg3: "#111827", bg4: "#1a2236",
  bdr: "rgba(120,150,220,0.06)", bdr2: "rgba(120,150,220,0.1)",
  tx: "#e4eaf5", tx2: "#8495b5", tx3: "#4a5975",
  em: "#00f0cc", em2: "rgba(0,240,204,0.07)",
};

function ScoreRing({score,size=80}){
  const r=(size-8)/2;const c=2*Math.PI*r;const off=c*(1-score/100);
  const clr=score>=80?"#00f0cc":score>=50?"#ffb020":"#ff3d6b";
  return<div style={{position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center",width:size,height:size}}>
    <svg width={size} height={size} style={{transform:"rotate(-90deg)",position:"absolute"}}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={css.bg3} strokeWidth="4"/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={clr} strokeWidth="4" strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" style={{transition:"stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)"}}/></svg>
    <span style={{fontSize:size*.32,fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:clr,position:"relative"}}>{score}</span>
  </div>;
}

function RecCard({rec}){
  if(!rec)return null;
  return<div style={{marginTop:10,borderRadius:10,border:`1px solid ${css.bdr2}`,overflow:"hidden",animation:"fadeIn .3s ease-out"}}>
    <div style={{background:`linear-gradient(135deg,${css.em2},rgba(61,158,255,.02))`,padding:"13px 16px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:5,marginBottom:7}}>
        <div style={{display:"flex",alignItems:"center",gap:5}}><span style={{color:css.em,fontSize:12}}>✦</span><span style={{fontSize:9,fontWeight:700,color:css.em,letterSpacing:".06em",textTransform:"uppercase"}}>Recommendation</span></div>
        <div style={{display:"flex",gap:4}}><span style={{fontSize:8,fontWeight:700,padding:"2px 7px",borderRadius:3,background:`${PCLR[rec.p]}12`,color:PCLR[rec.p]}}>{PLBL[rec.p]?.split("—")[0]}</span><span style={{fontSize:8,fontWeight:600,padding:"2px 7px",borderRadius:3,background:"rgba(76,223,154,.06)",color:"#4cdf9a"}}>{rec.e}</span></div>
      </div>
      <p style={{fontSize:12,color:css.tx,margin:"0 0 9px",lineHeight:1.65}}>{rec.x}</p>
      <div style={{background:css.em2,borderRadius:6,padding:"8px 12px",borderLeft:`3px solid ${css.em}`}}><div style={{fontSize:8.5,textTransform:"uppercase",color:css.em,fontWeight:700,marginBottom:2}}>Design Suggestion</div><p style={{fontSize:11,color:css.tx2,margin:0,lineHeight:1.6}}>{rec.dt}</p></div>
    </div>
    {rec.bH&&rec.aH&&<div style={{borderTop:`1px solid ${css.bdr}`,padding:"12px 16px",background:"rgba(0,0,0,.1)"}}>
      <div style={{fontSize:8.5,fontWeight:700,color:css.tx3,textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>Before → After</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:160}}><div style={{fontSize:8,textTransform:"uppercase",letterSpacing:".08em",fontWeight:700,color:"#ff3d6b",marginBottom:3,display:"flex",alignItems:"center",gap:3}}><span style={{width:4,height:4,borderRadius:"50%",background:"#ff3d6b",display:"inline-block"}}/>Before</div><div style={{border:`1px solid ${css.bdr2}`,borderRadius:7,background:"#fff",padding:10,fontSize:12,color:"#333"}} dangerouslySetInnerHTML={{__html:rec.bH}}/></div>
        <div style={{flex:1,minWidth:160}}><div style={{fontSize:8,textTransform:"uppercase",letterSpacing:".08em",fontWeight:700,color:"#4cdf9a",marginBottom:3,display:"flex",alignItems:"center",gap:3}}><span style={{width:4,height:4,borderRadius:"50%",background:"#4cdf9a",display:"inline-block"}}/>After</div><div style={{border:`1px solid ${css.bdr2}`,borderRadius:7,background:"#fff",padding:10,fontSize:12,color:"#333"}} dangerouslySetInnerHTML={{__html:rec.aH}}/></div>
      </div>
    </div>}
    {rec.before&&rec.after&&<div style={{borderTop:`1px solid ${css.bdr}`,display:"flex",flexWrap:"wrap"}}>
      <pre style={{flex:1,minWidth:160,fontSize:10,color:"#ffa0b0",background:"rgba(255,61,107,.03)",padding:"8px 14px",margin:0,whiteSpace:"pre-wrap",wordBreak:"break-all",fontFamily:"'JetBrains Mono',monospace",lineHeight:1.55,maxHeight:130,overflow:"auto",borderRight:`1px solid ${css.bdr}`}}>{rec.before}</pre>

    </div>}
  </div>;
}

function ContrastChecker(){
  const[fg,setFg]=useState("#555");const[bg,setBg]=useState("#fff");
  const fr=pC(fg),br=pC(bg);const r=fr&&br?CR(fr,br):null;
  const t=r?[["AA",r>=4.5,"≥4.5"],["AA Lg",r>=3,"≥3"],["AAA",r>=7,"≥7"],["AAA Lg",r>=4.5,"≥4.5"]]:[];
  return<div style={{background:css.bg2,borderRadius:12,border:`1px solid ${css.bdr}`,padding:20}}>
    <h3 style={{margin:"0 0 14px",fontSize:17,fontWeight:600}}>Contrast Checker</h3>
    <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:14}}>{[["Foreground",fg,setFg],["Background",bg,setBg]].map(([l,v,s])=><label key={l} style={{display:"flex",flexDirection:"column",gap:4,flex:1,minWidth:130}}><span style={{fontSize:9,color:css.tx3,textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</span><div style={{display:"flex",gap:6,alignItems:"center"}}><input type="color" value={v} onChange={e=>s(e.target.value)} style={{width:34,height:30,border:"none",cursor:"pointer",borderRadius:5}}/><input type="text" value={v} onChange={e=>s(e.target.value)} style={{flex:1,padding:"7px 9px",background:css.bg3,border:`1px solid ${css.bdr}`,borderRadius:6,color:css.tx,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}/></div></label>)}</div>
    <div style={{background:br?bg:"#fff",color:fr?fg:"#000",padding:"16px 20px",borderRadius:8,marginBottom:12,border:`1px solid ${css.bdr2}`}}><div style={{fontSize:17,marginBottom:3,fontWeight:500}}>The quick brown fox</div><div style={{fontSize:12.5}}>Small text — 12.5px</div></div>
    {r!==null&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(85px,1fr))",gap:5}}>
      <div style={{textAlign:"center",padding:10,background:css.bg,borderRadius:6}}><div style={{fontSize:24,fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:r>=7?css.em:r>=4.5?"#ffb020":"#ff3d6b"}}>{r.toFixed(2)}</div><div style={{fontSize:8,color:css.tx3,marginTop:1,textTransform:"uppercase"}}>Ratio</div></div>
      {t.map(([l,pass,req])=><div key={l} style={{textAlign:"center",padding:10,background:pass?"rgba(0,240,204,.03)":"rgba(255,61,107,.03)",borderRadius:6,border:`1px solid ${pass?"rgba(0,240,204,.1)":"rgba(255,61,107,.1)"}`}}><div style={{fontSize:13,fontWeight:700,color:pass?css.em:"#ff3d6b"}}>{pass?"PASS":"FAIL"}</div><div style={{fontSize:8,color:css.tx3,marginTop:1}}>{l} {req}</div></div>)}</div>}
  </div>;
}

const SAMPLE=`<!DOCTYPE html>\n<html>\n<head>\n  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">\n  <title></title>\n</head>\n<body>\n  <div onclick="nav('/')" style="cursor:pointer">Home</div>\n  <h1>Welcome</h1><h3>Quick Start</h3>\n  <p style="text-align:justify;line-height:1.1;color:#999;background-color:#fff">Poor contrast.</p>\n  <img src="hero.jpg"><a href="/about">Click here</a><a href="/contact"></a>\n  <form><input type="text" name="email"><input type="password" autocomplete="off" onpaste="return false">\n  <select onchange="window.location=this.value"><option>Go</option></select>\n  <fieldset><input type="checkbox"> I agree</fieldset></form>\n  <div id="sid" aria-hidden="true"><a href="/p">Privacy</a><button>Contact</button></div>\n  <div id="sid">Dup</div>\n  <table><tr><td>Product</td><td>Price</td></tr></table>\n  <button style="width:18px;height:18px" aria-label="Close">×</button>\n  <svg width="80" height="80"><circle cx="40" cy="40" r="30" fill="blue"/></svg>\n  <footer><a href="/about">About</a></footer>\n</body></html>`;

function App(){

  const doAudit=useCallback((h,u)=>{if(!h?.trim())return;setHtml(h);setResults(analyze(h));setRem(autoFix(h));setTab("dashboard");if(u)setScUrl(u)},[]);
  const scanUrl=useCallback(async()=>{if(!url.trim())return;setFSt("loading");setFErr("");setResults(null);const r=await fetchURL(url.trim());if(r.ok){setFSt("done");setScUrl(r.url);setFErr(r.via||'');doAudit(r.html,r.url)}else{setFSt("error");setFErr(r.error)}},[url,doAudit]);

  const allIssues=useMemo(()=>{if(!results)return[];const l=[];results.forEach(r=>r.issues.filter(i=>i.s!==SV.I).forEach(i=>l.push({...i,ruleId:r.id,ruleName:r.n,level:r.l,rec:getRec(r.id,i)})));return l.sort((a,b)=>a.rec.p-b.rec.p)},[results]);
  const filtered=useMemo(()=>{if(!results)return[];return results.filter(r=>{if(fL!=="ALL"&&r.l!==fL)return false;if(fP!=="ALL"&&r.pr!==fP)return false;if(fS==="ISSUES"&&r.ok)return false;if(fS==="PASSED"&&!r.ok)return false;return true})},[results,fL,fS,fP]);
  const stats=useMemo(()=>{if(!results)return null;const t=results.length,p=results.filter(r=>r.ok).length;const a=results.flatMap(r=>r.issues).filter(i=>i.s!==SV.I);return{total:t,passed:p,crit:a.filter(i=>i.s===SV.C).length,maj:a.filter(i=>i.s===SV.M).length,min:a.filter(i=>i.s===SV.m).length,score:t>0?Math.round((p/t)*100):0,issues:a.length}},[results]);
  const princ=useMemo(()=>{if(!results)return{};const p={};["Perceivable","Operable","Understandable","Robust"].forEach(pr=>{const R=results.filter(r=>r.pr===pr);p[pr]={t:R.length,p:R.filter(r=>r.ok).length,s:R.length?Math.round(R.filter(r=>r.ok).length/R.length*100):100}});return p},[results]);

  const ST={root:{fontFamily:"'Manrope',sans-serif",background:css.bg,color:css.tx,minHeight:"100vh",WebkitFontSmoothing:"antialiased"},

    stat:(v,c,l)=><div style={{textAlign:"center",padding:"12px 6px",background:css.bg2,borderRadius:10,border:`1px solid ${css.bdr}`,flex:"1 1 60px",minWidth:56}}><div style={{fontSize:20,fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:c,lineHeight:1}}>{v}</div><div style={{fontSize:7.5,textTransform:"uppercase",letterSpacing:".08em",color:css.tx3,marginTop:4}}>{l}</div></div>};

  const previewRef=useRef(null);const remRef=useRef(null);
  useEffect(()=>{[previewRef,remRef].forEach((ref,i)=>{const h=i===0?html:rem;if(ref.current&&h){const d=ref.current.contentDocument;if(d){d.open();d.write(h);d.close()}}});},[html,rem,tab]);

  return<div style={{...ST.root,maxWidth:1120,margin:"0 auto",padding:"0 0 50px"}}>
    <style>{`@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .fade{animation:fadeIn .25s ease-out}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{width:15px;height:15px;border:2px solid rgba(0,240,204,.12);border-top-color:${css.em};border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
    button,input,textarea,select{font-family:'Manrope',sans-serif}
    :focus-visible{outline:2px solid ${css.em};outline-offset:2px}
    textarea:focus,input:focus{outline:none;border-color:rgba(0,240,204,.25)!important}
    `}</style>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

    {/* ── Header ── */}
    <header style={{borderBottom:`1px solid ${css.bdr}`,padding:"14px 22px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
      <div style={{display:"flex",alignItems:"center",gap:11}}>
        <div style={{width:34,height:34,borderRadius:8,background:`linear-gradient(135deg,${css.em},#00b89e)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:800,color:css.bg,fontFamily:"'JetBrains Mono',monospace"}}>B</div>
        <div><div style={{fontSize:15,fontWeight:700,lineHeight:1.15,letterSpacing:"-.02em"}}>Brainpulse <span style={{color:css.em}}>A11y</span></div><div style={{fontSize:9.5,color:css.tx3,letterSpacing:".02em"}}>WCAG 2.2 AAA · {RULES.length} Criteria · Hybrid Engine</div></div>
      </div>
      {stats&&<ScoreRing score={stats.score} size={50}/>}
    </header>

    {/* ── Input ── */}
    <section style={{padding:"14px 22px",borderBottom:`1px solid ${css.bdr}`}}>
      <div style={{display:"flex",gap:0,marginBottom:11}}>
        {[["url","🔗 Scan URL"],["html","</> HTML"]].map(([m,l])=><button key={m} onClick={()=>{setMode(m);setResults(null);setFSt(null)}} style={{padding:"7px 16px",fontSize:11.5,fontWeight:mode===m?700:500,cursor:"pointer",border:`1px solid ${css.bdr}`,borderBottom:mode===m?`2px solid ${css.em}`:`1px solid ${css.bdr}`,background:mode===m?css.bg2:"transparent",color:mode===m?css.em:css.tx3,borderRadius:m==="url"?"7px 0 0 0":"0 7px 0 0"}}>{l}</button>)}
      </div>
      {mode==="url"&&<div><div style={{display:"flex",gap:7,marginBottom:5}}><input type="url" value={url} onChange={e=>{setUrl(e.target.value);setFSt(null)}} onKeyDown={e=>{if(e.key==="Enter")scanUrl()}} placeholder="https://example.com" style={{flex:1,padding:"9px 13px",background:css.bg3,border:`1px solid ${css.bdr}`,borderRadius:8,color:css.tx,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}/><button onClick={scanUrl} disabled={!url.trim()||fSt==="loading"} style={{padding:"9px 20px",fontSize:11,borderRadius:7,border:"none",background:url.trim()?css.em:"rgba(0,240,204,.15)",color:css.bg,cursor:url.trim()?"pointer":"default",fontWeight:700,opacity:fSt==="loading"?.6:1}}>{fSt==="loading"?<><span className="spin" style={{width:12,height:12,marginRight:5}}/>Scanning…</>:"◉ Scan"}</button></div>
        {fSt==="error"&&<div style={{padding:"7px 11px",background:"rgba(255,61,107,.04)",borderRadius:7}}><p style={{fontSize:11.5,color:"#ff3d6b",lineHeight:1.6,margin:"0 0 5px"}}>{fErr}</p><button onClick={scanUrl} style={{padding:"4px 12px",fontSize:10.5,borderRadius:5,border:`1px solid ${css.bdr2}`,background:css.bg2,color:css.tx2,cursor:"pointer"}}>↻ Retry</button></div>}
        {fSt==="done"&&<div style={{fontSize:11,color:css.em,padding:"3px 0"}}>✓ {scUrl} via {fErr} — {html.length.toLocaleString()} chars</div>}

      {mode==="html"&&<div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5,flexWrap:"wrap",gap:4}}><span style={{fontSize:9,textTransform:"uppercase",letterSpacing:".07em",color:css.tx3,fontWeight:700}}>HTML</span><div style={{display:"flex",gap:5}}><button onClick={()=>{setHtml(SAMPLE);setResults(null)}} style={{padding:"5px 12px",fontSize:10.5,borderRadius:6,border:`1px solid ${css.bdr2}`,background:css.bg2,color:css.tx2,cursor:"pointer"}}>Sample</button><button onClick={()=>doAudit(html,"")} disabled={!html.trim()} style={{padding:"5px 16px",fontSize:10.5,borderRadius:6,border:"none",background:html.trim()?css.em:"rgba(0,240,204,.15)",color:css.bg,cursor:html.trim()?"pointer":"default",fontWeight:700}}>▶ Audit</button></div></div><textarea value={html} onChange={e=>{setHtml(e.target.value);setResults(null)}} placeholder="Paste HTML…" style={{width:"100%",minHeight:100,maxHeight:220,padding:"10px 12px",background:css.bg3,border:`1px solid ${css.bdr}`,borderRadius:8,color:css.tx,fontFamily:"'JetBrains Mono',monospace",fontSize:11,lineHeight:1.6,resize:"vertical",boxSizing:"border-box"}}/></div>}
    </section>

    {/* ── Tabs + Content ── */}
    {results&&<><nav style={{display:"flex",borderBottom:`1px solid ${css.bdr}`,padding:"0 14px",overflowX:"auto"}}>{TABS.map(t=><button key={t.k} onClick={()=>setTab(t.k)} style={{position:"relative",padding:"10px 14px",fontSize:11,fontWeight:tab===t.k?600:400,cursor:"pointer",border:"none",background:"transparent",color:tab===t.k?css.em:css.tx3,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",borderBottom:tab===t.k?`2px solid ${css.em}`:"2px solid transparent",transition:"color .15s"}}><span style={{fontSize:11.5}}>{t.i}</span>{t.l}</button>)}</nav>
    <div style={{padding:"16px 22px",minHeight:240}} className="fade">

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontSize:12.5,fontWeight:600}}>{p}</span><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:16,fontWeight:700,color:c}}>{d.s}%</span></div>
          <div style={{height:5,background:css.bg4,borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",background:c,borderRadius:3,width:`${d.s}%`,transition:"width .5s ease-out"}}/></div>

      <div style={{display:"flex",flexDirection:"column",gap:3}}>{filtered.map(rule=>{const isO=exp===rule.id;const ic=rule.issues.filter(i=>i.s!==SV.I).length;return<div key={rule.id} style={{background:css.bg2,border:`1px solid ${css.bdr}`,borderRadius:8,overflow:"hidden"}}><button onClick={()=>setExp(isO?null:rule.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:7,padding:"9px 13px",border:"none",background:"transparent",cursor:"pointer",color:css.tx,textAlign:"left",fontSize:11.5,transition:"background .12s"}}><span style={{width:6,height:6,borderRadius:"50%",background:rule.ok?css.em:"#ff3d6b",flexShrink:0}}/><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:css.em,fontWeight:600,minWidth:36}}>{rule.id}</span><span style={{fontWeight:500,flex:1}}>{rule.n}</span><span style={ST.pill(rule.l==="AAA"?"#b388ff":rule.l==="AA"?"#3d9eff":css.em, rule.l==="AAA"?"rgba(179,136,255,.06)":rule.l==="AA"?"rgba(61,158,255,.06)":css.em2)}>{rule.l}</span>{ic>0&&<span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9.5,color:"#ff3d6b",fontWeight:600}}>{ic}</span>}<span style={{fontSize:8.5,color:css.tx3,transform:isO?"rotate(90deg)":"none",transition:"transform .15s"}}>▶</span></button>
      {isO&&<div className="fade" style={{borderTop:`1px solid ${css.bdr}`,padding:"10px 13px"}}>{rule.issues.length===0?<div style={{fontSize:11.5,color:css.em}}>✓ No issues.</div>:<div style={{display:"flex",flexDirection:"column",gap:10}}>{rule.issues.map((issue,idx)=>{const isI=issue.s===SV.I;const rec=!isI?getRec(rule.id,issue):null;return<div key={idx} style={{background:SBG[issue.s],borderRadius:7,padding:"10px 13px",borderLeft:`3px solid ${SCLR[issue.s]}`}}>
        <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:5,flexWrap:"wrap"}}><span style={ST.pill(SCLR[issue.s],"transparent")}>{issue.s}</span>{rec&&<span style={{fontSize:7.5,fontWeight:700,padding:"2px 6px",borderRadius:3,background:`${PCLR[rec.p]}10`,color:PCLR[rec.p]}}>{PLBL[rec.p]?.split("—")[0]}</span>}</div>

        <div style={{fontSize:10.5,color:css.em,display:"flex",alignItems:"flex-start",gap:4}}><span>⮕</span><span style={{lineHeight:1.5}}>{issue.fix}</span></div>

      </div>})}</div>}</div>}</div>})}</div>

      <div style={{flex:1,minWidth:220}}><div style={{fontSize:8,textTransform:"uppercase",letterSpacing:".08em",fontWeight:700,color:"#4cdf9a",marginBottom:4,display:"flex",alignItems:"center",gap:3}}><span style={{width:4,height:4,borderRadius:"50%",background:"#4cdf9a",display:"inline-block"}}/>Remediated</div><iframe ref={remRef} sandbox="allow-same-origin" style={{width:"100%",height:280,border:`1px solid ${css.bdr}`,borderRadius:9,background:"#fff"}} title="Remediated"/></div>
    </div></div>}

    </div></>}
