function pC(s){if(!s)return null;s=s.trim().toLowerCase();if(NC[s])return NC[s];let m=s.match(/^#([0-9a-f]{3,8})$/);if(m){let h=m[1];if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}m=s.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);if(m)return[+m[1],+m[2],+m[3]];return null}

async function fetchURL(url,attempt=1){if(!/^https?:\/\//i.test(url))url='https://'+url;const e=encodeURIComponent(url);const S=[{n:'codetabs',u:`https://api.codetabs.com/v1/proxy?quest=${e}`,m:'t'},{n:'allorigins',u:`https://api.allorigins.win/raw?url=${e}`,m:'t'},{n:'allorigins-json',u:`https://api.allorigins.win/get?url=${e}`,m:'j'},{n:'corsproxy',u:`https://corsproxy.io/?${e}`,m:'t'},{n:'direct',u:url,m:'t'}];const tried=[];for(const s of S){try{const r=await fTO(s.u,12000);if(!r.ok){tried.push(`${s.n}:${r.status}`);continue}let h='';if(s.m==='j'){const j=await r.json();h=j.contents||''}else{h=await r.text()}if(h.length>80&&h.includes('<'))return{ok:true,html:h,url,via:s.n};tried.push(`${s.n}:${h.length}ch`)}catch(e){tried.push(`${s.n}:${e.name==='AbortError'?'timeout':'err'}`)}}

// ── Donut Chart ──
function Donut({value,size=100,strokeW=8,color,label,sublabel,animate=true}){
  const [v,setV]=useState(0);
  useEffect(()=>{if(animate){const t=setTimeout(()=>setV(value),80);return()=>clearTimeout(t)}else setV(value)},[value,animate]);
  const r=(size-strokeW*2)/2,c=2*Math.PI*r,off=c*(1-v/100);
  const clr=color||(v>=80?T.teal:v>=50?T.peach:T.rose);
  return<div style={{position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center",width:size,height:size}} role="img" aria-label={`${label||''}: ${value}%`}>
    <svg width={size} height={size} style={{transform:"rotate(-90deg)",position:"absolute"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.bg3} strokeWidth={strokeW}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={clr} strokeWidth={strokeW} strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" style={{transition:`stroke-dashoffset 1.2s ${T.ease}`,filter:`drop-shadow(0 0 4px ${clr}40)`}}/>
    </svg>
    <div style={{textAlign:"center",position:"relative"}}>
      <div style={{fontSize:size*.28,fontFamily:T.mono,fontWeight:700,color:clr,lineHeight:1}}>{v}</div>
      {sublabel&&<div style={{fontSize:Math.max(8,size*.08),color:T.dm,marginTop:1,textTransform:"uppercase",letterSpacing:".08em",fontWeight:600}}>{sublabel}</div>}
    </div>
  </div>;
}

function AnimStat({value,label,color,icon}){
  const[v,setV]=useState(0);
  useEffect(()=>{let start=0;const step=()=>{start+=Math.ceil(value/20);if(start>=value){setV(value);return}setV(start);requestAnimationFrame(step)};requestAnimationFrame(step)},[value]);

    {icon&&<div style={{marginBottom:6}}>{icon}</div>}
    <div style={{fontSize:28,fontFamily:T.mono,fontWeight:700,color,lineHeight:1,position:"relative",zIndex:1}}>{v}</div>
    <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:".08em",color:T.dm,marginTop:5,fontWeight:600,position:"relative",zIndex:1}}>{label}</div>

  </div>;
}

function dl(content,filename,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href)}
function ts(){return new Date().toISOString().split('T')[0]}

function exportCSV(results,scUrl){
  const rows=[['WCAG ID','Criterion','Level','Principle','Status','Severity','Issue','Fix','Priority','Effort']];
  results.forEach(r=>{
    if(r.ok)rows.push([r.id,r.n,r.l,r.pr,'PASS','','','','','']);
    r.issues.filter(i=>i.s!==SV.I).forEach(i=>{
      const rec=getRec(r.id,i);
      rows.push([r.id,r.n,r.l,r.pr,'FAIL',i.s,`"${i.msg.replace(/"/g,'""')}"`,`"${i.fix.replace(/"/g,'""')}"`,`P${rec.p}`,rec.e]);
    });
  });
  dl(rows.map(r=>r.join(',')).join('\n'),`wcag-audit-${ts()}.csv`,'text/csv;charset=utf-8');
}

function exportJSON(results,stats,scUrl){
  const report={
    meta:{tool:"BrainPulse A11y",version:"2.2",standard:"WCAG 2.2 AAA",date:new Date().toISOString(),url:scUrl||"Manual HTML input"},
    summary:{score:stats.score,totalRules:stats.total,passed:stats.passed,issues:stats.issues,critical:stats.crit,major:stats.maj,minor:stats.min},
    results:results.map(r=>({
      id:r.id,name:r.n,level:r.l,principle:r.pr,status:r.ok?"PASS":"FAIL",
      issues:r.issues.filter(i=>i.s!==SV.I).map(i=>{const rec=getRec(r.id,i);return{severity:i.s,message:i.msg,element:i.el,fix:i.fix,priority:`P${rec.p}`,effort:rec.e,explanation:rec.x,designTip:rec.dt}})
    }))
  };
  dl(JSON.stringify(report,null,2),`wcag-audit-${ts()}.json`,'application/json');
}

  let md=`# WCAG 2.2 AAA Audit Report\n\n`;

  md+=`**URL:** ${scUrl||'Manual HTML input'}\n`;
  md+=`**Tool:** BrainPulse A11y — WCAG 2.2 AAA Compliance Engine\n\n`;
  md+=`---\n\n## Summary\n\n`;
  md+=`| Metric | Value |\n|--------|-------|\n`;
  md+=`| Score | **${stats.score}/100** |\n`;
  md+=`| Rules Checked | ${stats.total} |\n`;
  md+=`| Passed | ${stats.passed} |\n`;
  md+=`| Issues Found | ${stats.issues} |\n`;
  md+=`| Critical | ${stats.crit} |\n`;
  md+=`| Major | ${stats.maj} |\n`;
  md+=`| Minor | ${stats.min} |\n\n`;
  md+=`## POUR Principle Breakdown\n\n`;
  ["Perceivable","Operable","Understandable","Robust"].forEach(p=>{
    const R=results.filter(r=>r.pr===p);const pass=R.filter(r=>r.ok).length;
    md+=`- **${p}:** ${pass}/${R.length} passed (${R.length?Math.round(pass/R.length*100):100}%)\n`;
  });
  md+=`\n## Level Breakdown\n\n`;
  ["A","AA","AAA"].forEach(l=>{
    const R=results.filter(r=>r.l===l);const pass=R.filter(r=>r.ok).length;
    md+=`- **Level ${l}:** ${pass}/${R.length} passed (${R.length?Math.round(pass/R.length*100):100}%)\n`;
  });
  if(allIssues.length>0){
    md+=`\n---\n\n## Issues Found\n\n`;
    md+=`### Priority Roadmap\n\n`;
    [1,2,3,4].forEach(p=>{
      const items=allIssues.filter(i=>i.rec.p===p);
      if(!items.length)return;
      md+=`#### ${PLBL[p]}\n\n`;
      items.forEach(i=>{
        md+=`- **${i.ruleId} ${i.ruleName}** (${i.s}) — ${i.msg}\n`;
        md+=`  - Fix: ${i.fix}\n`;
        md+=`  - ${i.rec.x}\n`;
        md+=`  - Design tip: ${i.rec.dt}\n\n`;
      });
    });
  }
  md+=`\n---\n\n## Detailed Results\n\n`;
  md+=`| ID | Criterion | Level | Status | Issues |\n|-----|-----------|-------|--------|--------|\n`;
  results.forEach(r=>{
    const ic=r.issues.filter(i=>i.s!==SV.I).length;
    md+=`| ${r.id} | ${r.n} | ${r.l} | ${r.ok?'✅ Pass':'❌ Fail'} | ${ic} |\n`;
  });
  md+=`\n---\n\n*Generated by [BrainPulse A11y](https://www.brainpulseinc.com/wcag-tool.html)*\n`;
  dl(md,`wcag-audit-${ts()}.md`,'text/markdown;charset=utf-8');
}

  ["Perceivable","Operable","Understandable","Robust"].forEach(p=>{

  });
  h+=`</div><h2>Level Breakdown</h2><div class="grid">`;
  ["A","AA","AAA"].forEach(l=>{

}

function copyClipboard(results,stats,scUrl,allIssues){
  let t=`WCAG 2.2 AAA AUDIT REPORT\n`;
  t+=`${'═'.repeat(40)}\n`;
  t+=`URL: ${scUrl||'Manual HTML'}\nDate: ${new Date().toLocaleDateString()}\n\n`;
  t+=`SCORE: ${stats.score}/100\n`;
  t+=`Passed: ${stats.passed}/${stats.total} | Issues: ${stats.issues} (${stats.crit} critical, ${stats.maj} major, ${stats.min} minor)\n\n`;
  if(allIssues.length){
    t+=`ISSUES:\n${'─'.repeat(40)}\n`;
    allIssues.forEach(i=>{t+=`[${i.s.toUpperCase()}] ${i.ruleId} ${i.ruleName}: ${i.msg}\n  Fix: ${i.fix}\n\n`});
  }
  t+=`Generated by BrainPulse A11y — brainpulseinc.com\n`;
  navigator.clipboard?.writeText(t);
  return true;
}

function ContrastChecker(){
  const[fg,setFg]=useState("#57534E");const[bg,setBg]=useState("#FBF9F6");
  const fr=pC(fg),br=pC(bg);const r=fr&&br?CR(fr,br):null;
  const ts=r?[["AA",r>=4.5,"≥4.5:1"],["AA Large",r>=3,"≥3:1"],["AAA",r>=7,"≥7:1"],["AAA Large",r>=4.5,"≥4.5:1"]]:[];
  return<div style={{background:T.w,borderRadius:22,border:`1px solid ${T.b1}`,padding:"28px 28px",boxShadow:"0 4px 16px rgba(28,25,23,.04),0 12px 40px rgba(28,25,23,.04)",position:"relative",overflow:"hidden"}}>

    </label>)}</div>
    <div style={{background:br?bg:T.w,color:fr?fg:T.ink,padding:"24px 28px",borderRadius:16,marginBottom:20,border:`1px solid ${T.b1}`,boxShadow:"inset 0 2px 8px rgba(28,25,23,.03)",position:"relative"}}>

        <div style={{fontSize:10,color:T.dm,marginTop:5,textTransform:"uppercase",letterSpacing:".06em"}}>Ratio</div>
      </div>

        <div style={{fontSize:10,color:T.dm,marginTop:3}}>{l}</div>
        <div style={{fontSize:10,color:T.dm,fontFamily:T.mono}}>{req}</div>

      {formats.map(f=><button key={f.id} onClick={f.fn} aria-label={`Export as ${f.name}`} style={{background:T.w,borderRadius:18,border:`1px solid ${T.b1}`,padding:"22px 24px",textAlign:"left",cursor:"pointer",boxShadow:"0 2px 8px rgba(28,25,23,.03),0 8px 24px rgba(28,25,23,.04)",transition:`all .25s ${T.ease}`,display:"flex",gap:16,alignItems:"flex-start"}}>

      </button>)}
    </div>

    <div style={{marginTop:20,background:T.ts,borderRadius:14,padding:"16px 20px",border:`1px solid ${T.tm}`}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
        <svg width="16" height="16" viewBox="0 0 16 16" fill={T.teal}><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm1 11H7V7h2v4zm0-6H7V3h2v2z"/></svg>
        <span style={{fontSize:12,fontWeight:700,color:T.teal}}>Export Guide</span>
      </div>
      <div style={{fontSize:12.5,color:T.mt,lineHeight:1.65}}>
        <strong>PDF</strong> — Best for sharing with leadership and compliance teams. Print to PDF or paper.<br/>
        <strong>HTML</strong> — Self-contained styled report. Email as attachment or host on your site.<br/>
        <strong>CSV</strong> — Import into Excel, Google Sheets, or project trackers for sprint planning.<br/>
        <strong>JSON</strong> — Integrate into CI/CD pipelines, automated dashboards, or JIRA via API.<br/>
        <strong>Markdown</strong> — Paste into GitHub Issues, Confluence pages, or README files.<br/>
        <strong>Clipboard</strong> — Quick paste into Slack messages, emails, or meeting notes.
      </div>
    </div>
  </div>;
}

const SAMPLE=`<!DOCTYPE html>\n<html>\n<head>\n  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">\n  <title></title>\n</head>\n<body>\n  <div onclick="nav('/')" style="cursor:pointer">Home</div>\n  <h1>Welcome</h1><h3>Quick Start</h3>\n  <p style="text-align:justify;line-height:1.1;color:#999;background-color:#fff">Poor contrast.</p>\n  <img src="hero.jpg"><a href="/about">Click here</a><a href="/contact"></a>\n  <form><input type="text" name="email"><input type="password" autocomplete="off" onpaste="return false">\n  <select onchange="window.location=this.value"><option>Go</option></select>\n  <fieldset><input type="checkbox"> I agree</fieldset></form>\n  <div id="sid" aria-hidden="true"><a href="/p">Privacy</a><button>Contact</button></div>\n  <div id="sid">Dup</div>\n  <table><tr><td>Product</td><td>Price</td></tr></table>\n  <button style="width:18px;height:18px" aria-label="Close">×</button>\n  <svg width="80" height="80"><circle cx="40" cy="40" r="30" fill="blue"/></svg>\n  <footer><a href="/about">About</a></footer>\n</body></html>`;

const TABS=[{k:"dashboard",l:"Dashboard",i:"◎"},{k:"audit",l:"Audit",i:"◉"},{k:"priority",l:"Priority",i:"⚡"},{k:"contrast",l:"Contrast",i:"◑"},{k:"preview",l:"Preview",i:"◫"},{k:"export",l:"Export",i:"⬇"}];

function App(){
  const[mode,setMode]=useState("url");const[url,setUrl]=useState("");const[html,setHtml]=useState("");
  const[fSt,setFSt]=useState(null);const[fErr,setFErr]=useState("");const[scUrl,setScUrl]=useState("");
  const[results,setResults]=useState(null);const[tab,setTab]=useState("dashboard");
  const[fL,setFL]=useState("ALL");const[fS,setFS]=useState("ALL");const[fP,setFP]=useState("ALL");
  const[exp,setExp]=useState(null);const[rem,setRem]=useState("");

  const doAudit=useCallback((h,u)=>{if(!h?.trim())return;setHtml(h);setResults(analyze(h));setRem(autoFix(h));setTab("dashboard");if(u)setScUrl(u)},[]);
  const scanUrl=useCallback(async()=>{if(!url.trim())return;setFSt("loading");setFErr("");setResults(null);const r=await fetchURL(url.trim());if(r.ok){setFSt("done");setScUrl(r.url);setFErr(r.via||'');doAudit(r.html,r.url)}else{setFSt("error");setFErr(r)}},[url,doAudit]);

  const allIssues=useMemo(()=>{if(!results)return[];const l=[];results.forEach(r=>r.issues.filter(i=>i.s!==SV.I).forEach(i=>l.push({...i,ruleId:r.id,ruleName:r.n,level:r.l,rec:getRec(r.id,i)})));return l.sort((a,b)=>a.rec.p-b.rec.p)},[results]);
  const filtered=useMemo(()=>{if(!results)return[];return results.filter(r=>{if(fL!=="ALL"&&r.l!==fL)return false;if(fP!=="ALL"&&r.pr!==fP)return false;if(fS==="ISSUES"&&r.ok)return false;if(fS==="PASSED"&&!r.ok)return false;return true})},[results,fL,fS,fP]);
  const stats=useMemo(()=>{if(!results)return null;const t=results.length,p=results.filter(r=>r.ok).length;const a=results.flatMap(r=>r.issues).filter(i=>i.s!==SV.I);return{total:t,passed:p,crit:a.filter(i=>i.s===SV.C).length,maj:a.filter(i=>i.s===SV.M).length,min:a.filter(i=>i.s===SV.m).length,score:t>0?Math.round((p/t)*100):0,issues:a.length}},[results]);
  const princ=useMemo(()=>{if(!results)return{};const p={};["Perceivable","Operable","Understandable","Robust"].forEach(pr=>{const R=results.filter(r=>r.pr===pr);p[pr]={t:R.length,p:R.filter(r=>r.ok).length,s:R.length?Math.round(R.filter(r=>r.ok).length/R.length*100):100}});return p},[results]);

  const pill=(c,b)=>({fontSize:9.5,fontWeight:700,letterSpacing:".05em",textTransform:"uppercase",padding:"3px 9px",borderRadius:20,color:c,background:b,display:"inline-block"});
  const pRef=useRef(null);const rRef=useRef(null);
  useEffect(()=>{[[pRef,html],[rRef,rem]].forEach(([ref,h])=>{if(ref.current&&h){const d=ref.current.contentDocument;if(d){d.open();d.write(h);d.close()}}});},[html,rem,tab]);

  return<div role="main" style={{fontFamily:T.sans,background:T.bg,color:T.ink,minHeight:"100vh",maxWidth:1160,margin:"0 auto",padding:0,WebkitFontSmoothing:"antialiased"}}>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>{`@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fade{animation:fadeUp .4s ${T.ease}}
    .spin{width:16px;height:16px;border:2.5px solid ${T.tm};border-top-color:${T.teal};border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
    .pulse-dot{animation:pulse 2s ease-in-out infinite}
    .row-b{width:100%;display:flex;align-items:center;gap:10px;padding:16px 22px;border:none;background:transparent;cursor:pointer;color:${T.ink};text-align:left;font-size:14px;transition:all .2s ${T.ease};border-radius:0;min-height:52px}
    .row-b:hover{background:${T.bg2}}
    .tab-b{position:relative;padding:14px 20px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:${T.dm};display:flex;align-items:center;gap:7px;white-space:nowrap;border-bottom:2.5px solid transparent;transition:all .2s ${T.ease};min-height:52px}
    .tab-b:hover{color:${T.mt}}.tab-b.on{color:${T.teal};border-bottom-color:${T.teal}}
    .card{background:${T.w};border-radius:18px;border:1px solid ${T.b1};box-shadow:0 2px 8px rgba(28,25,23,.03),0 8px 24px rgba(28,25,23,.04);transition:all .25s ${T.ease};overflow:hidden}
    .card:hover{box-shadow:0 4px 12px rgba(28,25,23,.06),0 16px 40px rgba(28,25,23,.06);transform:translateY(-1px)}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid ${T.teal};outline-offset:2px;border-radius:6px}
    `}</style>

    {/* ── HEADER ── */}
    <header style={{borderBottom:`1px solid ${T.b1}`,padding:"20px 30px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:14,background:`rgba(251,249,246,.95)`,backdropFilter:"blur(16px)",position:"sticky",top:0,zIndex:10}}>
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        <HexIcon size={44}><circle cx="26" cy="23" r="5" fill="none" stroke={T.teal} strokeWidth="1.8"/><circle cx="26" cy="23" r="2" fill={T.teal}/></HexIcon>
        <div>
          <h1 style={{margin:0,fontSize:20,fontWeight:700,lineHeight:1.2,letterSpacing:"-.02em",fontFamily:T.serif}}>BrainPulse <span style={{color:T.teal}}>A11y</span></h1>
          <p style={{margin:"3px 0 0",fontSize:11.5,color:T.dm,display:"flex",alignItems:"center",gap:6}}>
            <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",borderRadius:20,background:T.ts,border:`1px solid ${T.tm}`}}><span style={{width:6,height:6,borderRadius:"50%",background:T.teal}} className="pulse-dot"/>WCAG 2.2 AAA</span>
            {RULES.length} Criteria · Hybrid Engine
          </p>
        </div>
      </div>
      {stats&&<div style={{display:"flex",alignItems:"center",gap:14}}>
        <Donut value={stats.score} size={52} sublabel="score"/>
        <div style={{padding:"6px 14px",borderRadius:20,background:T.ts,border:`1px solid ${T.tm}`,display:"flex",alignItems:"center",gap:5}}>
          <svg width="14" height="14" viewBox="0 0 16 16" fill={T.teal}><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm3.5 5.3l-4 5a.75.75 0 01-1.1.1L4.5 8.5a.75.75 0 011-1.1l1.4 1.2 3.5-4.4a.75.75 0 011.1 1.1z"/></svg>
          <span style={{fontSize:11,fontWeight:700,color:T.teal}}>AAA Compliant</span>
        </div>
      </div>}
    </header>

    {/* ── INPUT ── */}
    <section style={{padding:"22px 30px",borderBottom:`1px solid ${T.b1}`,background:T.w,position:"relative",overflow:"hidden"}} aria-label="Input">
      <HexGrid w={600} h={100}/>
      <div style={{display:"flex",gap:0,marginBottom:16,position:"relative"}} role="tablist">
        {[["url","🔗  Scan URL"],["html","</>  Paste HTML"]].map(([m,l])=><button key={m} role="tab" aria-selected={mode===m} onClick={()=>{setMode(m);setResults(null);setFSt(null)}} style={{padding:"12px 24px",fontSize:13.5,fontWeight:mode===m?700:500,cursor:"pointer",border:`1px solid ${T.b1}`,borderBottom:mode===m?`3px solid ${T.teal}`:`1px solid ${T.b1}`,background:mode===m?T.bg:"transparent",color:mode===m?T.teal:T.dm,borderRadius:m==="url"?"14px 0 0 0":"0 14px 0 0",minHeight:52,transition:`all .2s ${T.ease}`}}>{l}</button>)}
      </div>
      {mode==="url"&&<div style={{position:"relative"}}><div style={{display:"flex",gap:10,marginBottom:8}}><input type="url" value={url} onChange={e=>{setUrl(e.target.value);setFSt(null)}} onKeyDown={e=>{if(e.key==="Enter")scanUrl()}} placeholder="https://example.com" aria-label="URL" style={{flex:1,padding:"14px 18px",background:T.bg,border:`1.5px solid ${T.b1}`,borderRadius:14,color:T.ink,fontFamily:T.mono,fontSize:14,minHeight:52}}/><button onClick={scanUrl} disabled={!url.trim()||fSt==="loading"} style={{padding:"14px 30px",fontSize:14,borderRadius:14,border:`2px solid ${T.teal}`,background:url.trim()?T.teal:"transparent",color:url.trim()?T.w:T.teal,cursor:url.trim()?"pointer":"default",fontWeight:700,minHeight:52,boxShadow:url.trim()?`0 4px 14px rgba(13,115,119,.25)`:"none"}}>{fSt==="loading"?<><span className="spin" style={{marginRight:8}}/>Scanning…</>:"◉ Scan"}</button></div>
        {fSt==="error"&&<div role="alert" className="fade" style={{borderRadius:16,border:`1px solid ${T.rm}`,overflow:"hidden",marginTop:4}}>
          <div style={{padding:"16px 20px",background:T.rs}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill={T.rose}><circle cx="10" cy="10" r="9"/><path d="M10 6v5M10 13v1" stroke="#fff" strokeWidth="2" strokeLinecap="round"/></svg>
              <span style={{fontSize:14,fontWeight:700,color:T.rose}}>{fErr?.inSandbox?"Preview Sandbox Restriction":"Could not reach the URL"}</span>
            </div>
            <p style={{fontSize:13,color:T.mt,lineHeight:1.65,margin:0}}>
              {fErr?.inSandbox
                ?"This preview runs inside a sandboxed environment that blocks network requests. The tool works correctly when deployed to your website."
                :`Attempted 3 retry rounds across 5 proxies. The site may block automated requests.`}
            </p>
          </div>
          <div style={{padding:"16px 20px",background:T.w,borderTop:`1px solid ${T.b1}`}}>
            <div style={{fontSize:12,fontWeight:700,color:T.ink,marginBottom:12,display:"flex",alignItems:"center",gap:6}}>
              <svg width="16" height="16" viewBox="0 0 16 16" fill={T.teal}><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm1 11H7V7h2v4zm0-6H7V3h2v2z"/></svg>
              Quick Fix — Paste the HTML source
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[
                ["1","Open the URL in a new tab",`Navigate to ${url} in your browser`],
                ["2","View Page Source","Right-click anywhere → View Page Source (or Ctrl+U / ⌘+U)"],
                ["3","Copy all","Press Ctrl+A then Ctrl+C (or ⌘+A then ⌘+C)"],
                ["4","Paste here","Switch to the </> HTML tab above and paste"]
              ].map(([n,title,desc])=><div key={n} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                <span style={{width:24,height:24,borderRadius:8,background:T.ts,border:`1px solid ${T.tm}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:T.teal,flexShrink:0}}>{n}</span>
                <div><div style={{fontSize:13,fontWeight:600,color:T.ink}}>{title}</div><div style={{fontSize:12,color:T.dm}}>{desc}</div></div>
              </div>)}
            </div>
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button onClick={scanUrl} style={{padding:"10px 20px",fontSize:12,borderRadius:10,border:`2px solid ${T.teal}`,background:T.teal,color:T.w,cursor:"pointer",fontWeight:700}}>↻ Retry Scan</button>
              <button onClick={()=>{setMode("html");setFSt(null)}} style={{padding:"10px 20px",fontSize:12,borderRadius:10,border:`1px solid ${T.b2}`,background:T.bg,color:T.mt,cursor:"pointer",fontWeight:600}}>Switch to HTML tab</button>
            </div>
          </div>
        </div>}
        {fSt==="done"&&<div role="status" style={{fontSize:13,color:T.teal,padding:"6px 0",fontWeight:600,display:"flex",alignItems:"center",gap:6}}><svg width="16" height="16" viewBox="0 0 16 16" fill={T.teal}><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm3.5 5.3l-4 5a.75.75 0 01-1.1.1L4.5 8.5a.75.75 0 011-1.1l1.4 1.2 3.5-4.4a.75.75 0 011.1 1.1z"/></svg>Fetched {scUrl} via {fErr} — {html.length.toLocaleString()} characters</div>}
      </div>}
      {mode==="html"&&<div style={{position:"relative"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:6}}><span style={{fontSize:11,textTransform:"uppercase",letterSpacing:".07em",color:T.dm,fontWeight:700}}>Source</span><div style={{display:"flex",gap:8}}><button onClick={()=>{setHtml(SAMPLE);setResults(null)}} style={{padding:"10px 18px",fontSize:12,borderRadius:10,border:`1px solid ${T.b2}`,background:T.bg,color:T.mt,cursor:"pointer",fontWeight:500}}>Load Sample</button><button onClick={()=>doAudit(html,"")} disabled={!html.trim()} style={{padding:"10px 24px",fontSize:12,borderRadius:10,border:`2px solid ${T.teal}`,background:html.trim()?T.teal:"transparent",color:html.trim()?T.w:T.teal,cursor:html.trim()?"pointer":"default",fontWeight:700,boxShadow:html.trim()?`0 4px 14px rgba(13,115,119,.25)`:"none"}}>▶ Audit</button></div></div><textarea value={html} onChange={e=>{setHtml(e.target.value);setResults(null)}} placeholder="Paste HTML…" aria-label="HTML source" style={{width:"100%",minHeight:130,maxHeight:250,padding:"16px 18px",background:T.bg,border:`1.5px solid ${T.b1}`,borderRadius:14,color:T.ink,fontFamily:T.mono,fontSize:13,lineHeight:1.65,resize:"vertical",boxSizing:"border-box"}}/></div>}
    </section>
    <WaveDecor/>

    {/* ── RESULTS ── */}
    {results&&<><nav style={{display:"flex",borderBottom:`1px solid ${T.b1}`,padding:"0 22px",overflowX:"auto",background:T.w}} role="tablist">{TABS.map(t=><button key={t.k} role="tab" aria-selected={tab===t.k} className={`tab-b${tab===t.k?" on":""}`} onClick={()=>setTab(t.k)}><span style={{fontSize:14}}>{t.i}</span>{t.l}</button>)}</nav>
    <div style={{padding:"28px 30px",minHeight:300}} className="fade">

    {/* DASHBOARD */}
    {tab==="dashboard"&&<div>
      {/* Hero score */}
      <div style={{background:T.w,borderRadius:22,border:`1px solid ${T.b1}`,padding:"36px 30px",marginBottom:20,boxShadow:"0 4px 16px rgba(28,25,23,.04),0 16px 48px rgba(28,25,23,.04)",position:"relative",overflow:"hidden",textAlign:"center"}}>
        <HexGrid w={800} h={300}/>
        <div style={{position:"relative"}}>
          <Donut value={stats.score} size={140} strokeW={10} sublabel="score"/>
          <p style={{fontSize:14,color:T.dm,marginTop:10}}>Scanned <strong style={{color:T.ink}}>{stats.total}</strong> WCAG 2.2 criteria across A, AA, and AAA levels</p>
        </div>
      </div>

      {/* Stat Cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))",gap:12,marginBottom:24}}>
        {[[stats.total,T.ink,"Rules",<HexIcon size={20}/>],[stats.passed,T.teal,"Passed",<svg width="16" height="16" viewBox="0 0 16 16" fill={T.teal}><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm3.5 5.3l-4 5a.75.75 0 01-1.1.1L4.5 8.5a.75.75 0 011-1.1l1.4 1.2 3.5-4.4a.75.75 0 011.1 1.1z"/></svg>],[stats.issues,T.rose,"Issues",<svg width="16" height="16" viewBox="0 0 16 16" fill={T.rose}><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3a1 1 0 011 1v3a1 1 0 01-2 0V5a1 1 0 011-1zm0 7a1 1 0 100-2 1 1 0 000 2z"/></svg>],[stats.crit,T.rose,"Critical"],[stats.maj,T.peach,"Major"],[stats.min,T.navy,"Minor"]].map(([v,c,l,icon],i)=><AnimStat key={l} value={v} color={c} label={l} icon={icon}/>)}
      </div>

      {/* POUR Cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:14,marginBottom:20}}>
        {["Perceivable","Operable","Understandable","Robust"].map(p=>{const d=princ[p]||{};const c=d.s>=80?T.teal:d.s>=50?T.peach:T.rose;return<div key={p} className="card" style={{padding:"22px 24px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <POURIcon principle={p} size={36}/>
            <div><div style={{fontSize:15,fontWeight:700}}>{p}</div><div style={{fontSize:11,color:T.dm}}>{d.p}/{d.t} passed</div></div>
          </div>
          <GlowBar value={d.s} color={c} label="" detail=""/>
        </div>})}
      </div>

      {/* Level Donuts */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14}}>
        {["A","AA","AAA"].map(lv=>{const R=results.filter(r=>r.l===lv);const p=R.filter(r=>r.ok).length;const pct=R.length?Math.round(p/R.length*100):100;return<div key={lv} className="card" style={{textAlign:"center",padding:24}}>
          <Donut value={pct} size={70} strokeW={6}/>
          <div style={{fontSize:13,color:T.ink,marginTop:10,fontWeight:700}}>Level {lv}</div>
          <div style={{fontSize:12,color:T.dm,fontFamily:T.mono}}>{p} / {R.length}</div>
        </div>})}
      </div>
    </div>}

    {/* AUDIT */}
    {tab==="audit"&&<div>
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}} role="group" aria-label="Filters">{[["Level",fL,setFL,["ALL","A","AA","AAA"]],["Status",fS,setFS,["ALL","ISSUES","PASSED"]],["Principle",fP,setFP,["ALL","Perceivable","Operable","Understandable","Robust"]]].map(([l,v,s,o])=><div key={l} style={{display:"flex",alignItems:"center",gap:5}}><label style={{fontSize:10,color:T.dm,textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</label><select value={v} onChange={e=>s(e.target.value)} style={{padding:"8px 12px",fontSize:12,borderRadius:10,border:`1px solid ${T.b1}`,background:T.bg,color:T.ink,cursor:"pointer",minHeight:40}}>{o.map(x=><option key={x}>{x}</option>)}</select></div>)}</div>
      <div style={{display:"flex",flexDirection:"column",gap:6}} role="list">{filtered.map(rule=>{const isO=exp===rule.id;const ic=rule.issues.filter(i=>i.s!==SV.I).length;return<div key={rule.id} className="card" role="listitem">
        <button className="row-b" onClick={()=>setExp(isO?null:rule.id)} aria-expanded={isO}>
          <span style={{width:10,height:10,borderRadius:"50%",background:rule.ok?T.teal:T.rose,flexShrink:0,boxShadow:`0 0 0 3px ${rule.ok?T.ts:T.rs}`}} aria-hidden="true"/>
          <span style={{fontFamily:T.mono,fontSize:12,color:T.teal,fontWeight:600,minWidth:44}}>{rule.id}</span>
          <span style={{fontWeight:500,flex:1}}>{rule.n}</span>
          <span style={pill(rule.l==="AAA"?"#6d28d9":rule.l==="AA"?T.navy:T.teal,rule.l==="AAA"?"rgba(109,40,217,.06)":rule.l==="AA"?T.ns:T.ts)}>{rule.l}</span>
          {ic>0&&<span style={{fontFamily:T.mono,fontSize:11,color:T.w,fontWeight:700,background:T.rose,padding:"3px 9px",borderRadius:20,minWidth:20,textAlign:"center"}}>{ic}</span>}
          <svg width="12" height="12" viewBox="0 0 12 12" fill={T.dm} style={{transform:isO?"rotate(90deg)":"none",transition:`transform .2s ${T.ease}`}} aria-hidden="true"><path d="M4 2l4 4-4 4" strokeWidth="1"/></svg>
        </button>
        {isO&&<div className="fade" style={{borderTop:`1px solid ${T.b1}`,padding:"18px 22px",background:T.bg}}>
          {rule.issues.length===0?<div style={{display:"flex",alignItems:"center",gap:8,fontSize:14,color:T.teal,fontWeight:600}}>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke={T.teal} strokeWidth="2"/><path d="M6 10l3 3 5-5" stroke={T.teal} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            No issues — this criterion passes
          </div>:
          <div style={{display:"flex",flexDirection:"column",gap:14}}>{rule.issues.map((issue,idx)=>{const isI=issue.s===SV.I;const rec=!isI?getRec(rule.id,issue):null;return<div key={idx} style={{background:SB[issue.s],borderRadius:16,padding:"18px 22px",borderLeft:`4px solid ${SC[issue.s]}`}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
              <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:24,height:24,borderRadius:8,background:SC[issue.s]+"15",color:SC[issue.s],fontSize:12,fontWeight:800,fontFamily:T.mono}}>{issue.s==="critical"?"✕":issue.s==="major"?"!":"–"}</span>
              <span style={pill(SC[issue.s],"transparent")}>{issue.s}</span>
              {rec&&<span style={{fontSize:9,fontWeight:700,padding:"3px 10px",borderRadius:20,background:`${PC[rec.p]}08`,color:PC[rec.p],border:`1px solid ${PC[rec.p]}18`}}>{PLBL[rec.p]?.split("—")[0]}</span>}
              {rec&&<span style={{fontSize:9,fontWeight:600,padding:"3px 10px",borderRadius:20,background:T.gs,color:T.green}}>{rec.e}</span>}
            </div>
            <p style={{fontSize:14.5,margin:"0 0 6px",lineHeight:1.65}}>{issue.msg}</p>
            {issue.el&&issue.el!=="—"&&<code style={{display:"block",fontSize:12,color:T.mt,background:T.bg2,padding:"10px 16px",borderRadius:12,marginBottom:6,wordBreak:"break-all",fontFamily:T.mono,lineHeight:1.55}}>{issue.el}</code>}
            <div style={{fontSize:13,color:T.teal,display:"flex",alignItems:"flex-start",gap:6,fontWeight:600}}><span style={{fontSize:16}}>⮕</span><span style={{lineHeight:1.55}}>{issue.fix}</span></div>
            {rec&&<RecCard rec={rec}/>}
          </div>})}</div>}
        </div>}
      </div>})}</div>
    </div>}

    {/* PRIORITY */}
    {tab==="priority"&&<div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}><HexIcon size={36}/><h2 style={{margin:0,fontFamily:T.serif,fontSize:24}}>Implementation Roadmap</h2></div>
      {allIssues.length===0?<div className="card" style={{padding:32,textAlign:"center"}}><svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke={T.teal} strokeWidth="3"/><path d="M15 24l6 6 12-12" stroke={T.teal} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg><p style={{fontSize:18,color:T.teal,fontWeight:600,marginTop:12}}>All criteria passed!</p></div>:
      <div style={{display:"flex",flexDirection:"column",gap:14}}>{[1,2,3,4].map(p=>{const items=allIssues.filter(i=>i.rec.p===p);if(!items.length)return null;return<div key={p} className="card">
        <div style={{padding:"16px 22px",borderBottom:`1px solid ${T.b1}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{width:10,height:10,borderRadius:"50%",background:PC[p],boxShadow:`0 0 0 3px ${PC[p]}15`}}/><span style={{fontSize:15,fontWeight:700,color:PC[p]}}>{PLBL[p]}</span></div>
          <span style={{fontSize:12,color:T.dm,fontFamily:T.mono,fontWeight:600,padding:"4px 12px",borderRadius:20,background:T.bg2}}>{items.length}</span>
        </div>
        <div style={{padding:"10px 22px"}}>{items.map((i,j)=><div key={j} style={{display:"flex",gap:10,padding:"12px 0",borderBottom:j<items.length-1?`1px solid ${T.b1}`:"none"}}>
          <span style={{fontFamily:T.mono,fontSize:11,color:T.teal,fontWeight:600,minWidth:42,paddingTop:3}}>{i.ruleId}</span>
          <div style={{flex:1}}>
            <p style={{fontSize:14,margin:"0 0 5px",lineHeight:1.55}}>{i.msg}</p>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:22,height:22,borderRadius:6,background:SC[i.s]+"15",color:SC[i.s],fontSize:10,fontWeight:800,fontFamily:T.mono}}>{i.s==="critical"?"✕":"!"}</span>
              <span style={{fontSize:9,fontWeight:600,padding:"4px 10px",borderRadius:20,background:T.gs,color:T.green}}>{i.rec.e}</span>
            </div>
          </div>
        </div>)}</div>
      </div>})}</div>}
    </div>}

    {tab==="contrast"&&<ContrastChecker/>}

    {tab==="preview"&&<div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}><HexIcon size={36}/><h2 style={{margin:0,fontFamily:T.serif,fontSize:24}}>Side-by-Side Preview</h2></div>
      <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>{[["Original",T.rose,pRef],["Remediated",T.green,rRef]].map(([l,c,ref])=><div key={l} style={{flex:1,minWidth:250}}>
        <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".08em",fontWeight:700,color:c,marginBottom:8,display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:c,boxShadow:`0 0 0 3px ${c}20`}}/>{l}</div>
        <iframe ref={ref} sandbox="allow-same-origin" style={{width:"100%",height:320,border:`1px solid ${T.b1}`,borderRadius:16,background:T.w,boxShadow:"0 2px 8px rgba(28,25,23,.03),0 8px 28px rgba(28,25,23,.05)"}} title={l}/>
      </div>)}</div>
    </div>}

    {tab==="export"&&<ExportTab results={results} stats={stats} scUrl={scUrl} allIssues={allIssues}/>}

    </div></>}

    {/* ── EMPTY STATE ── */}
    {!results&&fSt!=="loading"&&<div style={{padding:"80px 30px",textAlign:"center",position:"relative"}}>
      <div style={{marginBottom:24,position:"relative",display:"inline-block"}}>
        <svg width="120" height="120" viewBox="0 0 120 120" fill="none" aria-hidden="true">
          <circle cx="60" cy="60" r="54" stroke={T.b3} strokeWidth="1.5" strokeDasharray="6 4"/>
          <circle cx="60" cy="60" r="40" stroke={T.teal} strokeWidth="1.5" opacity=".2"/>
          <circle cx="60" cy="60" r="26" stroke={T.teal} strokeWidth="1" opacity=".1"/>
          <path d="M45 60l10 10 20-20" stroke={T.teal} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" opacity=".3"/>
          <path d="M60 6L72 13V25L60 32L48 25V13Z" fill="none" stroke={T.teal} strokeWidth="1" opacity=".15"/>
          <path d="M92 30L100 35V43L92 48L84 43V35Z" fill="none" stroke={T.teal} strokeWidth="1" opacity=".1"/>
          <path d="M28 80L36 85V93L28 98L20 93V85Z" fill="none" stroke={T.teal} strokeWidth="1" opacity=".1"/>
        </svg>
      </div>
      <h2 style={{fontSize:28,color:T.ink2,marginBottom:8,fontFamily:T.serif,fontWeight:700}}>Enter a URL or paste HTML</h2>
      <p style={{fontSize:15,color:T.dm,lineHeight:1.7,maxWidth:460,margin:"0 auto 20px"}}>{RULES.length} WCAG 2.2 criteria across A, AA, and AAA conformance levels with visual before/after examples, code fixes, and prioritized roadmap.</p>
      <div style={{display:"flex",justifyContent:"center",gap:10,flexWrap:"wrap"}}>
        {["Perceivable","Operable","Understandable","Robust"].map(p=><div key={p} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",borderRadius:20,background:T.ts,border:`1px solid ${T.tm}`}}>
          <POURIcon principle={p} size={18}/>
          <span style={{fontSize:12,fontWeight:600,color:T.teal}}>{p}</span>
        </div>)}
      </div>
    </div>}

    {/* ── FOOTER ── */}
    <footer style={{borderTop:`1px solid ${T.b1}`,padding:"20px 30px",marginTop:40,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <HexIcon size={28}/>
        <div style={{fontSize:12,color:T.dm}}>Built by <a href="https://www.brainpulseinc.com" style={{color:T.teal,textDecoration:"none",fontWeight:600}}>BrainPulse Inc</a></div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 14px",borderRadius:20,background:T.ts,border:`1px solid ${T.tm}`}}>
        <svg width="14" height="14" viewBox="0 0 16 16" fill={T.teal}><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm3.5 5.3l-4 5a.75.75 0 01-1.1.1L4.5 8.5a.75.75 0 011-1.1l1.4 1.2 3.5-4.4a.75.75 0 011.1 1.1z"/></svg>
        <span style={{fontSize:11,fontWeight:600,color:T.teal}}>This tool is WCAG 2.2 AAA compliant</span>
      </div>
    </footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
