body{font-family:var(--f2);background:var(--bg);color:var(--tx);min-height:100vh}

const NAMED={white:[255,255,255],black:[0,0,0],red:[255,0,0],green:[0,128,0],blue:[0,0,255],yellow:[255,255,0],gray:[128,128,128],grey:[128,128,128],orange:[255,165,0],purple:[128,0,128],pink:[255,192,203],navy:[0,0,128],teal:[0,128,128],maroon:[128,0,0],lime:[0,255,0],aqua:[0,255,255],silver:[192,192,192],transparent:[255,255,255]};
function parseColor(s){if(!s)return null;s=s.trim().toLowerCase();if(NAMED[s])return NAMED[s];let m=s.match(/^#([0-9a-f]{3,8})$/);if(m){let h=m[1];if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}m=s.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);if(m)return[+m[1],+m[2],+m[3]];return null}

function CR(a,b){const l1=relLum(a),l2=relLum(b);return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)}

/* ═══ URL FETCH ═══ */
function fetchWithTimeout(proxyUrl, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(proxyUrl, { signal: controller.signal }).finally(() => clearTimeout(timer));
}
async function fetchURL(url) {
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const enc = encodeURIComponent(url);
  const strategies = [
    { name:'allorigins-raw', url:`https://api.allorigins.win/raw?url=${enc}`, mode:'text' },
    { name:'codetabs', url:`https://api.codetabs.com/v1/proxy?quest=${enc}`, mode:'text' },
    { name:'allorigins-json', url:`https://api.allorigins.win/get?url=${enc}`, mode:'json' },
    { name:'corsproxy', url:`https://corsproxy.io/?${enc}`, mode:'text' },
  ];
  const tried = [];
  for (const s of strategies) {
    try {
      const resp = await fetchWithTimeout(s.url, 12000);
      if (!resp.ok) { tried.push(`${s.name}: HTTP ${resp.status}`); continue; }
      let html = '';
      if (s.mode === 'json') {
        const json = await resp.json();
        html = json.contents || json.content || json.data || '';
      } else {
        html = await resp.text();
      }
      if (html.length > 100 && (html.includes('<') || html.includes('<!') || html.includes('html'))) {
        return { ok: true, html, url, proxy: s.name };
      }
      tried.push(`${s.name}: response too short (${html.length} chars)`);
    } catch (e) {
      tried.push(`${s.name}: ${e.name === 'AbortError' ? 'timeout' : 'failed'}`);
    }
  }
  return { ok: false, html: '', url, error: `Could not fetch URL through ${tried.length} proxy strategies (${tried.join('; ')}). Try: Right-click the page → "View Page Source" → Ctrl+A → Ctrl+C → paste in the HTML tab.` };
}

function getRecommendation(ruleId, issue) {
  const db = REC_DB[ruleId] || REC_DB["_default"];
  const fix = db.genFix(issue.el || '');
  return { explanation: db.explanation, designTip: db.designTip, effort: db.effort, priority: db.priority, ...fix };
}

/* ═══════════════════════════════════════════════════════════════════

const S={C:"critical",M:"major",m:"minor",I:"info"};
const SC_={critical:"#ff4570",major:"#ffaa30",minor:"#4cacff",info:"#4d5b73"};
const SB_={critical:"rgba(255,69,112,.07)",major:"rgba(255,170,48,.07)",minor:"rgba(76,172,255,.07)",info:"rgba(77,91,115,.05)"};
const RULES=[
{id:"1.1.1",name:"Non-text Content",level:"A",p:"Perceivable",check(d){const r=[];d.querySelectorAll("img").forEach((e,i)=>{if(!e.getAttribute("alt")&&e.getAttribute("alt")!=="")r.push({s:S.C,el:e.outerHTML.substring(0,150),msg:`Image #${i+1} missing alt attribute`,fix:`Add alt="description" or alt="" for decorative`})});d.querySelectorAll("svg").forEach((e,i)=>{if(!e.getAttribute("role")&&!e.querySelector("title"))r.push({s:S.M,el:"<svg>",msg:`SVG #${i+1} missing accessible name`,fix:`Add role="img" aria-label or <title>`})});d.querySelectorAll("input[type='image']").forEach((e,i)=>{if(!e.getAttribute("alt"))r.push({s:S.C,el:e.outerHTML.substring(0,150),msg:`Image input #${i+1} missing alt`,fix:`Add alt="description"`})});d.querySelectorAll("canvas,object,embed,video,audio").forEach((e,i)=>{if(!e.getAttribute("aria-label")&&!e.getAttribute("aria-labelledby")&&!e.textContent?.trim())r.push({s:S.M,el:`<${e.tagName.toLowerCase()}>`,msg:`${e.tagName} #${i+1} missing text alternative`,fix:`Add aria-label`})});return r}},
{id:"1.3.1",name:"Info and Relationships",level:"A",p:"Perceivable",check(d){const r=[];d.querySelectorAll("table").forEach((t,i)=>{if(!t.querySelector("th,[role='columnheader']"))r.push({s:S.M,el:"<table>",msg:`Table #${i+1} has no headers`,fix:`Use <th scope="col/row">`});if(!t.querySelector("caption")&&!t.getAttribute("aria-label")&&!t.getAttribute("aria-labelledby"))r.push({s:S.m,el:"<table>",msg:`Table #${i+1} missing caption`,fix:`Add <caption> or aria-label`})});d.querySelectorAll("fieldset").forEach((f,i)=>{if(!f.querySelector("legend"))r.push({s:S.M,el:"<fieldset>",msg:`Fieldset #${i+1} missing <legend>`,fix:`Add <legend>`})});return r}},
{id:"1.3.5",name:"Identify Input Purpose",level:"AA",p:"Perceivable",check(d){const r=[];d.querySelectorAll("input[type='text'],input[type='email'],input[type='tel'],input:not([type]),input[type='password']").forEach(e=>{if(!e.getAttribute("autocomplete")){const n=e.getAttribute("name")||e.getAttribute("id")||"";if(/name|email|phone|tel|address|zip|password|user/i.test(n))r.push({s:S.m,el:e.outerHTML.substring(0,150),msg:`Input "${n}" lacks autocomplete`,fix:`Add autocomplete="..."`})}});return r}},
{id:"1.4.3",name:"Contrast (Minimum)",level:"AA",p:"Perceivable",check(d){const r=[];let c=0;d.querySelectorAll("p,span,a,li,td,th,h1,h2,h3,h4,h5,h6,label,button,div").forEach(e=>{if(c>60)return;const st=e.getAttribute("style")||"";const cm=st.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);const bm=st.match(/background(?:-color)?\s*:\s*([^;]+)/i);if(cm&&bm){c++;const fg=parseColor(cm[1].trim()),bg=parseColor(bm[1].trim());if(fg&&bg){const r8=CR(fg,bg);if(r8<4.5)r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Contrast ${r8.toFixed(2)}:1 — needs ≥7:1 (AAA)`,fix:`Darken text or lighten background`});else if(r8<7)r.push({s:S.m,el:e.outerHTML.substring(0,120),msg:`Contrast ${r8.toFixed(2)}:1 — passes AA, fails AAA`,fix:`Increase to ≥7:1`})}}});return r}},
{id:"1.4.6",name:"Contrast Enhanced (AAA)",level:"AAA",p:"Perceivable",check(){return[{s:S.I,el:"—",msg:`AAA: 7:1 normal, 4.5:1 large text`,fix:`Audit all color pairs`}]}},
{id:"1.4.8",name:"Visual Presentation (AAA)",level:"AAA",p:"Perceivable",check(d){const r=[];d.querySelectorAll("p,div,span,li,td,section,article").forEach(e=>{const st=e.getAttribute("style")||"";if(/text-align\s*:\s*justify/i.test(st))r.push({s:S.M,el:e.outerHTML.substring(0,100),msg:`Justified text — AAA prohibits`,fix:`text-align: left`});const lh=st.match(/line-height\s*:\s*([0-9.]+)/i);if(lh&&parseFloat(lh[1])<1.5&&!lh[0].includes("px"))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Line-height ${lh[1]} < AAA min 1.5`,fix:`line-height ≥ 1.5`})});return r}},
{id:"1.4.10",name:"Reflow",level:"AA",p:"Perceivable",check(d){const r=[];const m=d.querySelector('meta[name="viewport"]');if(m){const c=m.getAttribute("content")||"";if(/maximum-scale\s*=\s*1/i.test(c)||/user-scalable\s*=\s*no/i.test(c))r.push({s:S.C,el:m.outerHTML,msg:`Viewport restricts zoom`,fix:`Remove zoom restrictions`})}return r}},
{id:"1.4.12",name:"Text Spacing",level:"AA",p:"Perceivable",check(d){const r=[];d.querySelectorAll('[style*="overflow"]').forEach(e=>{const st=e.getAttribute("style")||"";if(/overflow\s*:\s*hidden/i.test(st)&&/height\s*:\s*\d+px/i.test(st))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`overflow:hidden + fixed height may clip text`,fix:`Use min-height + overflow:auto`})});return r}},
{id:"2.1.1",name:"Keyboard",level:"A",p:"Operable",check(d){const r=[];d.querySelectorAll("[onclick],[onmousedown]").forEach((e,i)=>{if(!e.getAttribute("onkeydown")&&!["A","BUTTON","INPUT","SELECT","TEXTAREA","SUMMARY"].includes(e.tagName))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Element #${i+1} has mouse-only handler`,fix:`Use <button> or add keyboard handlers`})});d.querySelectorAll("div[onclick],span[onclick],div[role='button']").forEach((e,i)=>{if(!e.getAttribute("tabindex"))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Clickable element not focusable`,fix:`Add tabindex="0" or use <button>`})});return r}},
{id:"2.4.1",name:"Bypass Blocks",level:"A",p:"Operable",check(d){const r=[];if(!d.querySelector('a[href^="#main"],a[href^="#content"],[class*="skip"],[id*="skip"]')&&!d.querySelector("main,[role='main']"))r.push({s:S.M,el:"—",msg:`No skip link or <main> landmark`,fix:`Add skip link + <main>`});const lm=d.querySelectorAll("header,[role='banner'],nav,[role='navigation'],main,[role='main'],footer,[role='contentinfo']");if(lm.length===0&&d.querySelectorAll("div").length>5)r.push({s:S.M,el:"—",msg:`No ARIA landmarks`,fix:`Use <header>,<nav>,<main>,<footer>`});return r}},
{id:"2.4.2",name:"Page Titled",level:"A",p:"Operable",check(d){const r=[];const t=d.querySelector("title");if(!t||!t.textContent?.trim())r.push({s:S.M,el:"<head>",msg:`Missing <title>`,fix:`Add descriptive <title>`});return r}},
{id:"2.4.4",name:"Link Purpose (Context)",level:"A",p:"Operable",check(d){const r=[];const vague=["click here","here","read more","more","link","this","learn more"];d.querySelectorAll("a").forEach((a,i)=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();if(vague.includes(t))r.push({s:S.M,el:a.outerHTML.substring(0,120),msg:`Link "${t}" is ambiguous`,fix:`Use descriptive text`});if(!t&&!a.querySelector("img[alt]"))r.push({s:S.C,el:a.outerHTML.substring(0,120),msg:`Link #${i+1} has no text`,fix:`Add text or aria-label`})});return r}},
{id:"2.4.6",name:"Headings and Labels",level:"AA",p:"Operable",check(d){const r=[];const hs=d.querySelectorAll("h1,h2,h3,h4,h5,h6");let prev=0,h1c=0;hs.forEach(h=>{const l=+h.tagName[1];if(l===1)h1c++;if(prev>0&&l>prev+1)r.push({s:S.M,el:h.outerHTML.substring(0,100),msg:`Heading skips h${prev}→h${l}`,fix:`Use sequential levels`});if(!h.textContent?.trim())r.push({s:S.M,el:h.outerHTML.substring(0,100),msg:`Empty heading h${l}`,fix:`Add text or remove`});prev=l});if(h1c===0&&hs.length>0)r.push({s:S.M,el:"—",msg:`No <h1>`,fix:`Add <h1>`});if(h1c>1)r.push({s:S.m,el:"—",msg:`Multiple <h1> (${h1c})`,fix:`Single <h1>`});return r}},
{id:"2.4.7",name:"Focus Visible",level:"AA",p:"Operable",check(d){const r=[];let has=false;d.querySelectorAll("style").forEach(s=>{if(/outline\s*:\s*(none|0)/i.test(s.textContent||""))has=true});d.querySelectorAll("[style]").forEach(e=>{if(/outline\s*:\s*(none|0)/i.test(e.getAttribute("style")||""))has=true});if(has)r.push({s:S.M,el:"—",msg:`outline:none removes focus visibility`,fix:`Use :focus-visible with custom styles`});return r}},
{id:"2.4.9",name:"Link Purpose (AAA)",level:"AAA",p:"Operable",check(d){const r=[];const map={};d.querySelectorAll("a[href]").forEach(a=>{const t=(a.getAttribute("aria-label")||a.textContent||"").trim().toLowerCase();const h=a.getAttribute("href");if(t&&h){if(map[t]&&map[t]!==h)r.push({s:S.m,el:a.outerHTML.substring(0,120),msg:`"${t}" → different URLs`,fix:`Same text = same destination`});map[t]=h}});return r}},
{id:"2.4.11",name:"Focus Not Obscured",level:"AA",p:"Operable",check(d){const r=[];d.querySelectorAll('[style*="position"]').forEach(e=>{const st=e.getAttribute("style")||"";if(/position\s*:\s*(fixed|sticky)/i.test(st)&&/z-index/i.test(st))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Fixed element may obscure focus`,fix:`Ensure focus is never hidden behind fixed elements`})});return r}},
{id:"2.5.3",name:"Label in Name",level:"A",p:"Operable",check(d){const r=[];d.querySelectorAll("button[aria-label],a[aria-label]").forEach(e=>{const al=(e.getAttribute("aria-label")||"").toLowerCase();const vt=(e.textContent||"").trim().toLowerCase();if(vt&&al&&!al.includes(vt))r.push({s:S.M,el:e.outerHTML.substring(0,120),msg:`aria-label doesn't contain visible text`,fix:`Include visible text in aria-label`})});return r}},
{id:"2.5.8",name:"Target Size",level:"AA",p:"Operable",check(d){const r=[];d.querySelectorAll("a,button,[role='button']").forEach(e=>{const st=e.getAttribute("style")||"";const wm=st.match(/width\s*:\s*(\d+)px/i);const hm=st.match(/height\s*:\s*(\d+)px/i);if(wm&&hm&&(+wm[1]<24||+hm[1]<24))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Target may be < 24×24px`,fix:`Min 24×24px (44×44px for AAA)`})});return r}},
{id:"3.1.1",name:"Language of Page",level:"A",p:"Understandable",check(d){const r=[];const h=d.querySelector("html");if(h&&!h.getAttribute("lang"))r.push({s:S.C,el:"<html>",msg:`Missing lang attribute`,fix:`Add lang="en"`});return r}},
{id:"3.1.2",name:"Language of Parts",level:"AA",p:"Understandable",check(d){const r=[];d.querySelectorAll("[lang]").forEach(e=>{const l=e.getAttribute("lang");if(l&&!/^[a-z]{2,3}(-[A-Za-z]{2,4})?$/.test(l))r.push({s:S.m,el:e.outerHTML.substring(0,100),msg:`Invalid lang="${l}"`,fix:`Use BCP 47 code`})});return r}},
{id:"3.2.2",name:"On Input",level:"A",p:"Understandable",check(d){const r=[];d.querySelectorAll("select[onchange]").forEach((e,i)=>{if(/location|navigate|href|window\.open/i.test(e.getAttribute("onchange")||""))r.push({s:S.M,el:e.outerHTML.substring(0,120),msg:`Auto-navigates on change`,fix:`Use submit button`})});return r}},
{id:"3.3.2",name:"Labels or Instructions",level:"A",p:"Understandable",check(d){const r=[];d.querySelectorAll("input:not([type='hidden']):not([type='submit']):not([type='button']):not([type='reset']):not([type='image']),select,textarea").forEach((e,i)=>{const id=e.getAttribute("id");const has=id&&d.querySelector(`label[for="${id}"]`);if(!has&&!e.closest("label")&&!e.getAttribute("aria-label")&&!e.getAttribute("aria-labelledby")&&!e.getAttribute("title"))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Form control #${i+1} unlabeled`,fix:`Add <label for="id"> or aria-label`})});return r}},
{id:"4.1.1",name:"Parsing / Duplicate IDs",level:"A",p:"Robust",check(d){const r=[];const ids={};d.querySelectorAll("[id]").forEach(e=>{const id=e.getAttribute("id");if(ids[id])r.push({s:S.M,el:e.outerHTML.substring(0,100),msg:`Duplicate id="${id}"`,fix:`IDs must be unique`});ids[id]=true});return r}},
{id:"4.1.2",name:"Name, Role, Value",level:"A",p:"Robust",check(d){const r=[];const valid=new Set(["alert","alertdialog","application","article","banner","button","cell","checkbox","columnheader","combobox","complementary","contentinfo","definition","dialog","directory","document","feed","figure","form","grid","gridcell","group","heading","img","link","list","listbox","listitem","log","main","marquee","math","menu","menubar","menuitem","menuitemcheckbox","menuitemradio","navigation","none","note","option","presentation","progressbar","radio","radiogroup","region","row","rowgroup","rowheader","scrollbar","search","searchbox","separator","slider","spinbutton","status","switch","tab","table","tablist","tabpanel","term","textbox","timer","toolbar","tooltip","tree","treegrid","treeitem"]);d.querySelectorAll("[role]").forEach(e=>{const role=e.getAttribute("role");if(!valid.has(role))r.push({s:S.M,el:e.outerHTML.substring(0,100),msg:`Invalid role="${role}"`,fix:`Use valid ARIA role`})});d.querySelectorAll("[aria-hidden='true']").forEach(e=>{if(e.querySelector("a[href],button,input,select,textarea,[tabindex]:not([tabindex='-1'])"))r.push({s:S.C,el:e.outerHTML.substring(0,120),msg:`Focusable inside aria-hidden`,fix:`Remove aria-hidden or defocus children`})});return r}},

function analyze(html){const p=new DOMParser();const d=p.parseFromString(html,"text/html");return RULES.map(r=>{const issues=r.check(d);return{...r,issues,passed:issues.filter(i=>i.s!==S.I).length===0}})}
function autoFix(html){let f=html;if(/<html(?![^>]*\slang\s*=)/i.test(f))f=f.replace(/<html/i,'<html lang="en"');f=f.replace(/user-scalable\s*=\s*no/gi,"user-scalable=yes");f=f.replace(/maximum-scale\s*=\s*1(?:\.0)?/gi,"maximum-scale=5.0");f=f.replace(/text-align\s*:\s*justify/gi,"text-align: left");return f}

function RecCard({rec,ruleId,issue}){

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6,marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <span style={{color:"var(--ac)",fontSize:13}}>✦</span>
          <span style={{fontSize:10,fontWeight:700,color:"var(--ac)",letterSpacing:".05em",textTransform:"uppercase"}}>Recommendation</span>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <PriorityBadge p={r.priority}/>
          <span style={{fontSize:9,padding:"3px 8px",borderRadius:4,background:"rgba(52,211,153,.1)",color:"#34d399",fontWeight:600}}>{r.effort}</span>
        </div>
      </div>
      <p style={{fontSize:12.5,color:"var(--tx)",margin:"0 0 10px",lineHeight:1.65}}>{r.explanation}</p>
      <div style={{background:"rgba(15,240,212,.05)",borderRadius:7,padding:"9px 13px",borderLeft:"3px solid var(--ac)"}}>
        <div style={{fontSize:9,textTransform:"uppercase",color:"var(--ac)",fontWeight:700,marginBottom:3}}>Design Suggestion</div>
        <p style={{fontSize:12,color:"var(--tx2)",margin:0,lineHeight:1.6}}>{r.designTip}</p>
      </div>
    </div>
    {/* Visual Before/After */}
    {r.beforeHtml&&r.afterHtml&&<div style={{borderTop:"1px solid rgba(15,240,212,.08)",padding:"14px 18px",background:"rgba(0,0,0,.15)"}}>
      <div style={{fontSize:10,fontWeight:700,color:"var(--tx3)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>Visual Before → After</div>
      <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:200}}>
          <div className="ba-label" style={{color:"var(--rd)"}}><span style={{background:"var(--rd)"}}/>Before</div>
          <div className="preview-frame" dangerouslySetInnerHTML={{__html:r.beforeHtml}}/>
        </div>
        <div style={{flex:1,minWidth:200}}>
          <div className="ba-label" style={{color:"var(--gn)"}}><span style={{background:"var(--gn)"}}/>After</div>
          <div className="preview-frame" dangerouslySetInnerHTML={{__html:r.afterHtml}}/>
        </div>
      </div>
    </div>}
    {/* Code Fix */}
    {r.before&&r.after&&<div style={{borderTop:"1px solid rgba(15,240,212,.08)"}}>
      <div style={{padding:"10px 18px 0"}}>
        <span style={{fontSize:9,textTransform:"uppercase",color:"var(--tx3)",fontWeight:700,letterSpacing:".05em"}}>Code Fix</span>
      </div>
      <div style={{display:"flex",gap:0,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:200}}>
          <pre style={{fontSize:10.5,color:"#ffa0b0",background:"rgba(255,69,112,.06)",padding:"10px 18px",margin:0,whiteSpace:"pre-wrap",wordBreak:"break-all",fontFamily:"var(--f3)",lineHeight:1.55,maxHeight:140,overflow:"auto",borderRight:"1px solid rgba(140,160,200,.05)"}}>{r.before}</pre>
        </div>
        <div style={{flex:1,minWidth:200}}>
          <pre style={{fontSize:10.5,color:"#a8f0e0",background:"rgba(15,240,212,.04)",padding:"10px 18px",margin:0,whiteSpace:"pre-wrap",wordBreak:"break-all",fontFamily:"var(--f3)",lineHeight:1.55,maxHeight:140,overflow:"auto"}}>{r.after}</pre>
        </div>
      </div>
    </div>}
  </div>;
}

function ContrastChecker(){const[fg,setFg]=useState("#555");const[bg,setBg]=useState("#fff");const fr=parseColor(fg),br=parseColor(bg);const r=fr&&br?CR(fr,br):null;const t=r?[["AA",r>=4.5,"≥4.5"],["AA Lg",r>=3,"≥3"],["AAA",r>=7,"≥7"],["AAA Lg",r>=4.5,"≥4.5"]]:[];return<div style={{background:"var(--bg2)",borderRadius:12,border:"1px solid var(--bdr)",padding:22}}><h3 style={{margin:"0 0 16px",fontFamily:"var(--f1)",fontSize:19}}>Contrast Checker</h3><div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:18}}>{[["Foreground",fg,setFg],["Background",bg,setBg]].map(([l,v,s])=><label key={l} style={{display:"flex",flexDirection:"column",gap:5,flex:1,minWidth:140}}><span style={{fontSize:10,color:"var(--tx3)",textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</span><div style={{display:"flex",gap:7,alignItems:"center"}}><input type="color" value={v} onChange={e=>s(e.target.value)} style={{width:40,height:36,border:"none",cursor:"pointer",borderRadius:6}}/><input type="text" value={v} onChange={e=>s(e.target.value)} style={{flex:1,padding:"8px 11px",background:"var(--bg3)",border:"1px solid var(--bdr)",borderRadius:7,color:"var(--tx)",fontFamily:"var(--f3)",fontSize:12.5}}/></div></label>)}</div><div style={{background:br?bg:"#fff",color:fr?fg:"#000",padding:"20px 24px",borderRadius:9,marginBottom:16,border:"1px solid var(--bdr)"}}><div style={{fontSize:19,marginBottom:5,fontWeight:500}}>The quick brown fox jumps over the lazy dog</div><div style={{fontSize:13}}>Small text — 13px regular</div></div>{r!==null&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))",gap:7}}><div style={{textAlign:"center",padding:12,background:"var(--bg)",borderRadius:7}}><div style={{fontSize:28,fontFamily:"var(--f3)",fontWeight:700,color:r>=7?"var(--ac)":r>=4.5?"var(--or)":"var(--rd)"}}>{r.toFixed(2)}</div><div style={{fontSize:9,color:"var(--tx3)",marginTop:2,textTransform:"uppercase"}}>Ratio</div></div>{t.map(([l,pass,req])=><div key={l} style={{textAlign:"center",padding:12,background:pass?"rgba(15,240,212,.05)":"rgba(255,69,112,.05)",borderRadius:7,border:`1px solid ${pass?"rgba(15,240,212,.15)":"rgba(255,69,112,.15)"}`}}><div style={{fontSize:15,fontWeight:700,color:pass?"var(--ac)":"var(--rd)"}}>{pass?"PASS":"FAIL"}</div><div style={{fontSize:9,color:"var(--tx3)",marginTop:2}}>{l} {req}</div></div>)}</div>}</div>}

function HeadingOutline({html}){const h=useMemo(()=>{if(!html)return[];const d=new DOMParser().parseFromString(html,"text/html");const r=[];d.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(h=>r.push({level:+h.tagName[1],text:h.textContent?.trim()||"(empty)",tag:h.tagName}));return r},[html]);if(!h.length)return<div style={{padding:32,color:"var(--tx3)",textAlign:"center"}}>No headings found.</div>;let prev=0;return<div style={{background:"var(--bg2)",borderRadius:12,border:"1px solid var(--bdr)",padding:"18px 22px"}}><h3 style={{margin:"0 0 12px",fontFamily:"var(--f1)",fontSize:19}}>Heading Outline</h3>{h.map((h,i)=>{const skip=prev>0&&h.level>prev+1;prev=h.level;return<div key={i} style={{display:"flex",alignItems:"center",gap:7,paddingLeft:(h.level-1)*20,marginBottom:4}}><span style={{fontFamily:"var(--f3)",fontSize:10,padding:"2px 6px",borderRadius:4,background:skip?"rgba(255,69,112,.1)":"var(--ac2)",color:skip?"var(--rd)":"var(--ac)",fontWeight:600}}>{h.tag}</span><span style={{fontSize:12.5,color:h.text==="(empty)"?"var(--rd)":"var(--tx)"}}>{h.text}</span>{skip&&<span style={{fontSize:9,color:"var(--rd)",fontWeight:700}}>⚠ SKIP</span>}</div>})}</div>}

function LivePreview({html,label,color}){const ref=useRef(null);useEffect(()=>{if(!ref.current||!html)return;const d=ref.current.contentDocument;if(d){d.open();d.write(html);d.close()}},[html]);return<div style={{flex:1,minWidth:240}}><div className="ba-label" style={{color:color||"var(--tx3)"}}><span style={{background:color}}/>{label}</div><iframe ref={ref} sandbox="allow-same-origin" style={{width:"100%",height:320,border:"1px solid var(--bdr)",borderRadius:10,background:"#fff"}} title={label}/></div>}

const SAMPLE=`<!DOCTYPE html>\n<html>\n<head>\n  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">\n  <title></title>\n</head>\n<body>\n  <div onclick="navigate('/home')" style="cursor:pointer">Home</div>\n  <h1>Welcome</h1><h3>Quick Start</h3>\n  <p style="text-align:justify;line-height:1.1;color:#999;background-color:#fff">Poor contrast.</p>\n  <img src="hero.jpg"><a href="/about">Click here</a><a href="/contact"></a>\n  <form><input type="text" name="email"><input type="text" name="phone">\n  <select onchange="window.location=this.value"><option>Go</option></select>\n  <fieldset><input type="checkbox" id="agree"> I agree</fieldset></form>\n  <div id="sidebar" aria-hidden="true"><a href="/privacy">Privacy</a><button>Contact</button></div>\n  <div id="sidebar">Duplicate</div>\n  <table><tr><td>Product</td><td>Price</td></tr></table>\n  <svg width="100" height="100"><circle cx="50" cy="50" r="40" fill="blue"/></svg>\n</body></html>`;

/* ═══ MAIN APP ═══ */
const TABS=[{k:"audit",l:"Audit",i:"◉"},{k:"priority",l:"Priority",i:"⚡"},{k:"preview",l:"Preview",i:"◫"},{k:"contrast",l:"Contrast",i:"◑"},{k:"outline",l:"Outline",i:"≡"}];

function App(){
  const[mode,setMode]=useState("url");const[url,setUrl]=useState("");const[html,setHtml]=useState("");
  const[fSt,setFSt]=useState(null);const[fErr,setFErr]=useState("");const[scUrl,setScUrl]=useState("");
  const[results,setResults]=useState(null);const[tab,setTab]=useState("audit");
  const[fL,setFL]=useState("ALL");const[fS,setFS]=useState("ALL");const[fP,setFP]=useState("ALL");
  const[exp,setExp]=useState(null);const[rem,setRem]=useState("");

  const doAudit=useCallback((h,u)=>{if(!h?.trim())return;setHtml(h);setResults(analyze(h));setRem(autoFix(h));setTab("audit");if(u)setScUrl(u)},[]);
  const scanUrl=useCallback(async()=>{if(!url.trim())return;setFSt("loading");setFErr("");setResults(null);const r=await fetchURL(url.trim());if(r.ok){setFSt("done");setScUrl(r.url);setFErr(r.proxy||'');doAudit(r.html,r.url)}else{setFSt("error");setFErr(r.error)}},[url,doAudit]);

  const allIssues=useMemo(()=>{if(!results)return[];const l=[];results.forEach(r=>r.issues.filter(i=>i.s!==S.I).forEach(i=>{const rec=getRecommendation(r.id,i);l.push({...i,ruleId:r.id,ruleName:r.name,level:r.level,rec})}));return l.sort((a,b)=>a.rec.priority-b.rec.priority)},[results]);

  const filtered=useMemo(()=>{if(!results)return[];return results.filter(r=>{if(fL!=="ALL"&&r.level!==fL)return false;if(fP!=="ALL"&&r.p!==fP)return false;if(fS==="ISSUES"&&r.passed)return false;if(fS==="PASSED"&&!r.passed)return false;return true})},[results,fL,fS,fP]);

  const stats=useMemo(()=>{if(!results)return null;const t=results.length,p=results.filter(r=>r.passed).length;const all=results.flatMap(r=>r.issues).filter(i=>i.s!==S.I);return{total:t,passed:p,crit:all.filter(i=>i.s===S.C).length,maj:all.filter(i=>i.s===S.M).length,min:all.filter(i=>i.s===S.m).length,score:t>0?Math.round((p/t)*100):0,issues:all.length}},[results]);
  const sColor=stats?(stats.score>=80?"var(--ac)":stats.score>=50?"var(--or)":"var(--rd)"):"var(--tx3)";

  return<div style={{maxWidth:1120,margin:"0 auto",padding:"0 0 50px"}}>
    <header style={{borderBottom:"1px solid var(--bdr)",padding:"16px 26px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
      <div style={{display:"flex",alignItems:"center",gap:13}}>
        <div style={{width:38,height:38,borderRadius:10,background:"linear-gradient(135deg,#0ff0d4,#0ab89e)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800,color:"#06090f",fontFamily:"var(--f3)"}}>A</div>
        <div><h1 style={{margin:0,fontFamily:"var(--f1)",fontSize:25,fontWeight:600,lineHeight:1.1}}>WCAG 2.2 AAA Remediator</h1><p style={{margin:"2px 0 0",fontSize:11,color:"var(--tx3)"}}>ADA Compliance · AAA · URL Scanner · Prioritized Fixes</p></div>
      </div>
      {stats&&<div style={{display:"flex",alignItems:"baseline",gap:5}}><span style={{fontSize:42,fontFamily:"var(--f3)",fontWeight:700,color:sColor,lineHeight:1}}>{stats.score}</span><span style={{fontSize:12,color:"var(--tx3)"}}>/ 100</span></div>}
    </header>

    <section style={{padding:"18px 26px",borderBottom:"1px solid var(--bdr)"}}>
      <div style={{display:"flex",gap:0,marginBottom:14}}>
        {[["url","🔗 Scan URL"],["html","<> Paste HTML"]].map(([m,l])=><button key={m} onClick={()=>{setMode(m);setResults(null);setFSt(null)}} style={{padding:"9px 20px",fontSize:12.5,fontWeight:mode===m?700:500,cursor:"pointer",border:"1px solid var(--bdr)",borderBottom:mode===m?"2px solid var(--ac)":"1px solid var(--bdr)",background:mode===m?"var(--bg2)":"transparent",color:mode===m?"var(--ac)":"var(--tx3)",borderRadius:m==="url"?"8px 0 0 0":"0 8px 0 0"}}>{l}</button>)}
      </div>
      {mode==="url"&&<div><div style={{display:"flex",gap:8,marginBottom:8}}><input type="url" value={url} onChange={e=>{setUrl(e.target.value);setFSt(null)}} onKeyDown={e=>{if(e.key==="Enter")scanUrl()}} placeholder="https://example.com" style={{flex:1,padding:"11px 16px",background:"var(--bg3)",border:"1px solid var(--bdr)",borderRadius:9,color:"var(--tx)",fontFamily:"var(--f3)",fontSize:13}}/><button onClick={scanUrl} disabled={!url.trim()||fSt==="loading"} style={{padding:"11px 24px",fontSize:12.5,borderRadius:9,border:"none",background:url.trim()?"var(--ac)":"rgba(15,240,212,.2)",color:"#06090f",cursor:url.trim()?"pointer":"default",fontWeight:700,opacity:fSt==="loading"?.6:1}}>{fSt==="loading"?<><span className="spinner" style={{width:14,height:14,borderTopColor:"#06090f",borderColor:"rgba(0,0,0,.15)",marginRight:6,verticalAlign:"middle"}}/>Scanning…</>:"◉ Scan"}</button></div>{fSt==="error"&&<p style={{fontSize:12.5,color:"var(--rd)",padding:"8px 12px",background:"rgba(255,69,112,.06)",borderRadius:8,lineHeight:1.6}}>{fErr}</p>}{fSt==="done"&&<p style={{fontSize:12,color:"var(--ac)",padding:"6px 0"}}>✓ Fetched {scUrl} via {fErr} — {html.length.toLocaleString()} chars analyzed</p>}</div>}
      {mode==="html"&&<div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:6}}><span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".07em",color:"var(--tx3)",fontWeight:700}}>HTML Source</span><div style={{display:"flex",gap:7}}><button onClick={()=>{setHtml(SAMPLE);setResults(null)}} style={{padding:"6px 14px",fontSize:11.5,borderRadius:7,border:"1px solid var(--bdr)",background:"var(--bg2)",color:"var(--tx2)",cursor:"pointer"}}>Load Sample</button><button onClick={()=>doAudit(html,"")} disabled={!html.trim()} style={{padding:"6px 18px",fontSize:11.5,borderRadius:7,border:"none",background:html.trim()?"var(--ac)":"rgba(15,240,212,.2)",color:"#06090f",cursor:html.trim()?"pointer":"default",fontWeight:700}}>▶ Audit</button></div></div><textarea value={html} onChange={e=>{setHtml(e.target.value);setResults(null)}} placeholder="Paste HTML…" style={{width:"100%",minHeight:120,maxHeight:250,padding:"13px 15px",background:"var(--bg3)",border:"1px solid var(--bdr)",borderRadius:9,color:"var(--tx)",fontFamily:"var(--f3)",fontSize:11.5,lineHeight:1.6,resize:"vertical",boxSizing:"border-box"}}/></div>}
    </section>

    {results&&<><nav style={{display:"flex",borderBottom:"1px solid var(--bdr)",padding:"0 18px",overflowX:"auto"}}>{TABS.map(t=><button key={t.k} onClick={()=>setTab(t.k)} style={{position:"relative",padding:"12px 16px",fontSize:12,fontWeight:tab===t.k?600:400,cursor:"pointer",border:"none",background:"transparent",color:tab===t.k?"var(--ac)":"var(--tx3)",display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap",borderBottom:tab===t.k?"2px solid var(--ac)":"2px solid transparent"}}><span style={{fontSize:13}}>{t.i}</span>{t.l}</button>)}</nav>
    <div style={{padding:"20px 26px",minHeight:260}}>

    {/* ═ AUDIT ═ */}
    {tab==="audit"&&<><div style={{display:"flex",gap:7,marginBottom:14,flexWrap:"wrap"}}><Stat label="Rules" value={stats.total} color="var(--tx)"/><Stat label="Passed" value={stats.passed} color="var(--ac)"/><Stat label="Issues" value={stats.issues} color="var(--rd)"/><Stat label="Critical" value={stats.crit} color="var(--rd)"/><Stat label="Major" value={stats.maj} color="var(--or)"/><Stat label="Minor" value={stats.min} color="var(--bl)"/></div>
    <div style={{display:"flex",gap:9,marginBottom:14,flexWrap:"wrap"}}>{[["Level",fL,setFL,["ALL","A","AA","AAA"]],["Status",fS,setFS,["ALL","ISSUES","PASSED"]],["Principle",fP,setFP,["ALL","Perceivable","Operable","Understandable","Robust"]]].map(([l,v,s,o])=><div key={l} style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:9,color:"var(--tx3)",textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>{l}</span><select value={v} onChange={e=>s(e.target.value)} style={{padding:"5px 9px",fontSize:11,borderRadius:6,border:"1px solid var(--bdr)",background:"var(--bg3)",color:"var(--tx)",cursor:"pointer"}}>{o.map(x=><option key={x}>{x}</option>)}</select></div>)}</div>
    <div style={{display:"flex",flexDirection:"column",gap:4}}>{filtered.map(rule=>{const isO=exp===rule.id;const ic=rule.issues.filter(i=>i.s!==S.I).length;return<div key={rule.id} style={{background:"var(--bg2)",border:"1px solid var(--bdr)",borderRadius:9,overflow:"hidden"}}><button onClick={()=>setExp(isO?null:rule.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"11px 16px",border:"none",background:"transparent",cursor:"pointer",color:"var(--tx)",textAlign:"left",fontSize:12.5}}><span style={{width:7,height:7,borderRadius:"50%",background:rule.passed?"var(--ac)":"var(--rd)",flexShrink:0}}/><span style={{fontFamily:"var(--f3)",fontSize:11,color:"var(--ac)",fontWeight:600,minWidth:40}}>{rule.id}</span><span style={{fontWeight:500,flex:1}}>{rule.name}</span><Pill color={rule.level==="AAA"?"var(--pu)":rule.level==="AA"?"var(--bl)":"var(--ac)"} bg={rule.level==="AAA"?"rgba(184,136,255,.08)":rule.level==="AA"?"rgba(76,172,255,.08)":"var(--ac2)"}>{rule.level}</Pill><Pill color="var(--tx3)" bg="rgba(140,160,200,.05)">{rule.p}</Pill>{ic>0&&<span style={{fontFamily:"var(--f3)",fontSize:10,color:"var(--rd)",fontWeight:600}}>{ic}</span>}<span style={{fontSize:9,color:"var(--tx3)",transform:isO?"rotate(90deg)":"none",transition:"transform .15s"}}>▶</span></button>
    {isO&&<div style={{borderTop:"1px solid var(--bdr)",padding:"12px 16px"}}>{rule.issues.length===0?<p style={{fontSize:12.5,color:"var(--ac)",margin:0}}>✓ No issues.</p>:<div style={{display:"flex",flexDirection:"column",gap:12}}>{rule.issues.map((issue,idx)=>{const isI=issue.s===S.I;const rec=!isI?getRecommendation(rule.id,issue):null;return<div key={idx} style={{background:SB_[issue.s],borderRadius:8,padding:"12px 16px",borderLeft:`3px solid ${SC_[issue.s]}`}}>
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:6,flexWrap:"wrap"}}><Pill color={SC_[issue.s]} bg="transparent">{issue.s}</Pill>{rec&&<PriorityBadge p={rec.priority}/>}</div>
      <p style={{fontSize:12.5,margin:"0 0 5px",lineHeight:1.6}}>{issue.msg}</p>
      {issue.el&&issue.el!=="—"&&<code style={{display:"block",fontSize:10.5,color:"var(--tx2)",background:"rgba(0,0,0,.25)",padding:"7px 11px",borderRadius:5,marginBottom:5,wordBreak:"break-all",fontFamily:"var(--f3)",lineHeight:1.5}}>{issue.el}</code>}
      <div style={{fontSize:11.5,color:"var(--ac)",display:"flex",alignItems:"flex-start",gap:5}}><span>⮕</span><span style={{lineHeight:1.55}}>{issue.fix}</span></div>
      {rec&&<RecCard rec={rec} ruleId={rule.id} issue={issue}/>}
    </div>})}</div>}</div>}</div>})}</div></>}

    {/* ═ PRIORITY ═ */}
    {tab==="priority"&&<div>
      <h3 style={{margin:"0 0 14px",fontFamily:"var(--f1)",fontSize:19}}>Implementation Priority</h3>
      {allIssues.length===0?<p style={{color:"var(--ac)",fontSize:13}}>✓ No issues to prioritize — all checks passed!</p>:
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {[1,2,3,4].map(p=>{const items=allIssues.filter(i=>i.rec.priority===p);if(!items.length)return null;const labels=["","P1 — Fix Immediately","P2 — Fix This Sprint","P3 — Plan for Next Sprint","P4 — Backlog"];const colors=["","var(--rd)","var(--or)","var(--bl)","var(--tx3)"];return<div key={p} style={{background:"var(--bg2)",borderRadius:10,border:"1px solid var(--bdr)",overflow:"hidden"}}>
          <div style={{padding:"12px 18px",borderBottom:"1px solid var(--bdr)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{width:8,height:8,borderRadius:"50%",background:colors[p]}}/><span style={{fontSize:13,fontWeight:600,color:colors[p]}}>{labels[p]}</span></div>
            <span style={{fontSize:11,color:"var(--tx3)"}}>{items.length} issue{items.length>1?"s":""}</span>
          </div>
          <div style={{padding:"10px 18px"}}>{items.map((issue,i)=><div key={i} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"8px 0",borderBottom:i<items.length-1?"1px solid var(--bdr)":"none"}}>
            <span style={{fontFamily:"var(--f3)",fontSize:10,color:"var(--ac)",fontWeight:600,minWidth:36,paddingTop:2}}>{issue.ruleId}</span>
            <div style={{flex:1}}>
              <p style={{fontSize:12.5,margin:"0 0 3px",lineHeight:1.5}}>{issue.msg}</p>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}><Pill color={SC_[issue.s]} bg={SB_[issue.s]}>{issue.s}</Pill><span style={{fontSize:9,color:"var(--gn)",fontWeight:600,padding:"3px 8px",borderRadius:4,background:"rgba(52,211,153,.08)"}}>{issue.rec.effort}</span></div>
            </div>
          </div>)}</div>
        </div>})}
      </div>}
    </div>}

    {tab==="preview"&&<div><h3 style={{margin:"0 0 14px",fontFamily:"var(--f1)",fontSize:19}}>Side-by-Side Preview</h3><div style={{display:"flex",gap:14,flexWrap:"wrap"}}><LivePreview html={html} label="Original" color="var(--rd)"/><LivePreview html={rem} label="Remediated" color="var(--ac)"/></div></div>}
    {tab==="contrast"&&<ContrastChecker/>}
    {tab==="outline"&&<HeadingOutline html={html}/>}
    </div></>}

    {!results&&fSt!=="loading"&&<div style={{padding:"65px 26px",textAlign:"center"}}><div style={{fontSize:50,marginBottom:12,opacity:.1,fontFamily:"var(--f3)"}}>⬡</div><p style={{fontSize:17,color:"var(--tx2)",margin:"0 0 5px",fontFamily:"var(--f1)"}}>Enter a URL or paste HTML to begin</p><p style={{fontSize:12.5,color:"var(--tx3)"}}>{RULES.length} WCAG 2.2 criteria · A/AA/AAA · Visual before/after examples</p></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
